  }
  function buildStandingItemChecks(dateISO) {
    return (STANDING_ITEMS || [])
      .filter(it => (it.owner || '') === CALENDAR_OWNER && standingItemDueOn(it, dateISO))
      // kind:'info' — a recurring Ops Manual duty, not a persisted/trackable task, so it
      // has nothing to open. No checkbox glyph, no click — see .today-admin-line CSS.
      .map(it => ({ label: it.title, sub: it.sourceSOP || '', taskId: null, kind: 'info' }));
  }
  function buildTodayFixed(dateISO) {
    const today = dateISO || todayISO();
    const fixed = [];
    // SOD (morning) plans the day: today's Ops Manual duties, today's quick-touch admin
    // tasks, and the confirm-delegates rollup. EOD (evening) closes it out: the same
    // quick-touch tasks and confirm rollup, recomputed live so anything already finished
    // during the day has naturally dropped off — but NOT the Ops Manual duties, which
    // aren't a "did I get to this" kind of check. The two blocks are genuinely different
    // queries, not one list mechanically split in half — each caps independently at
    // TODAY_ADMIN_MAX_PER_BLOCK with its own "+N more" overflow line.
    const statics = TODAY_ADMIN_STATIC_ITEMS.map(label => ({ label: label, sub: '', taskId: null }));
    const sodDynamic = buildStandingItemChecks(today).concat(buildOperationalTaskChecks(today)).concat(buildConfirmRollupCheck());
    const eodDynamic = buildOperationalTaskChecks(today).concat(buildConfirmRollupCheck());
    const perBlockSlots = Math.max(0, TODAY_ADMIN_MAX_PER_BLOCK - statics.length);
    // Overflow used to just say "— see Board" with nothing behind the click. Now it
    // collects the real ids of whatever got dropped (a dropped 'group' line's own ids
    // count too) so it opens exactly those tasks; only when nothing droppable is a real
    // task (e.g. only Ops Manual duties got cut) does it fall back to just switching to

    function capped(list) {

      const uniqueIds = Array.from(new Set(ids));

      return shown.concat([{ label: label, sub: '', taskId: null, kind: uniqueIds.length ? 'group' : 'nav', ids: uniqueIds }]);
    }
    const amItems = statics.concat(capped(sodDynamic));
    const pmItems = statics.concat(capped(eodDynamic));
    fixed.push({ kind: 'admin', title: 'Morning Admin', start: hmToMin(TODAY_DAY_START), end: hmToMin(TODAY_DAY_START) + TODAY_ADMIN_MIN, items: amItems });
    fixed.push({ kind: 'admin', title: 'Evening Wrap-Up', start: hmToMin(TODAY_DAY_END) - TODAY_ADMIN_MIN, end: hmToMin(TODAY_DAY_END), items: pmItems });
    // Tasks/subitems linked to a real meeting (linkMeetingToTarget) that this calendar

    // showing up as their own generic filler blocks (see the matching exclusion in

    const linkableToday = getWorkItems(TASKS).filter(t => t.status !== 'Done'
      && (t.delegate || 'Unassigned') === CALENDAR_OWNER
      && ((t.meetingDate === today && t.meetingStart) || (t.meetingSeriesId && CALENDAR_EVENTS.some(ev => ev && ev.date === today && ev.seriesId === t.meetingSeriesId))));
    const events = CALENDAR_EVENTS.filter(ev => ev && ev.date === today && ev.start && ev.end)
      .map(ev => {
        const meetingStart = hmToMin(ev.start), meetingEnd = hmToMin(ev.end);
        const offSite = ev.offSite != null ? ev.offSite : todayIsOffSiteMeeting_(ev);
        const prepMin = ev.prepMin != null ? ev.prepMin : TODAY_MEETING_PREP_MIN;
        const travelMin = ev.travelMin != null ? ev.travelMin : (offSite ? TODAY_MEETING_TRAVEL_MIN : 0);
        // The block reserved on the visual timeline spans prep + (round-trip) travel
        // around the real meeting time, so task work never gets shown packed right up
        // against a commute — matching the capacity the server-side scheduler already
        // reserves via bufferedHours (Code.gs: getCalendarHours).
        return {

    let errandStart = hmToMin('10:00');
    if (overlaps(errandStart, errandStart + TODAY_ERRAND_MIN)) {

          lunchStart = lunchStart - delta; found = true; break;
        }
        if (lunchStart + delta + TODAY_LUNCH_MIN <= hmToMin(TODAY_DAY_END) - TODAY_ADMIN_MIN && !overlaps(lunchStart + delta, lunchStart + delta + TODAY_LUNCH_MIN)) {

        }

  // due date and estimate — everything a top-level task has except an owner, since
  // accountability for the work stays with the parent task, not the delegated piece.
  // A task can also carry a whole-task delegate (t.delegate, editable on the row and in the
  // modal since 2026-09-15); subtasks remain the finer unit.
  // Shared by the board's expandable sub-row and the task detail modal so both stay in sync.
  function subitemRowHtml(t, s, i) {
    const due = s.timelineEnd || '';
    const overdueSub = due && due < todayISO() && !s.done;
    const blockedIdx = subitemBlockedBy(t, i);
    const blockedNote = blockedIdx != null
      ? `<div class="sub-blocked-note" title="Subitems chain sequentially by default — this one waits on the subitem it depends on.">&#128274; Blocked by: ${escapeHtml(t.subitems[blockedIdx].title)}</div>`
      : '';
    // "Previous subtask" (the default chain) is left unselected — s.depends only holds a
    // value when it's an explicit OVERRIDE of the default sequential chain. subitemBlockedBy()
    // never default-blocks i === 0 (there is no previous subitem), so that index's empty
    // option reads "No dependency (default)" instead of "Previous subtask (default)" — but
    // the selector itself stays visible at every index (fixed 2026-09-01) so an explicit
    // override that lands at index 0 via drag-and-drop reorder remains visible/editable
    // instead of being silently hidden.
    const dependsOptions = t.subitems.map(function(other, oi) {
      if (oi === i) return '';
      return `<option value="${oi}" ${String(s.depends) === String(oi) ? 'selected' : ''}>${escapeHtml(other.title.slice(0, 40))}</option>`;
    }).join('');
    const tagsHtml = (s.tags || []).map(function(tag, ti) {
      return `<span class="tag-chip ${tagClass(tag)}" onclick="removeSubTag(${t.id}, ${i}, ${ti})" title="Click to remove">${escapeHtml(tag)}</span>`;
    }).join('');
    return `
      <div class="sub-item ${s.done ? 'done' : ''}" data-sub-idx="${i}" ondragover="onSubDragOver(event, ${t.id}, ${i})" ondragleave="onSubDragLeave(event)" ondrop="onSubDrop(event, ${t.id}, ${i})">
        <span class="sub-drag-handle" draggable="true" title="Drag to reorder" ondragstart="onSubDragStart(event, ${t.id}, ${i})" ondragend="onSubDragEnd(event)">&#8942;&#8942;</span>
        <input type="checkbox" ${s.done ? 'checked' : ''} ${blockedIdx != null ? 'title="Blocked by an earlier subitem — you can still check it off, but consider finishing that one first."' : ''} onchange="toggleSubitem(${t.id}, ${i}, this)">
        <div class="sub-item-body">
          <div class="sub-item-title-row">
            <span class="sub-title-edit" contenteditable="true" onblur="onSubFieldEdit(${t.id}, ${i}, 'title', this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${escapeHtml(s.title)}</span>
            <button class="icon-btn danger" title="Delete subitem" onclick="deleteSubitem(${t.id}, ${i})">${TRASH_ICON_SVG}</button>
          </div>
          ${blockedNote}
          <div class="sub-meta">
            <span class="sub-delegate" title="Delegate — who this subtask is delegated to">${avatarHtml(s.delegate)}${delegateSelect(t.id, i, s.delegate)}</span>
            ${subPillSelect('status', s.status, t.id, i)}
            ${subPillSelect('priority', s.priority, t.id, i)}
            <span class="sub-due ${overdueSub ? 'overdue' : ''}"><input type="date" class="due-input" value="${due}" onchange="onSubFieldChange(${t.id}, ${i}, 'timelineEnd', this.value)"></span>
            <span class="sub-hours"><input type="number" min="0.25" step="0.25" class="due-input sub-hours-input" value="${s.estHours != null ? s.estHours : ''}" placeholder="hrs" onchange="onSubFieldChange(${t.id}, ${i}, 'estHours', this.value ? Number(this.value) : null)"></span>
            ${t.subitems.length > 1 ? `<select class="due-input sub-depends-select" title="Depends on — defaults to the subitem right before it" onchange="onSubFieldChange(${t.id}, ${i}, 'depends', this.value)"><option value="">${i > 0 ? 'Previous subtask (default)' : 'No dependency (default)'}</option>${dependsOptions}</select>` : ''}
          </div>
          <div class="sub-meta">${tagsHtml}<button type="button" class="icon-btn" onclick="addSubTag(${t.id}, ${i})" title="Add tag">+ tag</button></div>
          <div class="sub-meta">
            <select class="due-input sub-type-select" title="Type" onchange="onSubFieldChange(${t.id}, ${i}, 'taskType', this.value)">${TASK_TYPES.map(function(o) { return '<option value="' + o + '"' + (o === (s.taskType || 'Actionable Task') ? ' selected' : '') + '>' + o + '</option>'; }).join('')}</select>
            ${s.taskType === 'Meeting' ? `<button type="button" class="icon-btn" onclick="openMeetingPicker(${t.id}, ${i})" title="Link a calendar meeting">${(s.docs || []).some(d => d.type === 'meeting') ? '&#128197; meeting' : '+ meeting'}</button>` : ''}
          </div>
          <div class="sub-meta sub-docs-row">${docsListHtml(s.docs, t.id, i)}<button type="button" class="icon-btn" onclick="addManualDoc(${t.id}, ${i})" title="Add a link or file">+ link</button></div>
          ${s.notes ? `<div class="sub-item-notes" contenteditable="true" onblur="onSubFieldEdit(${t.id}, ${i}, 'notes', this)">${escapeHtml(s.notes)}</div>` : `<div class="sub-item-notes sub-item-notes-empty" contenteditable="true" onblur="onSubFieldEdit(${t.id}, ${i}, 'notes', this)" data-placeholder="Add notes…"></div>`}
        </div>
      </div>`;
  }
  function addSubTag(id, idx) {
    const tag = prompt('New tag:');
    if (!tag || !tag.trim()) return;
    const t = findTask(id);
    const s = t.subitems[idx];
    s.tags = [...(s.tags || []), tag.trim()];
    logHistory(t, 'subitem-tag', s.title, tag.trim());
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  function removeSubTag(id, idx, tagIdx) {
    const t = findTask(id);
    const s = t.subitems[idx];
    const removed = (s.tags || [])[tagIdx];
    s.tags.splice(tagIdx, 1);
    logHistory(t, 'subitem-tag', s.title, 'removed: ' + removed);
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }

  // Review gate (2026-09-15): a pushed task pointed at a delegate carries 'Triage' (the
  // same tag the estimator uses for an estimate worth confirming, so the toolbar's Triage
  // filter is the one quick list) and is invisible on their page until the tag is cleared.
  // The row chip is that clear: it strips Triage from the task and every subitem and logs
  // the release. Subitem-level holds also clear through the subitem row's own chip.
  function reviewChipHtml(id) {
    return `<button type="button" class="tag-chip tag-warn review-chip" onclick="event.stopPropagation(); approveReview(${id})" title="Triage: check the estimate and/or the delegate, then click to clear. Until then it is held off the delegate's view.">Triage &#10003;</button>`;
  }
  function approveReview(id) {
    const t = findTask(id);
    if (!t) return;
    t.tags = (t.tags || []).filter(tag => tag !== 'Triage');
    (t.subitems || []).forEach(s => { if (s.tags) s.tags = s.tags.filter(tag => tag !== 'Triage'); });
    logHistory(t, 'review', 'Triage', 'Cleared; released to the delegate views');
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  // Delegate views (2026-09-15, per Durand: "filtered views in pop ups instead"): the
  // person's whole slice, as a scoped list pop-up on this board. Shift-click opens the
  // page they actually see, from this tab's session.
  function personTaskIds_(name) {
    return TASKS.filter(function(t) {
      if (t.owner === name || taskDelegate(t) === name) return true;
      return (t.subitems || []).some(function(s) { return s.delegate === name; });
    }).map(function(t) { return t.id; });
  }
  function openPersonView(name) {
    const ids = personTaskIds_(name);
    if (!ids.length) { alert('Nothing on the board is owned by, assigned to, or delegated to ' + name + ' yet.'); return; }
    openMultiTaskModal(name + "'s view", ids, { delegate: name });
  }
  function taskRowHtml(t) {
    const pct = taskProgress(t);
    const hasSubs = t.subitems && t.subitems.length > 0;
    const subOpen = hasSubs && expandedSubtasks.has(t.id);
    const tagsHtml = (t.tags || []).map(tag => tag === 'Triage' ? reviewChipHtml(t.id) : tagChipHtml(tag)).join('');
    let html = `
      <tr class="task-row" data-id="${t.id}" onclick="onRowClick(event, ${t.id})">
        <td>${hasSubs ? `<button class="icon-btn" onclick="toggleSub(${t.id})">${subOpen ? '▾' : '▸'}</button>` : ''}</td>
        <td class="title-cell"><span class="ttl-edit" contenteditable="true" onblur="onTitleEdit(${t.id}, this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${escapeHtml(t.title)}</span>${commentBadgeHtml_(t.id)}${hasSubs ? `<span class="sub-count-badge" title="${t.subitems.filter(s=>s.done).length} of ${t.subitems.length} subtasks done">${t.subitems.filter(s=>s.done).length}/${t.subitems.length}</span>` : ''}${docLinkHtml(t)}</td>
        <td class="cell-group">
          <div class="cell-group-stack">
            <div class="cell-group-row owner-cell" title="Owner — accountable for this task">${avatarHtml(t.owner)}${ownerSelect(t.id, t.owner)}</div>
            <div class="cell-group-row owner-cell delegate-cell" title="Delegate — who is doing this task; it appears on their page"><span class="mini-lbl">Delegate</span>${avatarHtml(taskDelegate(t))}${taskDelegateSelect(t.id, taskDelegate(t))}</div>
            <div class="cell-group-row">${hasSubs
              ? `<span class="pill ${statusClass(rollupStatus(t))}" style="pointer-events:none;" title="Rolled up from subtasks — edit status on the subtasks below.">${escapeHtml(rollupStatus(t))}</span><span class="pill ${priorityClass(rollupPriority(t))}" style="pointer-events:none;" title="Rolled up from subtasks — edit priority on the subtasks below.">${escapeHtml(rollupPriority(t))}</span>`
              : `${pillSelect('status', t.status, t.id)}${pillSelect('priority', t.priority, t.id)}`
            }</div>
          </div>
        </td>
        <td class="cell-group">
          <div class="cell-group-stack">
            <div class="cell-group-row tags-cell">${typeBadgeHtml(t)}${tagsHtml}<button type="button" class="icon-btn" onclick="addTag(${t.id})" title="Add tag">+</button></div>
            <div class="cell-group-row">
              <span class="due-cell ${isOverdue(t) ? 'overdue' : ''}"><input type="date" class="due-input" value="${t.timelineEnd || ''}" onchange="onDueChange(${t.id}, this)"></span>
              <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>
            </div>
            <div class="cell-group-row">${bonusCountdownHtml_(t)}</div>
          </div>
        </td>
        <td class="notes-cell"><span contenteditable="true" onblur="onFieldEdit(${t.id}, 'notes', this)">${escapeHtml(t.notes || '')}</span></td>
        <td class="row-actions">
          <button class="icon-btn danger" title="Delete task" onclick="deleteTask(${t.id})">${TRASH_ICON_SVG}</button>
        </td>
      </tr>`;
    if (hasSubs) {
      html += `
      <tr class="sub-row" id="subrow-${t.id}" style="display:${subOpen ? '' : 'none'};">
        <td colspan="6">
          <div class="sub-list">
            ${t.subitems.map((s, i) => subitemRowHtml(t, s, i)).join('')}
          </div>
          <div class="add-sub-row">
            <textarea class="text-input" rows="1" style="resize:vertical;overflow:hidden;line-height:1.4;" placeholder="Add subitem — assign it, then flesh out the rest inline… (Enter to add, then keep typing the next one)" id="newsub-${t.id}" oninput="autoGrowTextarea_(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();addSubitemAndRefocus_(${t.id}, false);}"></textarea>
            <button class="btn small" onclick="addSubitemAndRefocus_(${t.id}, false)">+ Subitem</button>
          </div>
        </td>
      </tr>`;
    }
    return html;
  }

  // ---- Interaction handlers ----
  function findTask(id) { return TASKS.find(t => t.id === id); }

  function logHistory(t, field, from, to) {
    if (!t.history) t.history = [];
    t.history.push({ ts: new Date().toISOString(), field: field, from: from, to: to });
  }

  function onPillChange(el) {
    const id = Number(el.dataset.id), kind = el.dataset.kind;
    const t = findTask(id);
    const before = t[kind];
    // Marking the OPEN task Done drops it out of whatever nav list got you here (a
    // popup's scoped list, or the default Today/open-tasks order, which deliberately
    // excludes Done tasks — see defaultModalNavOrder()) — same "arrows go dead" failure
    // as the delete case above, just triggered by a status edit instead of a delete
    // (2026-09-03, per Durand: "marking done still disables list scrolling"). Work out
    // where to land BEFORE mutating anything, same landing rule as deleteTask(): the next
    // item at this position, or the previous one if this was last.
    let landOnId = null;
    if (kind === 'status' && el.value === 'Done' && currentModalTaskId === id) {
      const order = currentFilteredOrder.length ? currentFilteredOrder : defaultModalNavOrder();
      const idx = order.indexOf(id);
      if (idx !== -1) {
        const rest = order.filter(function(x) { return x !== id; });
        if (rest.length) landOnId = idx < rest.length ? rest[idx] : rest[rest.length - 1];
      }
    }
    t[kind] = el.value;
    if (kind === 'status' && el.value === 'Done') t.progress = 100;
    if (before !== el.value) logHistory(t, kind, before, el.value);
    renderAll();
    if (landOnId != null) openTaskCard(landOnId);
    scheduleSave();
  }
  function onDueChange(id, el) {
    const t = findTask(id);
    const before = t.timelineEnd;
    t.timelineEnd = el.value;
    if (before !== el.value) { logHistory(t, 'due', before, el.value); cascadeDependents(id); }
    renderAll(); scheduleSave();
  }
  function onTitleEdit(id, el) {
    const t = findTask(id);
    const before = t.title;
    const after = el.textContent.trim();
    t.title = after;
    if (before !== after) logHistory(t, 'title', before, after);
    renderStats(); scheduleSave();
  }
  function onFieldEdit(id, field, el) {
    const t = findTask(id);
    const before = t[field];
    const after = el.textContent.trim();
    t[field] = after;
    if (before !== after) logHistory(t, field, before, after);
    scheduleSave();
  }
  function addTag(id) {
    const tag = prompt('New tag:');
    if (tag && tag.trim()) {
      const t = findTask(id);
      t.tags = [...(t.tags || []), tag.trim()];
      logHistory(t, 'tag', null, tag.trim());
      renderAll(); scheduleSave();
    }
  }
  function toggleSub(id) {
    if (expandedSubtasks.has(id)) expandedSubtasks.delete(id); else expandedSubtasks.add(id);
    renderAll();
  }
  // Checking a subtask off also settles its status to Done (and un-checking backs it off
  // Done) so the two stay in sync — a subtask's status pill and its checkbox never disagree.
  function toggleSubitem(id, idx, el) {
    const t = findTask(id);
    const s = t.subitems[idx];
    s.done = el.checked;
    s.status = el.checked ? 'Done' : (s.status === 'Done' ? 'Not Started' : (s.status || 'Not Started'));
    logHistory(t, 'subitem', s.title, el.checked ? 'checked' : 'unchecked');
    // Marking a subitem done (or un-done) changes how much of the parent's rolled-up
    // estHours is actually still outstanding — recompute immediately rather than waiting
    // on the next full data reload (2026-09-01, per Durand: a done subtask's time should
    // come off the parent right away).
    rollupSubitemEstimate(t);
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  // Subitem field edits mirror the top-level onFieldEdit/onPillChange/onDueChange handlers,
  // scoped to one subitem by index. Re-opens the modal after, too, since subitemRowHtml is
  // shared between the board's sub-row and the task detail modal.
  function onSubPillChange(el) {
    const id = Number(el.dataset.id), idx = Number(el.dataset.idx), kind = el.dataset.kind;
    const t = findTask(id);
    const s = t.subitems[idx];
    const before = s[kind];
    s[kind] = el.value;
    if (kind === 'status') s.done = (el.value === 'Done');
    if (before !== el.value) logHistory(t, 'subitem-' + kind, s.title + ': ' + (before || '—'), el.value);
    // Status can flip done-ness too (e.g. picking "Done" from the pill instead of the
    // checkbox) — keep the parent rollup in sync either way.
    if (kind === 'status') rollupSubitemEstimate(t);
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  function onSubFieldEdit(id, idx, field, el) {
    const t = findTask(id);
    const s = t.subitems[idx];
    const before = s[field];
    const after = el.textContent.trim();
    s[field] = after;
    if (before !== after) logHistory(t, 'subitem-' + field, s.title, after);
    if (field === 'title') { renderAll(); if (currentModalTaskId === id) openTaskCard(id); }
    scheduleSave();
  }
  function onSubFieldChange(id, idx, field, val) {
    const t = findTask(id);
    const s = t.subitems[idx];
    const before = s[field];
    s[field] = val;
    if (before !== val) {
      logHistory(t, 'subitem-' + field, s.title + ': ' + (before == null ? '—' : before), val == null ? '—' : val);
      if (field === 'estHours') rollupSubitemEstimate(t);
    }
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  // Shared depends-remap step for any operation that shifts subitem indices (reorder,
  // delete). s.depends is an INDEX into the subitems array, not a stable id, so every
  // explicit override has to be repointed to follow the SAME referenced subitem OBJECT to
  // wherever it now sits. `beforeOrder` is the pre-change array (old index -> reference).
  // '' and 'none' both mean "no explicit override" — matching subitemBlockedBy and the
  // server — so there's nothing to remap for those. A reference that's no longer in the
  // array (the subitem it depended on was the one just deleted) or an index that never
  // resolved is cleared rather than left pointing at whatever moved into that slot.
  function remapDepends_(subs, beforeOrder) {
    subs.forEach(function(s) {
      const raw = String(s.depends || '').trim().toLowerCase();
      if (raw === '' || raw === 'none') return;
      const oldIdx = parseInt(raw, 10);
      if (isNaN(oldIdx) || !beforeOrder[oldIdx]) { s.depends = ''; return; }
      const newIdx = subs.indexOf(beforeOrder[oldIdx]);
      s.depends = newIdx === -1 ? '' : String(newIdx);
    });
  }
  function deleteSubitem(id, idx) {
    if (!confirm('Delete this subtask?')) return;
    const t = findTask(id);
    // Deleting shifts every later index down by one. Without the remap below, a subitem
    // that explicitly depended on index 3 silently started depending on whatever slid into
    // slot 3 — a completely unrelated subitem — or on the deleted one's ghost. reorder
    // already handled this; delete never did.
    const beforeOrder = t.subitems.slice(); // old index -> subitem reference
    t.subitems.splice(idx, 1);
    remapDepends_(t.subitems, beforeOrder);
    rollupSubitemEstimate(t);
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  // ---- Subitem drag-and-drop reordering (2026-09-01) ----
  // s.depends is an INDEX into the subitems array, not a stable id (see subitemBlockedBy
  // above), so a plain array move would silently repoint every explicit depends override
  // at whatever now sits at its old index. dragSubState_ carries the dragged subitem's
  // identity (task id + object reference, not just its index) across the drag so the drop
  // handler can find where it actually came from even if indices shifted mid-drag; the
  // remap step below then rewrites every depends value to follow the SAME referenced
  // subitem to its new position, wherever that ends up.
  let dragSubState_ = null;
  function onSubDragStart(ev, taskId, idx) {
    const t = findTask(taskId);
    dragSubState_ = { taskId: taskId, ref: t.subitems[idx] };
    ev.dataTransfer.effectAllowed = 'move';
    try { ev.dataTransfer.setData('text/plain', String(idx)); } catch (e) { /* some browsers require this call even if unused */ }
    const row = ev.target.closest('.sub-item');
    if (row) row.classList.add('dragging');
  }
  function onSubDragOver(ev, taskId, idx) {
    if (!dragSubState_ || dragSubState_.taskId !== taskId) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    const row = ev.currentTarget;
    if (row && dragSubState_.ref !== findTask(taskId).subitems[idx]) row.classList.add('drag-over');
  }
  function onSubDragLeave(ev) {
    const row = ev.currentTarget;
    if (row) row.classList.remove('drag-over');
  }
  function onSubDrop(ev, taskId, dropIdx) {
    ev.preventDefault();
    const row = ev.currentTarget;
    if (row) row.classList.remove('drag-over');
    if (!dragSubState_ || dragSubState_.taskId !== taskId) { dragSubState_ = null; return; }
    const t = findTask(taskId);
    const fromIdx = t.subitems.indexOf(dragSubState_.ref);
    dragSubState_ = null;
    if (fromIdx === -1 || fromIdx === dropIdx) return;
    reorderSubitems(t, fromIdx, dropIdx);
  }
  function onSubDragEnd(ev) {
    document.querySelectorAll('.sub-item.dragging, .sub-item.drag-over').forEach(function(el) {
      el.classList.remove('dragging'); el.classList.remove('drag-over');
    });
    dragSubState_ = null;
  }
  function reorderSubitems(t, fromIdx, toIdx) {
    const subs = t.subitems;
    const beforeOrder = subs.slice(); // old index -> subitem reference, for remapping depends below
    const moved = subs.splice(fromIdx, 1)[0];
    subs.splice(toIdx, 0, moved);
    // Every explicit depends value is an old-array index; repoint it at wherever the SAME
    // referenced subitem landed in the new order (or clear it if that subitem is gone —
    // shouldn't happen here since nothing is removed by a reorder, but don't guess).
    // Shared with deleteSubitem, which needs the identical remap. See remapDepends_.
    remapDepends_(subs, beforeOrder);
    logHistory(t, 'subitem-reorder', moved.title, 'moved to position ' + (toIdx + 1) + ' of ' + subs.length);
    renderAll(); if (currentModalTaskId === t.id) openTaskCard(t.id); scheduleSave();
  }
  // Keeps the parent's estHours as the sum of its subtask estimates whenever any of them
  // have a number set — same rollup used when tasks were first consolidated into subtasks.
  // A done subitem's hours are excluded from the sum (this tracks work remaining, not work
  // ever planned — 2026-09-01), but a done subitem that DID carry real hours still counts
  // toward "any", so a task whose subitems are all done correctly rolls up to 0 instead of
  // being left at a stale number. This is a lighter client-side mirror of the server's
  // tsgRollupSubitemHours_ (Code.gs) for instant feedback — it doesn't include the
  // invisible 0.5h handoff cost that only the server computes; the authoritative number
  // still comes from the next save round-trip.
  function rollupSubitemEstimate(t) {
    let hours = 0, any = false;
    (t.subitems || []).forEach(function(s) {
      if (s.estHours != null && !isNaN(s.estHours)) {
        any = true;
        if (!s.done) hours += s.estHours;
      }
    });
    if (any) t.estHours = Math.round(hours * 100) / 100;
  }

  // ---- Task detail card ----
  function onRowClick(e, id) {
    const tag = e.target.tagName;
    if (tag === 'SELECT' || tag === 'INPUT' || tag === 'BUTTON' || tag === 'OPTION') return;
    if (e.target.closest('[contenteditable="true"]')) return;
    if (e.target.closest('.icon-btn')) return;
    openTaskCard(id);
  }
  function formatDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  function historyLabel(h) {

  // terminal-authored _Inbox patch uses, dedup classifier included — instead of being
  // pushed straight into the local array and folded into the next full-document save.
  // That second path used to let a task onto the board with no dedup check at all and a
  // client-guessed id; now there's exactly one way a task gets added, from any source.
  async function createTask(fields) {
    setSyncStatus('saving');
    try {
      const res = await apiFetch('', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        // ownerCreated: this add is Durand's own (tsgRpc is owner-only), so a delegate set
        // here is deliberate and the server's review gate must not hold it (2026-09-15).
        body: JSON.stringify({ op: 'add_task', task: fields, ownerCreated: true })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const resp = await res.json();
      if (resp && resp.ok === false) {
        if (resp.error === 'conflict') {
          setSyncStatus('conflict', 'The tracker changed elsewhere since this loaded — reloading the latest version. Please retry adding the task.');
          // keepStatus — same reason as the conflict branch in doSaveNow_: the reload's own
          // status updates would otherwise wipe this warning before it could be read.
          await loadData(false, true);
          return { ok: false, error: 'conflict' };
        }
        throw new Error(resp.error || 'Add failed');
      }
      if (typeof resp.docVersion === 'number') RAW_META.docVersion = resp.docVersion;
      const result = resp && resp.addResult;
      if (result && result.verdict === 'added' && typeof result.taskId === 'number') {
        TASKS.push(Object.assign({}, fields, { id: result.taskId, subitems: fields.subitems || [], history: fields.history || [] }));
        setSyncStatus('saved');
        renderAll();
        return { ok: true, added: true };
      }
      // The classifier caught something — an exact duplicate, a near-duplicate folded in
      // as an update, or a related task merged in as a subitem. No new task was added
      // locally; reload so this tab reflects whatever actually happened server-side.
      await loadData(false);
      setSyncStatus('saved');
      const note = result && result.matchedTaskId != null
        ? (result.verdict === 'duplicate'
            ? 'That looked like a duplicate of task #' + result.matchedTaskId + ' — nothing new was added.'
            : 'Merged into task #' + result.matchedTaskId + ' instead of creating a new one.')
        : 'Handled without creating a new task.';
      return { ok: true, added: false, note: note };
    } catch (err) {
      setSyncStatus('error', err.message || err);
      return { ok: false, error: err.message || String(err) };
    }
  }

  // ---- Live sync with Drive (via Apps Script Web App) ----
  function buildDoc() {
    return {
      // Spread the raw meta we last loaded FIRST, so fields this dashboard doesn't
      // manage directly (scan watermarks, dismissedGoogleTaskIds, errands, etc.) survive
      // every save — only the fields below are ever overwritten by the dashboard itself.
      meta: Object.assign({}, RAW_META, {
        version: 2,
        created: META.created || META.lastUpdated,
        last_updated: todayISO(),
        owner: 'Durand',
        status_values: STATUSES,
        priority_values: PRIORITIES,
        next_id: nextId,
        teamRoster: TEAM_ROSTER
      }),

  // ---- Sync pill + connection-lost overlay (2026-09-03, per Durand) ----
  // Three colors, three meanings:
  //  - RED: no confirmed connection. Covers both "never loaded successfully yet" (the
  //    empty preload screen, before we know the API even works) and "was working, just
  //    lost it." Either way, the full-screen overlay below takes over: everything behind
  //    it is disabled and greyed out until the connection is confirmed good again.
  //  - AMBER/yellow: actively loading or saving, but on top of an already-proven-good
  //    connection — non-blocking, the app stays fully usable while this shows.
  //  - GREEN: synced/idle. Last operation succeeded.
  const DEFAULT_ERROR_MSG = "Couldn't reach the Task Tracker API. Edits still work in this tab but won't save to Drive until reconnected.";
  let syncFailCount = 0;
  let lastFailedOp = null; // 'load' | 'save' | null — which retry attemptReconnect() should run
  let reconnectTimer = null;
  const RECONNECT_DELAY_MS = 5000;
  const RECONNECT_ESCALATE_AFTER = 3; // auto-retries before switching to the "needs a person" view

  function setSyncStatus(state, detail) {
    const el = document.getElementById('syncStatus');
    let cls, label;
    if (state === 'error') {
      cls = 'bad';
      label = detail ? String(detail) : DEFAULT_ERROR_MSG;
      syncFailCount++;
      scheduleReconnect_();
      showConnOverlay_(syncFailCount > RECONNECT_ESCALATE_AFTER ? 'escalated' : 'reconnecting', label);
    } else if (state === 'loading' || state === 'saving') {
      if (!dataLoaded) {
        // Nothing has ever loaded in this tab yet — treat exactly like a lost connection:
        // red pill, blocking overlay, until the very first load actually succeeds.
        cls = 'bad';
        label = 'Connecting to your Task Tracker…';
        showConnOverlay_('reconnecting', label);
      } else {
        cls = 'warn';
        label = state === 'saving' ? 'Saving…' : 'Loading…';
        hideConnOverlay_();
      }
    } else if (state === 'conflict') {
      // Self-resolving — the caller already reloads the latest version immediately after
      // this. Worth flagging (amber, not green) but not worth blocking the whole app over.
      cls = 'warn';
      label = detail ? String(detail) : 'Resolving a change made elsewhere…';
      hideConnOverlay_();
    } else {
      // 'saved' / 'loaded' / any other success path.
      cls = 'ok';
      label = 'Synced';
      syncFailCount = 0;
      lastFailedOp = null;
      clearTimeout(reconnectTimer);
      hideConnOverlay_();
    }
    el.className = 'sync-pill ' + cls;
    el.title = label;
  }

  function scheduleReconnect_() {
    clearTimeout(reconnectTimer);
    // Past the escalation threshold, stop auto-retrying silently in the background —
    // the overlay has switched to asking a person to act, and "Retry now" covers it.
    if (syncFailCount > RECONNECT_ESCALATE_AFTER) return;
    reconnectTimer = setTimeout(attemptReconnect, RECONNECT_DELAY_MS);
  }
  function attemptReconnect() {
    clearTimeout(reconnectTimer);
    if (lastFailedOp === 'save') doSave();
    else loadData();
  }
  function showConnOverlay_(kind, message) {
    document.body.classList.add('conn-blocking');
    document.getElementById('connOverlay').hidden = false;
    const icon = document.getElementById('connIcon');
    const title = document.getElementById('connTitle');
    const exportBtn = document.getElementById('connExportBtn');
    if (kind === 'escalated') {
      icon.innerHTML = '&#9888;&#65039;';
      title.textContent = 'Connection problem';
      exportBtn.hidden = false;
    } else {
      icon.innerHTML = '<div class="conn-spinner"></div>';
      title.textContent = dataLoaded ? 'Reconnecting…' : 'Connecting…';
      exportBtn.hidden = true;
    }
    document.getElementById('connDetail').textContent = message;
  }
  function hideConnOverlay_() {
    document.body.classList.remove('conn-blocking');
    document.getElementById('connOverlay').hidden = true;
  }

  let saveTimer = null;
  // Per-card "Saved" pill: best-effort, tracks whichever task's modal is open at the moment
  // a save is scheduled (the vast majority of edits go through the task modal). Inline edits
  // made with no modal open won't get a pill — there's no reliable per-field edit hook to
  // attach to without touching every one of the ~24 call sites that call scheduleSave().
  const JUST_SAVED_IDS = new Set();
  let justSavedTimer = null;
  let pendingSaveId = null;
  function scheduleSave() {
    setSyncStatus('saving');
    if (currentModalTaskId != null) pendingSaveId = currentModalTaskId;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 600);
  }
  // Reentrancy guard. doSave() sends the WHOLE document plus the docVersion this tab last
  // saw, so two saves in flight at once race: the second was built (and version-stamped)
  // before the first came back, so it either loses the first save's changes or trips a
  // spurious conflict. Serialise them — a save started while one is in flight simply runs
  // after it, against the version the first one just established.
  let saveChain = Promise.resolve();
  let saveInFlight = false; // true while a POST is outstanding; the remote-change poll waits
  function doSave() {
    saveTimer = null; // the debounce fired; without this the poll guard saw a stale timer forever (2026-09-15)
    saveChain = saveChain.then(doSaveNow_, doSaveNow_);
    return saveChain;
  }
  async function doSaveNow_() {
    const savedId = pendingSaveId;
    pendingSaveId = null;
    saveInFlight = true;
    try {
      const res = await apiFetch('', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(buildDoc())
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // The backend now submits every save as a version-checked patch through the same
      // _Inbox queue everything else writes through, instead of blind-overwriting the
      // file (that overwrite was the root cause of an earlier data-loss incident). A
      // save only fails with "conflict" if something else changed the tracker between
      // this tab's last load and this save — reload instead of silently losing that data.
      let resp = null;
      // Fail CLOSED. This used to swallow the parse error and fall through to "Synced",
      // so a save the backend never accepted — an HTML error page, a truncated body, an
      // auth redirect — looked exactly like a successful one. An unreadable response is
      // not a confirmed write, so say so instead of claiming the data is safe.
      try {
        resp = await res.json();
      } catch (parseErr) {
        throw new Error('Unrecognized response from the Task Tracker API — save not confirmed.');
      }
      if (resp && resp.ok === false) {
        if (resp.error === 'conflict') {
          setSyncStatus('conflict', 'The tracker changed elsewhere since this loaded — reloading the latest version. Please redo your last change.');
          // keepStatus: loadData otherwise ends with setSyncStatus('loaded') ("Synced"),
          // wiping the conflict warning set one line above within a few hundred ms — the
          // save failed and Durand never saw it.
          await loadData(false, true);
          return;
        }
        if (resp.error === 'busy') {
          // The save is queued server-side (its inbox file exists) and the minute trigger
          // applies it; the next poll picks up the new version. Not an error to alarm about.
          setSyncStatus('saving', 'Queued: another write is being applied; syncing shortly');
          setTimeout(pollForRemoteChanges, 20000);
          return;
        }
        throw new Error(resp.error || 'Save rejected');
      }
      if (resp && typeof resp.docVersion === 'number') RAW_META.docVersion = resp.docVersion;
      setSyncStatus('saved');
      if (savedId != null) {
        JUST_SAVED_IDS.add(savedId);
        clearTimeout(justSavedTimer);
        renderAll();
        justSavedTimer = setTimeout(function() { JUST_SAVED_IDS.delete(savedId); renderAll(); }, 2500);
      }
    } catch (err) {
      lastFailedOp = 'save';
      setSyncStatus('error', err.message || err);
    } finally {
      saveInFlight = false;
    }
  }

  // keepStatus (2026-09-02): when true, skip the closing setSyncStatus('loaded'). A reload
  // triggered by a failed/conflicting save has already put a warning in the sync pill that
  // the user still needs to read; the unconditional "Synced" at the end of a normal load
  // would overwrite it almost immediately and make a rejected save look like a clean one.
  // Install a loaded document as the page state and render it. Used by the live fetch and by
  // the localStorage warm start (2026-09-15): a repeat visit paints the last-known document
  // in well under a second while the real fetch is still in flight; the fetch then replaces it.
  function applyLoadedDoc_(doc) {
    TASKS = doc.tasks;
    tsgNormalizeTaskDates_(TASKS);
    RAW_META = doc.meta || {};
    COMMENTS = Array.isArray(RAW_META.comments) ? RAW_META.comments : [];
    renderCommentCount_();
    TEAM_ROSTER = normalizeRoster(RAW_META.teamRoster);
    renderTeamViewButtons_();
    META.created = doc.meta && doc.meta.created;
    META.lastUpdated = (doc.meta && doc.meta.last_updated) || META.lastUpdated;
    nextId = (doc.meta && doc.meta.next_id) || (TASKS.length ? Math.max(...TASKS.map(t => t.id)) + 1 : 1);
    ERRANDS = (doc.meta && doc.meta.errands) || {};
    STANDING_ITEMS = (doc.meta && doc.meta.standingItems) || [];
    dataLoaded = true;
    document.getElementById('updatedStamp').textContent = 'Last updated ' + formatDate(META.lastUpdated);
    renderAll();
  }
  async function loadData(isManualReload, keepStatus) {
    // Both the opening 'loading' and the closing 'loaded' are suppressed under keepStatus —
    // either one on its own would still stomp the conflict warning the caller just set.
    if (!keepStatus) setSyncStatus('loading');
    try {
      const res = await apiFetch('api=data');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const doc = await res.json();
      if (!doc || !Array.isArray(doc.tasks)) throw new Error('Unexpected response shape');
      applyLoadedDoc_(doc);
      try { localStorage.setItem('tsgDocCache', JSON.stringify(doc)); } catch (e) { /* storage may be unavailable; the cache is a convenience */ }
      if (!keepStatus) setSyncStatus('loaded');
    } catch (err) {
      if (!dataLoaded) {
        // keep the built-in fallback seed so the page isn't blank
        renderAll();
      }
      lastFailedOp = 'load';
      setSyncStatus('error', err.message || err);
      if (isManualReload) alert('Reload failed: ' + (err.message || err));
    }
  }

  // ---- FUB team roster sync (2026-09-01) ----
  // Pulls Follow Up Boss's user list into TEAM_ROSTER so the Owner/Delegate dropdowns and the
  // meeting-picker's "invite delegate" default use real emails instead of a guessed
  // firstname@thestawaszgroup.com pattern. Runs silently once after every load — never
  // surfaces an error to the user unless they clicked the manual "Sync from FUB" button
  // (silent=false), since a FUB hiccup shouldn't interrupt normal tracker use.
  //
  // Linking (first time a name/email is seen): by email, then case-insensitive name. Once
  // linked, an entry gets `fubId` and source:'fub' — from then on that id is the sole key used
  // to track that person, since names and emails both change but the id doesn't. A rename in
  // FUB propagates to every task/subitem that has them assigned (reassignNameEverywhere_),
  // not just the roster label.
  //
  // Removal (2026-09-01, per Durand): someone previously linked via a real fubId who no longer
  // appears in FUB is treated as a termination signal — removed from the roster picker AND
  // flagged with a Critical task pointing at the real offboarding SOPs (flagDelegateOffboarded_
  // below). This ONLY applies to entries with a confirmed fubId — a tracker-only delegate
  // (source:'tracker') or a legacy entry never actually matched to FUB was never "in FUB" to
  // begin with, so their absence means nothing and they're never touched by this. It's also
  // guarded against a bad fetch: if FUB returns suspiciously few people relative to how many
  // are currently linked, removal-detection is skipped entirely for that run (updates/adds
  // above still happen — that side is safe even against a partial response) rather than risk
  // flagging half the team as terminated because of an API hiccup.
  async function syncFubRoster(silent) {
    try {
      const res = await apiFetch('api=fubUsers');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || data.ok === false) throw new Error((data && data.error) || 'FUB sync failed');
      const fubUsers = Array.isArray(data.users) ? data.users : [];
      let changed = false;
      const seenFubIds = new Set();

      fubUsers.forEach(function(u) {
        if (!u.name || !u.email) return;
        if (u.id != null) seenFubIds.add(String(u.id));
        let p = null;
        if (u.id != null) p = TEAM_ROSTER.find(function(r) { return r.fubId != null && String(r.fubId) === String(u.id); });
        if (!p) p = TEAM_ROSTER.find(function(r) { return r.email && r.email.toLowerCase() === u.email.toLowerCase(); });
        if (!p) p = TEAM_ROSTER.find(function(r) { return r.name.toLowerCase() === u.name.toLowerCase(); });
        if (p) {
          if (u.name && p.name !== u.name) { reassignNameEverywhere_(p.name, u.name, 'FUB name change'); p.name = u.name; changed = true; }
          if (p.email !== u.email) { p.email = u.email; changed = true; }
          if (u.id != null && String(p.fubId) !== String(u.id)) { p.fubId = u.id; changed = true; }
          if (!p.source) { p.source = 'fub'; changed = true; }
        } else {
          TEAM_ROSTER.push({ name: u.name, role: 'Agent', title: '', email: u.email, source: 'fub', fubId: u.id != null ? u.id : null });
          changed = true;
        }
      });

      const priorLinked = TEAM_ROSTER.filter(function(r) { return r.source === 'fub' && r.fubId != null; });
      const suspiciouslySmall = priorLinked.length >= 2 && fubUsers.length < Math.max(2, priorLinked.length * 0.5);
      if (!suspiciouslySmall) {
        const removed = priorLinked.filter(function(p) { return !seenFubIds.has(String(p.fubId)); });
        for (const p of removed) {
          await flagDelegateOffboarded_(p);
          TEAM_ROSTER = TEAM_ROSTER.filter(function(r) { return r !== p; });
          changed = true;
        }
      } else if (!silent) {
        alert('FUB returned far fewer people than expected (' + fubUsers.length + ' vs ' + priorLinked.length + ' currently linked) — skipped offboarding checks this sync so no one gets flagged by mistake. Verify FUB access before retrying.');
      }

      if (changed) { renderAll(); if (document.getElementById('settingsModal').classList.contains('open')) renderSettings(); scheduleSave(); }
      if (!silent) alert('Synced ' + fubUsers.length + ' people from FUB.');
    } catch (err) {
      if (!silent) alert('Could not sync from FUB: ' + (err.message || err));
    }
  }
  // Repoints every task.owner / subitem.delegate from oldName to newName and logs why —
  // used both for a FUB name change (the name just changed, nothing else) and for reassigning
  // a removed delegate's work to someone else (removeRosterMember / flagDelegateOffboarded_).
  // Without this, removing or renaming someone in the roster would leave existing assignments
  // silently pointing at a name that no longer resolves to anyone in the picker. Returns how
  // many task/subitem assignments were touched.
  function reassignNameEverywhere_(oldName, newName, reason) {
    let count = 0;
    TASKS.forEach(function(t) {
      if (t.owner === oldName) { t.owner = newName; logHistory(t, 'owner', oldName + (reason ? ' (' + reason + ')' : ''), newName); count++; }
      (t.subitems || []).forEach(function(s) {
        if (s.delegate === oldName) {
          const before = s.delegate;
          s.delegate = newName;
          logHistory(t, 'subitem-delegate', s.title + ': ' + before + (reason ? ' (' + reason + ')' : ''), newName);
          count++;
        }
      });
    });
    return count;
  }
  // Someone previously linked to a real FUB record disappeared from FUB's team list — treated
  // as a termination signal. Deliberately does NOT guess at actual offboarding steps (access
  // revocation, listing reassignment, etc.) — those live in the real SOPs, not here. Adds a
  // visible, Critical task pointing at SOP 11 (Termination / access revocation) and SOP 12
  // (same-day access revocation checklist) so a human confirms and runs the real process.
  // Their existing task/subtask assignments are auto-reassigned to Durand (2026-09-01, per
  // Durand: assigned work must never be left dangling on a removed delegate) — Durand is the
  // only safe non-interactive default since this runs during a silent background sync with no
  // one there to ask; the created task lists exactly what moved so it can be redistributed to
  // the right person.
  async function flagDelegateOffboarded_(p) {
    const reassignedCount = p.name === 'Durand' ? 0 : reassignNameEverywhere_(p.name, 'Durand', p.name + ' no longer in FUB');
    const fields = {
      title: 'Offboarding: ' + p.name + ' — no longer in FUB', group: 'Team Ops', owner: 'Durand',
      status: 'Not Started', priority: 'Critical', tags: ['SOP Gap'], timelineEnd: todayISO(),
      progress: 0, depends: '', doc: '', docs: [], subitems: [],
      notes: p.name + ' (' + (p.email || 'no email on file') + ') disappeared from the FUB team list during an automatic sync on ' + todayISO() + ' — auto-detected, not manually confirmed. ' +
        (reassignedCount ? reassignedCount + ' task/subtask assignment' + (reassignedCount === 1 ? '' : 's') + ' auto-reassigned to Durand as a safe default — redistribute to the right person. ' : '') +
        'If this is a real departure, run SOP 11 (Termination / access revocation) and SOP 12 (same-day access revocation checklist). If this looks wrong (FUB hiccup, wrong filter, etc.), verify in FUB before acting.',
      history: [{ ts: new Date().toISOString(), field: 'created', from: null, to: 'Auto-created — delegate removed from FUB' }]
    };
    await createTask(fields);
  }

  // ---- Settings: Rulesets & Threads ----
  let RULESETS = null;
  let settingsTab = 'rulesets';
  let rulesetsLoaded = false;
  // Optimistic-concurrency counter for the whole-document Rulesets save, mirroring what
  // target=data already does for tasks. Captured from meta.docVersion on load and echoed
  // back verbatim on save — never invented or incremented here; the server owns it.
  let RULESETS_DOC_VERSION = null;
  // Values built into inline handler attributes (onclick="fn('${jsAttr(name)}')") sit in
  // TWO nested contexts at once: a single-quoted JS string inside a double-quoted HTML
  // attribute. The old version only handled the inner one (backslash + single quote), so a
  // name/category/thread containing a double quote closed the attribute early and could
  // inject markup — the same stored-XSS hole escapeHtml had. Escape for the JS string
  // first, then for the HTML attribute; the browser un-escapes the entities before the JS
  // parser ever sees the string, so both layers stay correct.
  function jsAttr(s) {
    return String(s == null ? '' : s)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function openSettings() {
    document.getElementById('settingsModal').classList.add('open');
    if (!rulesetsLoaded) await loadRulesets();
    renderSettings();
    syncFubRoster(true); // moved here from loadData (2026-09-15): a background FUB call must not run, save, or create tasks on every page load
  }
  function closeSettings() {
    document.getElementById('settingsModal').classList.remove('open');
  }
  async function loadRulesets() {
    try {
      const res = await apiFetch('api=rulesets');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      RULESETS = await res.json();
      if (!RULESETS.threads) RULESETS.threads = {};
      if (!RULESETS.current) RULESETS.current = {};
      if (!Array.isArray(RULESETS.history)) RULESETS.history = [];
      RULESETS_DOC_VERSION = (RULESETS.meta && typeof RULESETS.meta.docVersion === 'number')
        ? RULESETS.meta.docVersion : null;
      rulesetsLoaded = true;
    } catch (err) {
      RULESETS = RULESETS || { meta: {}, current: {}, history: [], threads: {} };
      document.getElementById('settingsBody').innerHTML =
        '<div class="history-empty">Could not load rulesets: ' + escapeHtml(err.message || String(err)) + '</div>';
    }
  }
  function setSettingsTab(tab) {
    settingsTab = tab;
    document.querySelectorAll('.settings-tab').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); });
    renderSettings();
  }
  function renderSettings() {
    const body = document.getElementById('settingsBody');
    if (!RULESETS) { body.innerHTML = '<div class="history-empty">Loading&hellip;</div>'; return; }
    if (settingsTab === 'team') { body.innerHTML = renderTeamTab(); return; }
    body.innerHTML = settingsTab === 'rulesets' ? renderRulesetsTab() : renderThreadsTab();
  }
  // ---- Settings: Team roster (Owner/Delegate dropdown source) ----
  function renderTeamTab() {
    const usage = {};
    TASKS.forEach(function(t) {
      if (t.owner) usage[t.owner] = (usage[t.owner] || 0) + 1;
      (t.subitems || []).forEach(function(s) { if (s.delegate) usage[s.delegate] = (usage[s.delegate] || 0) + 1; });
    });
    const roleOpts = function(current) {
      return ROSTER_ROLES.map(function(r) { return `<option value="${r}" ${r === current ? 'selected' : ''}>${r}</option>`; }).join('');
    };
    const rows = TEAM_ROSTER.map(function(p) {
      const count = usage[p.name] || 0;
      const sourceBadge = p.source === 'fub' ? '<span class="hist-time" title="Synced from Follow Up Boss">FUB</span>'
        : p.source === 'tracker' ? '<span class="hist-time" title="Added directly in the tracker — not in FUB">Tracker-only</span>' : '';
      return `<div class="modal-row" style="align-items:center;">
        <span style="flex:1;">${escapeHtml(p.name)}${p.title ? ' <span class=\"hist-time\">(' + escapeHtml(p.title) + ')</span>' : ''}</span>
        <input type="email" class="text-input" style="flex:1;margin-right:10px;" placeholder="email" value="${escapeHtml(p.email || '')}" onblur="setRosterEmail('${jsAttr(p.name)}', this.value)">
        ${sourceBadge}
        <select class="pill sub-pill" style="margin:0 10px;" onchange="setRosterRole('${jsAttr(p.name)}', this.value)">${roleOpts(p.role)}</select>
        <span class="hist-time" style="margin-right:10px;">${count ? count + ' task' + (count === 1 ? '' : 's') : 'unused'}</span>
        <button type="button" class="icon-btn danger" onclick="removeRosterMember('${jsAttr(p.name)}')" title="Remove from roster">&#10005;</button>
      </div>`;
    }).join('');
    return `
      <div class="modal-section">
        <div class="ruleset-block-head"><h3>Team Roster</h3><button class="btn small" onclick="syncFubRoster(false)">&#8635; Sync from FUB</button></div>
        <div class="history-empty" style="margin-bottom:10px;">Names here populate the Owner and Delegate dropdowns everywhere on the board, and the email feeds the meeting picker's guest invite. "Sync from FUB" pulls names/emails from Follow Up Boss and fills in matches by email or name &mdash; it only adds or fills in, never removes. Adding someone with "+ Add delegate" below only saves to this tracker; it never writes to FUB.</div>
        ${rows || '<div class="history-empty">No one on the roster yet.</div>'}
        <div class="add-sub-row" style="margin-top:12px;">
          <input type="text" class="text-input" placeholder="Name" id="newRosterName" onkeydown="if(event.key==='Enter'){event.preventDefault();addRosterMember();}">
          <input type="email" class="text-input" placeholder="Email" id="newRosterEmail" onkeydown="if(event.key==='Enter'){event.preventDefault();addRosterMember();}">
          <select class="pill sub-pill" id="newRosterRole">${roleOpts('Agent')}</select>
          <button class="btn small primary" onclick="addRosterMember()">+ Add delegate</button>
        </div>
      </div>`;
  }
  function addRosterMember() {
    const input = document.getElementById('newRosterName');
    const emailInput = document.getElementById('newRosterEmail');
    const roleSel = document.getElementById('newRosterRole');
    const name = (input.value || '').trim();
    const email = (emailInput && emailInput.value || '').trim();
    if (!name) return;
    if (TEAM_ROSTER.some(function(p) { return p.name.toLowerCase() === name.toLowerCase(); })) {
      alert(name + ' is already on the roster.');
      input.value = '';
      return;
    }
    // Tracker-only addition — never written to FUB, only saved here.
    TEAM_ROSTER.push({ name: name, role: (roleSel && roleSel.value) || 'Agent', title: '', email: email, source: 'tracker' });
    input.value = '';
    if (emailInput) emailInput.value = '';
    renderSettings();
    renderAll();
    scheduleSave();
  }
  function setRosterEmail(name, email) {
    const p = TEAM_ROSTER.find(function(p) { return p.name === name; });
    if (!p) return;
    const val = (email || '').trim();
    if (p.email === val) return;
    p.email = val;
    scheduleSave();
  }
  function setRosterRole(name, role) {
    const p = TEAM_ROSTER.find(function(p) { return p.name === name; });
    if (!p) return;
    p.role = role;
    renderAll();
    scheduleSave();
  }
  // Deleting a roster member (2026-09-01, per Durand: assigned work MUST be reassigned, never
  // left dangling) — if they own tasks or are delegated subtasks, this asks who inherits all
  // of it before anything is removed; cancelling the reassignment prompt cancels the whole
  // delete, so a delegate can never end up removed with orphaned assignments still pointing at
  // their name. A FUB-linked person gets an extra warning: if they're still active in FUB, the
  // next silent sync will simply add them back (matched by fubId/email/name) — this button
  // only ever removes them from the tracker, never from FUB itself.
  function removeRosterMember(name) {
    const p = TEAM_ROSTER.find(function(r) { return r.name === name; });
    const ownedTasks = TASKS.filter(function(t) { return t.owner === name; });
    let delegatedCount = 0;
    TASKS.forEach(function(t) { (t.subitems || []).forEach(function(s) { if (s.delegate === name) delegatedCount++; }); });
    const totalCount = ownedTasks.length + delegatedCount;

    let reassignTo = null;
    if (totalCount > 0) {
      const others = TEAM_ROSTER.filter(function(r) { return r.name !== name; }).map(function(r) { return r.name; });
      if (!others.length) {
        alert(name + ' owns ' + ownedTasks.length + ' task' + (ownedTasks.length === 1 ? '' : 's') + ' and is delegated ' + delegatedCount + ' subtask' + (delegatedCount === 1 ? '' : 's') + ', and there\'s no one else on the roster to reassign them to — add someone else first.');
        return;
      }
      const suggestion = others.indexOf('Durand') !== -1 ? 'Durand' : others[0];
      const input = prompt(
        name + ' owns ' + ownedTasks.length + ' task' + (ownedTasks.length === 1 ? '' : 's') + ' and is delegated ' + delegatedCount + ' subtask' + (delegatedCount === 1 ? '' : 's') + '. ' +
        'Reassign ALL of it to (must be an existing roster name):',
        suggestion
      );
      if (input == null) return; // cancelled — nothing changed, they stay on the roster
      const match = others.find(function(o) { return o.toLowerCase() === input.trim().toLowerCase(); });
      if (!match) { alert('"' + input + '" isn\'t on the roster (or is ' + name + ' themselves) — cancelled, nothing was changed.'); return; }
      reassignTo = match;
    }

    let msg = 'Remove ' + name + ' from the roster' + (reassignTo ? ' and reassign ' + totalCount + ' assignment' + (totalCount === 1 ? '' : 's') + ' to ' + reassignTo : '') + '?';
    if (p && p.source === 'fub') {
      msg += '\n\nThis person is synced from FUB — if they\'re still active there, the next sync will add them back. To remove them for good, deactivate/remove them in FUB, not just here.';
    }
    if (!confirm(msg)) return;

    if (reassignTo) reassignNameEverywhere_(name, reassignTo, name + ' removed from roster');
    TEAM_ROSTER = TEAM_ROSTER.filter(function(r) { return r.name !== name; });
    renderSettings();
    renderAll();
    scheduleSave();
  }
  function changelogHtml(entries) {
    if (!entries.length) return '<div class="history-empty">No changes logged.</div>';
    return entries.map(function(h) {
      return '<div class="history-entry"><span class="hist-time">' + formatDateTime(h.ts) + '</span><span class="hist-desc"><b>' +
        escapeHtml(h.action || '') + '</b> \u2014 ' + escapeHtml(h.summary || '') + '</span></div>';
    }).join('');
  }
  function renderRulesetsTab() {
    const cur = RULESETS.current || {};
    const cats = Object.keys(cur);
    let html = cats.map(function(cat) {
      const r = cur[cat];
      const changelog = (RULESETS.history || []).filter(function(h) { return h.target === cat; }).slice().reverse();
      return '<div class="ruleset-block">' +
        '<div class="ruleset-block-head"><h3>' + escapeHtml(cat) + '</h3><span class="ruleset-pushed">Last pushed ' + formatDateTime(r.pushed) + '</span></div>' +
        '<div class="ruleset-content" contenteditable="true" onblur="rulesetContentEdit(\'' + jsAttr(cat) + '\', this)">' + escapeHtml(r.content || '') + '</div>' +
        '<div class="ruleset-changelog-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\')">Changelog (' + changelog.length + ') &#9662;</div>' +
        '<div class="history-list ruleset-changelog">' + changelogHtml(changelog) + '</div>' +
        '</div>';
    }).join('');
    html += '<button class="btn" onclick="addRulesetCategory()">+ Add ruleset category</button>';
    return html;
  }
  function rulesetContentEdit(cat, el) {
    const val = el.textContent;
    const cur = RULESETS.current[cat];
    if (!cur || val === cur.content) return;
    cur.content = val;
    const now = new Date().toISOString();
    cur.pushed = now;
    RULESETS.history.push({ ts: now, target: cat, action: 'update', summary: 'Edited from Task Tracker Settings.' });
    scheduleRulesetsSave();
    renderSettings();
  }
  function addRulesetCategory() {
    const name = prompt('New ruleset category name:');
    if (!name || !name.trim()) return;
    if (RULESETS.current[name]) { alert('That category already exists.'); return; }
    const now = new Date().toISOString();
    RULESETS.current[name] = { content: '', pushed: now };
    RULESETS.history.push({ ts: now, target: name, action: 'baseline', summary: 'Category created from Task Tracker Settings.' });
    scheduleRulesetsSave();
    renderSettings();
  }
  function renderThreadsTab() {
    const threads = RULESETS.threads || {};
    const names = Object.keys(threads);
    let html = '';
    if (!names.length) {
      html += '<div class="history-empty">No threads yet.</div>';
    } else {
      html += names.map(function(name) {
        const th = threads[name];
        const changelog = (th.history || []).slice().reverse();
        const memories = th.memories || [];
        return '<div class="thread-block">' +
          '<div class="ruleset-block-head"><h3>' + escapeHtml(name) + '</h3><button class="icon-btn danger" onclick="removeThread(\'' + jsAttr(name) + '\')" title="Remove thread">&#10005;</button></div>' +
          '<div class="thread-label">Instructions</div>' +
          '<div class="ruleset-content" contenteditable="true" onblur="threadFieldEdit(\'' + jsAttr(name) + '\', this)">' + escapeHtml(th.instructions || '') + '</div>' +
          '<div class="thread-label">Critical memories</div>' +
          '<div class="memory-list">' + memories.map(function(m, i) {
            return '<div class="memory-chip"><span class="modal-edit" contenteditable="true" onblur="threadMemoryEdit(\'' + jsAttr(name) + '\', ' + i + ', this)">' + escapeHtml(m) + '</span><span class="rm" onclick="removeThreadMemory(\'' + jsAttr(name) + '\', ' + i + ')" title="Remove">&#10005;</span></div>';
          }).join('') + '</div>' +
          '<button class="btn small" onclick="addThreadMemory(\'' + jsAttr(name) + '\')">+ Memory</button>' +
          '<div class="ruleset-changelog-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\')">Changelog (' + changelog.length + ') &#9662;</div>' +
          '<div class="history-list ruleset-changelog">' + changelogHtml(changelog) + '</div>' +
          '</div>';
      }).join('');
    }
    html += '<button class="btn" onclick="addThread()">+ Add thread</button>';
    return html;
  }
  function touchThreadHistory(name, action, summary) {
    const th = RULESETS.threads[name];
    if (!Array.isArray(th.history)) th.history = [];
    th.history.push({ ts: new Date().toISOString(), action: action, summary: summary });
  }
  function addThread() {
    const name = prompt('Thread name:');
    if (!name || !name.trim()) return;
    if (RULESETS.threads[name]) { alert('That thread already exists.'); return; }
    RULESETS.threads[name] = { instructions: '', memories: [], history: [] };
    touchThreadHistory(name, 'baseline', 'Thread added from Task Tracker Settings.');
    scheduleRulesetsSave();
    renderSettings();
  }
  function removeThread(name) {
    if (!confirm('Remove thread "' + name + '"? This deletes its instructions, memories, and changelog.')) return;
    delete RULESETS.threads[name];
    scheduleRulesetsSave();
    renderSettings();
  }
  function threadFieldEdit(name, el) {
    const th = RULESETS.threads[name];
    const val = el.textContent;
    if (!th || val === th.instructions) return;
    th.instructions = val;
    touchThreadHistory(name, 'update', 'Instructions edited from Task Tracker Settings.');
    scheduleRulesetsSave();
    renderSettings();
  }
  function addThreadMemory(name) {
    const text = prompt('New critical memory:');
    if (!text || !text.trim()) return;
    const th = RULESETS.threads[name];
    if (!th.memories) th.memories = [];
    th.memories.push(text.trim());
    touchThreadHistory(name, 'update', 'Memory added from Task Tracker Settings.');
    scheduleRulesetsSave();
    renderSettings();
  }
  function threadMemoryEdit(name, idx, el) {
    const th = RULESETS.threads[name];
    const val = el.textContent;
    if (!th || !th.memories || th.memories[idx] === val) return;
    th.memories[idx] = val;
    touchThreadHistory(name, 'update', 'Memory edited from Task Tracker Settings.');
    scheduleRulesetsSave();
    renderSettings();
  }
  function removeThreadMemory(name, idx) {
    const th = RULESETS.threads[name];
    if (!th || !th.memories) return;
    th.memories.splice(idx, 1);
    touchThreadHistory(name, 'update', 'Memory removed from Task Tracker Settings.');
    scheduleRulesetsSave();
    renderSettings();
  }
  let rulesetsSaveTimer = null;
  function scheduleRulesetsSave() {
    clearTimeout(rulesetsSaveTimer);
    rulesetsSaveTimer = setTimeout(saveRulesets, 600);
  }
  // The sync pill sits behind the Settings modal, so a conflict raised while Settings is
  // open also needs to say so inside the panel itself. Deliberately NOT on a timer: it
  // stays until the next renderSettings() replaces the body, so it can't disappear before
  // Durand has read it. Single-op patches (add/remove one thread memory) carry no version
  // and can't conflict — this is only for the whole-document replace below.
  function showRulesetsConflictBanner_() {
    const body = document.getElementById('settingsBody');
    if (!body) return;
    const div = document.createElement('div');
    div.className = 'settings-conflict-banner';
    div.setAttribute('style', 'margin:0 0 12px;padding:10px 12px;border:1px solid var(--status-critical,#b4453c);border-radius:6px;background:rgba(180,69,60,0.12);color:var(--status-critical,#b4453c);font-weight: 700;line-height:1.4;');
    div.textContent = 'Not saved — Settings were changed somewhere else first. Your last change was discarded and this panel now shows the latest saved version. Please redo it.';
    body.insertBefore(div, body.firstChild);
  }
  async function saveRulesets() {
    try {
      RULESETS.meta = RULESETS.meta || {};
      RULESETS.meta.last_updated = isoLocal_(new Date());
      // Echo back the docVersion captured at load. The server rejects the write with
      // {ok:false, error:'conflict', serverVersion:N} if the stored doc has moved on since,
      // instead of letting this tab blind-overwrite someone else's Settings change.
      if (RULESETS_DOC_VERSION != null) RULESETS.meta.docVersion = RULESETS_DOC_VERSION;
      const res = await apiFetch('target=rulesets', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(RULESETS)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let resp = null;
      // Fail closed, same as doSaveNow_ — an unreadable body is not a confirmed write.
      try {
        resp = await res.json();
      } catch (parseErr) {
        throw new Error('Unrecognized response from the Task Tracker API — save not confirmed.');
      }
      if (resp && resp.ok === false) {
        if (resp.error === 'conflict') {
          // Don't silently carry on top of a stale document. Re-fetch, re-render Settings
          // from the fresh copy (which also resets RULESETS_DOC_VERSION), and leave a
          // visible warning up. Mirrors the target=data conflict handling.
          setSyncStatus('conflict', 'Settings changed elsewhere since this loaded — your last Settings change was NOT saved. The panel has been reloaded with the latest version; please redo it.');
          rulesetsLoaded = false;
          await loadRulesets();
          renderSettings();
          showRulesetsConflictBanner_();
          return;
        }
        throw new Error(resp.error || 'Save rejected');
      }
      if (resp && typeof resp.docVersion === 'number') {
        RULESETS_DOC_VERSION = resp.docVersion;
        RULESETS.meta.docVersion = resp.docVersion;
      }
    } catch (err) {
      alert('Could not save to Drive: ' + (err.message || err));
    }
  }

  (function initTheme() {
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    var btn = document.getElementById('themeToggle');
    if (btn) btn.innerHTML = prefersDark ? '&#9728;&#65039;' : '&#127769;';
  })();
  document.getElementById('themeToggle').addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    this.innerHTML = isDark ? '&#127769;' : '&#9728;&#65039;';
  });

  // Don't paint the fallback seed data as the first thing the user sees (2026-09-03,
  // per Durand) — it used to render immediately with old placeholder numbers, then jump
  // to the real counts a moment later once loadData() finished, which read as the app
  // flickering/misbehaving even when nothing was actually wrong. The seed data is a
  // last-resort fallback for when the live fetch genuinely fails (see loadData()'s catch
  // block below) — it should never be the first paint on a normal, successful load.
  // Everything here (stats/board/alert banner) is empty by default in the raw HTML, so
  // simply not calling renderAll() yet already gives a blank page; the loading message
  // and pill state below just make it clear that's what's happening, not a broken page.
  document.getElementById('board').innerHTML = '<div class="today-side-empty" style="padding:48px 0;text-align:center;">Loading your tasks…</div>';
  setSyncStatus('loading');
  renderVersionStamp();
  try {
    const cachedDoc = JSON.parse(localStorage.getItem('tsgDocCache') || 'null');
    if (cachedDoc && Array.isArray(cachedDoc.tasks) && cachedDoc.tasks.length) { applyLoadedDoc_(cachedDoc); setSyncStatus('loading'); }
  } catch (e) { /* no cache, or storage unavailable: the normal load path follows */ }
  loadData();
  loadCalendar();

  // Background sync (2026-09-14). The page used to load once and never look again, so a
  // change made anywhere else (an _Inbox patch from Claude, another person's edit) was
  // invisible until a manual reload and could only surface as a save conflict. Now every
  // POLL_MS, and whenever the tab regains focus, ask ?api=version for the document's
  // docVersion and reload the data when it has moved past what this page loaded. Never
  // while a save is pending (that would race the save), and never while a task card is
  // open (the reload is deferred until closeTaskCard). Foundation for the per-person
  // mini-trackers, which edit the same document concurrently.
  const POLL_MS = 45000;
  let remoteChangePending = false;
  let pollInFlight = false;
  async function pollForRemoteChanges() {
    if (pollInFlight || document.hidden || !dataLoaded) return;
    if (saveTimer || saveInFlight || pendingSaveId != null) return; // local edits in flight — they win, then the response carries the new docVersion
    pollInFlight = true;
    try {
      const res = await apiFetch('api=version');
      if (!res.ok) return;
      const v = await res.json();
      const remote = v && typeof v.docVersion === 'number' ? v.docVersion : null;
      const local = RAW_META && typeof RAW_META.docVersion === 'number' ? RAW_META.docVersion : null;
      if (remote == null || local == null || remote <= local) return;
      if (currentModalTaskId != null) { remoteChangePending = true; return; }
      await loadData(false, true);
      setSyncStatus('loaded');
    } catch (err) {
      // Polling is best-effort — a failed probe is not a connection problem worth alarming about.
    } finally {
      pollInFlight = false;
    }
  }
  setInterval(pollForRemoteChanges, POLL_MS);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) pollForRemoteChanges(); });
</script>
</body>
</html>
