      { label: 'Done', value: counts['Done'], cls: 'done', key: 'done' },
      { label: 'Completed (7d)', value: completedInLastNDays(7).length, key: 'completed7d' },
    ];
    document.getElementById('stats').innerHTML = tiles.map(t => `
      <div class="stat-tile clickable ${t.cls || ''}" onclick="openStatTile('${t.key}')" title="View ${escapeHtml(t.label.toLowerCase())}">
        <div class="label">${t.label}</div>
        <div class="value">${t.value}</div>
      </div>
    `).join('');
    document.getElementById('progressBattery').innerHTML = statusBatteryHtml(counts, TASKS.length, true);
    renderAlertBanner();
  }
  // monday.com-style segmented "status battery" — proportional colored bar instead of a
  // bare count, so overall (or per-group) progress reads as a shape at a glance rather than
  // needing to compare five separate numbers. withLegend adds a labeled key row underneath;
  // group-header mini-bars skip it to stay compact.
  function statusBatteryHtml(counts, total, withLegend) {
    if (!total) return '';
    const segs = STATUSES.map(function(s) {
      const n = counts[s] || 0;
      if (!n) return '';
      const pct = Math.round((n / total) * 1000) / 10;
      return `<div class="battery-seg ${statusClass(s)}" style="width:${pct}%" title="${s}: ${n} (${pct}%)"></div>`;
    }).join('');
    const doneP = Math.round(((counts['Done'] || 0) / total) * 100);
    const legend = withLegend ? `<div class="battery-legend">${STATUSES.filter(s => counts[s]).map(function(s) {
      return `<span><i class="dot ${statusClass(s)}"></i>${s} ${counts[s]}</span>`;
    }).join('')}<span class="battery-pct">${doneP}% done</span></div>` : '';
    return `<div class="status-battery">${segs}</div>${legend}`;
  }
  // Compact per-group version for group headers (Table/Cards) — no legend, just the bar
  // plus a %-done readout, so a group's shape is visible without opening it.
  function groupBatteryHtml(groupTasks) {
    if (!groupTasks.length) return '';
    const counts = { 'Not Started': 0, 'In Progress': 0, 'Blocked': 0, 'Waiting': 0, 'Done': 0 };
    groupTasks.forEach(function(t) { const s = rollupStatus(t); counts[s] = (counts[s] || 0) + 1; });
    const pct = Math.round(((counts['Done'] || 0) / groupTasks.length) * 100);
    return `<span class="group-battery-wrap">${statusBatteryHtml(counts, groupTasks.length, false)}<span class="group-battery-pct">${pct}%</span></span>`;
  }

  function matchesFilters(t) {
    const status = document.getElementById('filterStatus').value;
    const priority = document.getElementById('filterPriority').value;
    const search = document.getElementById('filterSearch').value.toLowerCase();
    const group = document.getElementById('filterGroup').value;
    const owner = document.getElementById('filterOwner').value;
    const tag = document.getElementById('filterTag').value;
    const missing = document.getElementById('filterMissing').value;
    // 2026-09-03, per Durand: an earlier version of this filter hid Done tasks everywhere
    // by default. Superseded same-day — Done handling is now per-view instead of a single
    // global exclusion: Kanban shows Done normally in its column, Board/Cards group Done
    // parent tasks into a collapsed "Completed" section (see renderCompletedGroupHtml_ /
    // renderCompletedCardsGroupHtml_), and Timeline/Workload show Done work items but keep
    // them out of the workload hour totals (computeDailyHours already filters status !==
    // 'Done' there). matchesFilters itself no longer touches Done at all.
    if (triageOnly && (t.tags || []).indexOf('Triage') === -1) return false;
    if (status && t.status !== status) return false;
    if (priority && t.priority !== priority) return false;
    if (group && t.group !== group) return false;
    if (owner && t.owner !== owner) return false;
    if (tag && (t.tags || []).indexOf(tag) === -1) return false;
    if (missing && !isFieldMissing(t, missing)) return false;
    if (search) {
      const hay = (t.title + ' ' + (t.notes||'') + ' ' + (t.tags||[]).join(' ')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  }
  // Dedicated "empty field" views — for a task with subitems, missing-tags/estimate/etc.
  // checks the parent's own field even though cards show the rollup, since these are about
  // finding what needs data entry, not what the rollup currently displays.
  function isFieldMissing(t, field) {
    if (field === 'tags') return !(t.tags && t.tags.length);
    if (field === 'taskType') return !t.taskType;
    if (field === 'estHours') return t.estHours == null;
    if (field === 'timelineEnd') return !t.timelineEnd;
    if (field === 'notes') return !t.notes;
    // A docs[] link counts as a source link — otherwise a task linked through the meeting
    // picker or "+ link" (both of which write docs[], never the legacy doc field) kept
    // showing up forever in the "Missing: source link" view as if it had none.
    if (field === 'doc') return !t.doc && !(t.docs && t.docs.length);
    if (field === 'owner') return !t.owner;
    return false;
  }
  // Rebuilds the Group/Owner/Tag filter option lists from whatever's actually on the board
  // right now, preserving the current selection where it still exists. Called every render
  // so a newly-added group/tag/owner shows up without a page reload.
  function populateDynamicFilters() {
    const groups = [...new Set([...GROUP_ORDER, ...TASKS.map(t => t.group)])].filter(g => TASKS.some(t => t.group === g));
    const owners = [...new Set(TASKS.map(t => t.owner).filter(Boolean))].sort();
    const tags = [...new Set(TASKS.flatMap(t => t.tags || []))].sort();
    function rebuild(id, values, allLabel) {
      const sel = document.getElementById(id);
      const current = sel.value;
      sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v =>
        `<option value="${escapeHtml(v)}" ${v === current ? 'selected' : ''}>${escapeHtml(v)}</option>`
      ).join('');
    }
    rebuild('filterGroup', groups, 'All groups');
    rebuild('filterOwner', owners, 'All owners');
    rebuild('filterTag', tags, 'All tags');
  }
  const STATUS_RANK = { 'Not Started': 0, 'In Progress': 1, 'Blocked': 2, 'Waiting': 3, 'Done': 4 };
  function sortValue(t, field) {
    switch (field) {
      case 'priority': { const r = PRIORITY_RANK[rollupPriority(t)]; return r != null ? r : 99; }
      case 'status': { const r = STATUS_RANK[rollupStatus(t)]; return r != null ? r : 99; }
      case 'due': return t.timelineEnd || '9999-99-99';
      case 'title': return (t.title || '').toLowerCase();
      case 'owner': return (t.owner || '￿').toLowerCase();
      case 'group': return (t.group || '￿').toLowerCase();
      case 'estHours': return t.estHours != null ? -t.estHours : Infinity;
      case 'progress': return -taskProgress(t);
      default: return 0;
    }
  }
  // Cascading sort — primary field, then a tiebreaker. Applied once to the filtered list
  // before it's handed to any view, so Board/Kanban/Cards all inherit the same order
  // (each view's own per-group/per-column split preserves relative order from a stable sort).
  function sortTasks(arr) {
    const f1 = document.getElementById('sortBy1').value;
    const f2 = document.getElementById('sortBy2').value;
    if (!f1 && !f2) return;
    arr.sort(function(a, b) {
      if (f1) {
        const va = sortValue(a, f1), vb = sortValue(b, f1);
        if (va < vb) return -1;
        if (va > vb) return 1;
      }
      if (f2) {
        const va = sortValue(a, f2), vb = sortValue(b, f2);
        if (va < vb) return -1;
        if (va > vb) return 1;
      }
      return 0;
    });
  }
  let triageOnly = false;
  function toggleTriageFilter() {
    triageOnly = !triageOnly;
    document.getElementById('btnTriageFilter').classList.toggle('toggle-active', triageOnly);
    renderAll();
  }

  function pillSelect(kind, current, taskId) {
    const opts = kind === 'status' ? STATUSES : PRIORITIES;
    const cls = kind === 'status' ? statusClass(current) : priorityClass(current);
    return `<select class="pill ${cls}" data-kind="${kind}" data-id="${taskId}" onchange="onPillChange(this)">
      ${opts.map(o => `<option value="${o}" ${o===current?'selected':''}>${o}</option>`).join('')}
    </select>`;
  }
  // Same as pillSelect but scoped to one subitem (data-idx added, routes through onSubPillChange).
  function subPillSelect(kind, current, taskId, idx) {
    const opts = kind === 'status' ? STATUSES : PRIORITIES;
    const val = current || (kind === 'status' ? 'Not Started' : 'Medium');
    const cls = kind === 'status' ? statusClass(val) : priorityClass(val);
    return `<select class="pill sub-pill ${cls}" data-kind="${kind}" data-id="${taskId}" data-idx="${idx}" onchange="onSubPillChange(this)" onclick="event.stopPropagation()">
      ${opts.map(o => `<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}
    </select>`;
  }
  // Owner/Delegate dropdowns — same roster for both, since a task's owner and a subtask's
  // delegate are drawn from the same team. Always includes "+ Other…" so anyone not on the
  // TEAM_ROSTER list (an outside vendor, a new hire not added yet) can still be typed in.
  function personOptions(current) {
    const names = rosterNames();
    const inRoster = names.indexOf(current) !== -1;
    let html = `<option value="" ${!current ? 'selected' : ''}>—</option>`;
    html += names.map(name => `<option value="${name}" ${name === current ? 'selected' : ''}>${name}</option>`).join('');
    if (current && !inRoster) html += `<option value="${escapeHtml(current)}" selected>${escapeHtml(current)}</option>`;
    html += `<option value="__other__">+ Other…</option>`;
    return html;
  }
  function ownerSelect(taskId, current) {
    return `<select class="person-select" data-id="${taskId}" onchange="onOwnerChange(this)" onclick="event.stopPropagation()">${personOptions(current)}</select>`;
  }
  function delegateSelect(taskId, idx, current) {
    return `<select class="person-select sub-person-select" data-id="${taskId}" data-idx="${idx}" onchange="onDelegateChange(this)" onclick="event.stopPropagation()">${personOptions(current)}</select>`;
  }
  function onOwnerChange(el) {
    const id = Number(el.dataset.id);
    const t = findTask(id);
    const before = t.owner;
    let val = el.value;
    if (val === '__other__') {
      const custom = prompt('Owner name:', before || '');
      if (!custom || !custom.trim()) { el.value = before || ''; return; }
      val = custom.trim();
    }
    t.owner = val;
    if (before !== val) logHistory(t, 'owner', before, val);
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  function onDelegateChange(el) {
    const id = Number(el.dataset.id), idx = Number(el.dataset.idx);
    const t = findTask(id);
    const s = t.subitems[idx];
    const before = s.delegate;
    let val = el.value;
    if (val === '__other__') {
      const custom = prompt('Delegate name:', before || '');
      if (!custom || !custom.trim()) { el.value = before || ''; return; }
      val = custom.trim();
    }
    s.delegate = val;
    if (before !== val) logHistory(t, 'subitem-delegate', s.title, val);
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }

  function setView(v) {
    currentView = v;
    document.querySelectorAll('.view-tab').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.view === v);
    });
    renderAll();
    if (v === 'today') { loadCalendar(); ensureCalendarForView(); }
  }

  function renderBoard() {
    const board = document.getElementById('board');
    if (currentView === 'today') {
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('resultCount').textContent = '';
      // Today view never sets a scoped nav order for whatever specific list a card gets
      // opened from (didn't-fit, due-from-others, an admin line) — default to every open
      // (non-Done) task rather than leaving currentFilteredOrder stale from whatever view
      // was last rendered, or empty (which used to fall back to literally every task).
      // Skipped while a popup-scoped list is active (see navOrderScoped) — otherwise every
      // edit's renderAll() would blow away e.g. the "9 overdue" popup's own nav list.
      if (!navOrderScoped) currentFilteredOrder = defaultModalNavOrder();
      board.innerHTML = renderTodayView();
      return;
    }
    const filtered = TASKS.filter(matchesFilters);
    sortTasks(filtered);
    if (!navOrderScoped) currentFilteredOrder = filtered.map(t => t.id);

    document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
    document.getElementById('resultCount').textContent = filtered.length + ' of ' + TASKS.length + ' shown';

    if (currentView === 'kanban') { board.innerHTML = renderKanbanView(filtered); return; }
    if (currentView === 'card') { board.innerHTML = renderCardsView(filtered); return; }
    if (currentView === 'timeline') { board.innerHTML = renderTimelineView(filtered); return; }
    if (currentView === 'workload') { board.innerHTML = renderWorkloadView(filtered); return; }
    board.innerHTML = renderTableView(filtered);
  }

  function renderTableView(filtered) {
    const groups = [...new Set([...GROUP_ORDER, ...TASKS.map(t => t.group)])].filter(g =>
      TASKS.some(t => t.group === g)
    );
    // 2026-09-03, per Durand: Done parent tasks no longer sit in their normal group — they
    // move to a single "Completed" group at the bottom of the board, collapsed by default
    // (see renderCompletedGroupHtml_ below). Uses the rolled-up status, same as everywhere
    // else a card/row's displayed status comes from its subitems rather than a possibly-
    // stale t.status.
    const openSections = groups.map(g => {
      const groupTasks = filtered.filter(t => t.group === g && rollupStatus(t) !== 'Done');
      if (!groupTasks.length) return '';
      // The header's battery/%-done reads against the WHOLE group (Done tasks included,
      // even though they've been moved out to the Completed section below) — otherwise
      // %-done is measured against an already-Done-filtered set and can never read
      // anything but 0%, while the bar itself still fills with the open statuses' colors.
      // That mismatch (a near-full bar next to "0%") was the bug: the header should answer
      // "how much of this group is done", not "how much of this group's OPEN work is done".
      const allGroupTasks = filtered.filter(t => t.group === g);
      const collapsed = collapsedGroups.has(g) ? 'collapsed' : '';
      const rows = groupTasks.map(t => taskRowHtml(t)).join('');
      return `
      <div class="group-section ${collapsed}" data-group="${escapeHtml(g)}">
        <div class="group-head" onclick="toggleGroup('${jsAttr(g)}')">
          <span class="caret">${collapsed ? '▶' : '▼'}</span>
          <span class="gname">${escapeHtml(g)}</span>
          <span class="gcount">${groupTasks.length}</span>
          ${groupBatteryHtml(allGroupTasks)}
          <span class="gadd"></span>
          <button class="btn small primary" onclick="event.stopPropagation(); openAddForm('${jsAttr(g)}')">+ Task</button>
          <button class="btn small danger" onclick="event.stopPropagation(); deleteGroup('${jsAttr(g)}')">Delete group</button>
        </div>
        <div class="group-body">
          <table>
            <thead><tr>
              <th style="width:26px;"></th>
              <th>Title</th>
              <th>Owner / Status / Priority</th>
              <th>Tags / Due / Progress</th>
              <th>Notes</th>
              <th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="add-form ${openAddForms.has(g) ? 'open' : ''}" id="addform-${cssId(g)}" onkeydown="handleAddFormKeydown(event, '${jsAttr(g)}')">
            <input type="text" name="title" placeholder="Task title (Enter to add, Shift+Enter to add &amp; keep typing)">
            <select name="status">${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select>
            <select name="priority">${PRIORITIES.map(p=>`<option ${p==='Medium'?'selected':''}>${p}</option>`).join('')}</select>
            <input type="date" name="due">
            <input type="text" name="notes" placeholder="Notes">
            <button class="btn primary small" onclick="submitAddForm('${jsAttr(g)}')">Add</button>
            <button class="btn small" onclick="closeAddForm('${jsAttr(g)}')">Cancel</button>
          </div>
        </div>
      </div>`;
    }).join('');
    const doneTasks = filtered.filter(t => rollupStatus(t) === 'Done');
    return openSections + (doneTasks.length ? renderCompletedGroupHtml_(doneTasks) : '');
  }
  // Single collapsed group for every Done parent task, board-wide (not per-group) — Durand:
  // "board should have a done group of parent items that's collapsed." Reuses the same
  // .group-section/.group-head/.group-body markup and CSS as a normal group so it looks and
  // behaves the same, just with its own toggle and no add-task/delete-group controls.
  function renderCompletedGroupHtml_(doneTasks) {
    const collapsed = completedGroupExpanded.board ? '' : 'collapsed';
    const rows = doneTasks.map(t => taskRowHtml(t)).join('');
    return `
      <div class="group-section done-group ${collapsed}" data-group="__completed__">
        <div class="group-head" onclick="toggleCompletedGroup('board')">
          <span class="caret">${collapsed ? '▶' : '▼'}</span>
          <span class="gname">Completed</span>
          <span class="gcount">${doneTasks.length}</span>
        </div>
        <div class="group-body">
          <table>
            <thead><tr>
              <th style="width:26px;"></th>
              <th>Title</th>
              <th>Owner / Status / Priority</th>
              <th>Tags / Due / Progress</th>
              <th>Notes</th>
              <th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }
  function toggleCompletedGroup(viewKey) {
    completedGroupExpanded[viewKey] = !completedGroupExpanded[viewKey];
    renderAll();
  }

  // ---- Kanban view ----
  function renderKanbanView(filtered) {
    // Column placement uses the rollup so a task with subitems lands in the column that
    // matches what its subitems actually say, not a possibly-stale independently-set
    // parent status — otherwise the pill on the card and the column it sits in can disagree.
    return '<div class="kanban-wrap">' + STATUSES.map(s => {
      const items = filtered.filter(t => rollupStatus(t) === s);
      return `
      <div class="kanban-col" data-status="${escapeHtml(s)}" ondragover="onKanbanDragOver(event)" ondragleave="onKanbanDragLeave(event)" ondrop="onKanbanDrop(event, '${jsAttr(s)}')">
        <div class="kanban-col-head"><span>${escapeHtml(s)}</span><span class="cnt">${items.length}</span></div>
        <div class="kanban-col-body">${items.map(t => kanbanCardHtml(t)).join('')}</div>
      </div>`;
    }).join('') + '</div>';
  }
  function kanbanCardHtml(t) {
    const hasSubs = t.subitems && t.subitems.length;
    const subBadge = hasSubs ? `<span class="sub-count-badge">${t.subitems.filter(s => s.done).length}/${t.subitems.length}</span>` : '';
    const delegateLine = hasSubs ? `<div class="kc-meta kc-delegates" title="Delegated to">→ ${escapeHtml(delegateSummaryText(t))}</div>` : '';
    const savedPill = JUST_SAVED_IDS.has(t.id) ? '<span class="saved-pill">&#10003; Saved</span>' : '';
    return `
      <div class="kanban-card" draggable="true" data-id="${t.id}" onclick="onRowClick(event, ${t.id})" ondragstart="onKanbanDragStart(event, ${t.id})" ondragend="onKanbanDragEnd(event)">
        <div class="kc-title"><span>${escapeHtml(t.title)}${subBadge}</span>${docLinkHtml(t)}${savedPill}<button class="icon-btn danger kc-delete" title="Delete task" onclick="event.stopPropagation(); deleteTask(${t.id})">${TRASH_ICON_SVG}</button></div>
        <div class="kc-meta">
          ${avatarHtml(t.owner)}
          <span class="pill ${priorityClass(rollupPriority(t))}" style="pointer-events:none;">${escapeHtml(rollupPriority(t))}</span>
        </div>
        ${delegateLine}
        <div class="kc-meta">
          <span class="kc-due ${isOverdue(t) ? 'overdue' : ''}">${t.timelineEnd ? formatDate(t.timelineEnd) : 'No due date'}</span>
        </div>
        ${bonusCountdownHtml_(t)}
      </div>`;
  }
  let kanbanDragId = null;
  function onKanbanDragStart(e, id) {
    kanbanDragId = id;
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(id)); } catch (err) {} }
    e.currentTarget.classList.add('dragging');
  }
  function onKanbanDragEnd(e) { e.currentTarget.classList.remove('dragging'); }
  function onKanbanDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
  function onKanbanDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
  function onKanbanDrop(e, status) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const id = kanbanDragId;
    kanbanDragId = null;
    if (id == null) return;
    const t = findTask(id);
    if (!t || t.status === status) return;
    const before = t.status;
    t.status = status;
    if (status === 'Done') t.progress = 100;
    logHistory(t, 'status', before, status);
    renderAll(); scheduleSave();
  }

  // ---- Cards view ----
  function renderCardsView(filtered) {
    const groups = [...new Set([...GROUP_ORDER, ...TASKS.map(t => t.group)])].filter(g =>
      filtered.some(t => t.group === g && rollupStatus(t) !== 'Done')
    );
    // Same Board treatment (2026-09-03, per Durand): Done cards move out of their normal
    // group into one collapsed "Completed" group at the end.
    const openSections = groups.map(g => {
      const groupTasks = filtered.filter(t => t.group === g && rollupStatus(t) !== 'Done');
      if (!groupTasks.length) return '';
      // See the matching comment in renderTableView — %-done must read against the whole
      // group (Done tasks included), not just the open subset shown as cards here, or it
      // can never show anything but 0%.
      const allGroupTasks = filtered.filter(t => t.group === g);
      return `
      <div class="card-group">
        <div class="card-group-title">${escapeHtml(g)} <span class="gcount">${groupTasks.length}</span> ${groupBatteryHtml(allGroupTasks)}</div>
        <div class="card-grid">${groupTasks.map(t => taskCardHtml(t)).join('')}</div>
      </div>`;
    }).join('');
    const doneTasks = filtered.filter(t => rollupStatus(t) === 'Done');
    return openSections + (doneTasks.length ? renderCompletedCardsGroupHtml_(doneTasks) : '');
  }
  function renderCompletedCardsGroupHtml_(doneTasks) {
    const collapsed = !completedGroupExpanded.card;
    return `
      <div class="card-group done-group ${collapsed ? 'collapsed' : ''}">
        <div class="card-group-title clickable" onclick="toggleCompletedGroup('card')">
          <span class="caret">${collapsed ? '▶' : '▼'}</span> Completed <span class="gcount">${doneTasks.length}</span>
        </div>
        <div class="card-grid">${doneTasks.map(t => taskCardHtml(t)).join('')}</div>
      </div>`;
  }
  function taskCardHtml(t) {
    const pct = taskProgress(t);
    // Empty fields get a fillable ghost affordance instead of just vanishing — a card
    // with no tags/type/estimate should visibly invite filling them in, not look identical
    // to one where those fields were deliberately left blank on purpose.
    const tagsHtml = (t.tags || []).length ? (t.tags || []).map(tag => tagChipHtml(tag)).join('') : '<span class="tc-empty-field">+ tags</span>';
    const typeHtml = typeBadgeHtml(t) || '<span class="tc-empty-field">+ type</span>';
    const estHtml = t.estHours ? `<span class="tc-est">${t.estHours}h est</span>` : '<span class="tc-empty-field">+ estimate</span>';
    const savedPill = JUST_SAVED_IDS.has(t.id) ? '<span class="saved-pill">&#10003; Saved</span>' : '';
    const hasSubs = t.subitems && t.subitems.length;
    const subBadge = hasSubs ? `<span class="sub-count-badge">${t.subitems.filter(s => s.done).length}/${t.subitems.length}</span>` : '';
    const delegateLine = hasSubs ? `<div class="tc-row tc-delegates" title="Delegated to">→ ${escapeHtml(delegateSummaryText(t))}</div>` : '';
    return `

      // flat 8h/day guess, which is exactly the heuristic the estimation protocol forbids.
      // Adjust the scheduling span only; estHours is never touched by a resize.
      const workDays = workDaysFor(t);

        t.estDays = newWorkDays;

        // and the server's per-day chunk list no longer matches the new length, so drop it

        if (t.timelineEnd) t.scheduledStart = addDays(t.timelineEnd, -(newWorkDays - 1));

  function dowShort(iso) {

        const mo = first.getMonth() + m;
        const monthStart = new Date(y, mo, 1);
        const monthEnd = new Date(y, mo + 1, 0);
        const days = [];
        for (let cur = new Date(monthStart); cur <= monthEnd; cur.setDate(cur.getDate() + 1)) {

  // ---- Delegate-based work items (Workload, Timeline, Today all key off this) ----
  // A "work item" is the actual unit of doing-the-work. A task with no subtasks IS the
  // work item — its owner is doing it directly. A task WITH subtasks contributes no work
  // item of its own: once work is delegated out, the parent's only remaining job is Durand
  // confirming each delegate actually finished their piece (see getAccountabilityTasks) —
  // so each subtask becomes its own work item instead, keyed by its own delegate. This is
  // why "tasks that are truly mine" (no subtasks) still show under Durand, while delegated
  // work shows under whoever it's delegated to.
  //
  // Confirming a delegate's work is itself real time (0.5h) — Code.gs's
  // tsgRollupSubitemHours_/tsgReserveConfirmCapacity_ fold that cost into the parent's
  // estHours and reserve it against Durand's capacity for scheduling math, invisibly.
  // An earlier version of this file ALSO echoed each pending confirmation as its own
  // dated work item here, so it would land as a real block in Today/Workload/Timeline —
  // Durand rejected that (2026-08-26): confirming delegates shouldn't compete for a

  // one-item-per-real-subitem mapping, nothing synthesized.
  function getWorkItems(tasks) {
    const items = [];

      if (t.subitems && t.subitems.length) {
        t.subitems.forEach((s, i) => {
          items.push({
            id: t.id, subIdx: i, isSubtask: true, parentTitle: t.title,
            title: s.title, displayTitle: t.title + ' → ' + s.title,
            delegate: s.delegate || 'Unassigned', status: s.status || 'Not Started',
            priority: s.priority || t.priority, group: t.group, depends: '',
            timelineEnd: s.timelineEnd, estHours: s.estHours,
            scheduledStart: s.scheduledStart, estDays: s.estDays, scheduledDays: s.scheduledDays,
            meetingDate: s.meetingDate, meetingStart: s.meetingStart, meetingEnd: s.meetingEnd
          });
        });
      } else {
        items.push({
          id: t.id, subIdx: null, isSubtask: false, parentTitle: null,
          title: t.title, displayTitle: t.title, taskType: t.taskType,
          delegate: t.owner || 'Unassigned', status: t.status,
          priority: t.priority, group: t.group, depends: t.depends,
          timelineEnd: t.timelineEnd, estHours: t.estHours,
          scheduledStart: t.scheduledStart, estDays: t.estDays, scheduledDays: t.scheduledDays,
          meetingDate: t.meetingDate, meetingStart: t.meetingStart, meetingEnd: t.meetingEnd

  }
  // Parent tasks that have been delegated out (have subtasks) and still have open work —

  function getAccountabilityTasks(tasks) {
    return (tasks || []).filter(t => t.subitems && t.subitems.length && t.status !== 'Done' && t.subitems.some(s => !s.done));
  }
  // How many individual delegated subitems (any parent task, any type) are done-by-someone-
  // else-but-not-yet-confirmed — the number the single Admin rollup line reports. Subitem-
  // level, not task-level: a task with 3 open delegated steps counts as 3, not 1, since
  // each is a separate real confirmation Durand still owes.
  function pendingConfirmCount() {
    let n = 0;
    getAccountabilityTasks(TASKS).forEach(t => {
      t.subitems.forEach(s => { if (!s.done && s.delegate && s.delegate !== CALENDAR_OWNER) n++; });
    });
    return n;
  }
  // Task-level companion to pendingConfirmCount() — the parent tasks that own at least one
  // pending confirmation, so the rollup line has somewhere real to send you (you confirm a
  // delegate's work by opening the task and checking off its subitem, not the rollup itself).
  function pendingConfirmTaskIds() {
    return getAccountabilityTasks(TASKS)
      .filter(t => t.subitems.some(s => !s.done && s.delegate && s.delegate !== CALENDAR_OWNER))
      .map(t => t.id);
  }

  // Auto-scheduling itself now lives server-side (Code.gs: tsgAutoScheduleDoc_), so it
  // runs on every write — dashboard save or _Inbox patch — whether or not this dashboard
  // happens to be open. See the schema comment near TASKS for what that assigns.
  // Client-side mirror of Code.gs tsgDayCapacity_ (TSG_DAY_CAPACITY / TSG_FRIDAY_CAPACITY).
  // The server schedules against 6 usable hours a day and 4 on Fridays; the heatmap was
  // colouring against the flat 8h WORK_DAY_HOURS, so a day the auto-scheduler considered
  // full rendered as merely "partial" here and Durand had no way to see he was already at
  // capacity. Keep these two numbers in sync with Code.gs if either ever changes.
  function dayCapacity(iso) {

  }
  function computeDailyHours(filtered, allDates) {

    function ensure(name) {

      return byAssignee[name];
    }
    function addHours(name, date, amount, kind) {
      if (!amount) return;
      const rec = ensure(name);
      if (!rec.days[date]) rec.days[date] = { tasks: 0, admin: 0, meetings: 0 };
      rec.days[date][kind] += amount;
    }
    if (!allDates.length) return byAssignee;
    // Grouped by delegate, not owner — a delegated task contributes its subtasks (each
    // under its own delegate) rather than itself; a task with no subtasks contributes

    const open = getWorkItems(filtered).filter(t => t.status !== 'Done');
    open.forEach(t => {

      const span = scheduledSpan(t);
      const perDay = hours / span.days;
      if (span.chunkDays) {

    });

      if (!ev || !ev.date || ev.date < allDates[0] || ev.date > allDates[allDates.length - 1]) return;

  function renderAssigneeMiniGantt(name, allDates) {

  // ---- Calendar sync (meetings from Drive-owner's calendar, via Apps Script) ----
  function isCalendarRangeCovered(s, e) {

  }
  async function fetchAndMergeCalendar(start, end) {

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const events = await res.json();

  function neededTodayCalendarRange() {

  // ---- Today view ----
  const TODAY_DAY_START = '07:00';
  const TODAY_DAY_END = '16:30';
  const TODAY_ADMIN_MIN = 30;
  const TODAY_LUNCH_MIN = 60;
  const TODAY_BREAK_MIN = 10;
  const TODAY_RELIEF_MIN = 20;
  const TODAY_ERRAND_MIN = 30;
  const TODAY_MAX_BLOCK_MIN = 120;
  // Travel time + meeting prep (2026-08-27) — mirrors Code.gs's TSG_MEETING_PREP_MIN /
  // TSG_MEETING_TRAVEL_MIN / tsgIsOffSiteMeeting_ exactly, so the Today view's visual
  // schedule agrees with what the server-side auto-scheduler actually reserved capacity
  // for (getCalendarHours' bufferedHours). Falls back to computing it client-side from

  // sending prepMin/travelMin/offSite directly.
  const TODAY_MEETING_PREP_MIN = 10;

  function todayIsOffSiteMeeting_(ev) {
    const loc = (ev.location || '').trim();

    if (TODAY_VIRTUAL_MEETING_RE.test(loc) || TODAY_VIRTUAL_MEETING_RE.test(ev.title || '')) return false;

  }
  function hmToMin(hm) {

  function minToHm(m) {

  }
  // Converts a Calendar API ISO timestamp (UTC — from tsgListUpcomingMeetings_ /

  // Ops Manual duty with nothing to open at all, so it gets no click and no checkbox.
  function adminLineHtml(a) {
    const kind = a.kind || (a.taskId ? 'action' : 'info');
    let onclick = '';
    if (kind === 'action' && a.taskId) onclick = ` onclick="event.stopPropagation(); openTaskCard(${a.taskId})"`;
    else if (kind === 'group' && a.ids && a.ids.length) onclick = ` onclick="event.stopPropagation(); openMultiTaskModal('${jsAttr(a.label)}', [${a.ids.join(',')}])"`;
    else if (kind === 'nav') onclick = ` onclick="event.stopPropagation(); setView('board')"`;
    const clickable = onclick ? ' clickable' : '';
    return `<div class="today-admin-line kind-${kind}${clickable}"${onclick}><span>${escapeHtml(a.label)}</span>${a.sub ? `<span class="today-admin-sub">${escapeHtml(a.sub)}</span>` : ''}</div>`;
  }
  function renderTodayDayFull(dateISO) {
    const agenda = buildTodayAgenda(dateISO);
    // Every block except a bare "Open" gap can be clicked to expand into a bigger, more
    // detailed popout (see openScheduleDetail) — the row-level click is guarded so it
    // never fires when the click actually landed on one of the row's own inner
    // affordances (a task line, an admin line), which keep their existing single-item
    // click behavior untouched.
    const rows = agenda.schedule.map((item, idx) => {
      const timeLabel = minToLabel(item.start) + ' – ' + minToLabel(item.end);
      let content;
      if (item.kind === 'task') {
        content = `<div class="today-title">${escapeHtml(item.title)}</div><div class="today-tasklist">` +
          item.items.map(c => `<div class="today-task-line" onclick="event.stopPropagation(); openTaskCard(${c.task.id})">${avatarHtml(c.task.delegate)}<span>${escapeHtml(c.task.displayTitle)}</span><span class="today-task-mins">${Math.round(c.minutes)}m</span></div>`).join('') +
          '</div>';
      } else if (item.kind === 'admin' && item.items && item.items.length) {
        content = `<div class="today-title">${escapeHtml(item.title)}</div><div class="today-tasklist">` +
          item.items.map(a => adminLineHtml(a)).join('') +
          '</div>';
      } else if (item.kind === 'calendar') {
        const leadBits = [];
        if (item.travelMin) leadBits.push(item.travelMin + 'm travel');
        if (item.prepMin) leadBits.push(item.prepMin + 'm prep');
        const leadHtml = leadBits.length ? `<span class="today-meeting-lead">+ ${leadBits.join(' + ')}</span>` : '';
        const linkedHtml = (item.linkedItems && item.linkedItems.length)
          ? `<div class="today-tasklist">` + item.linkedItems.map(c => `<div class="today-task-line" onclick="event.stopPropagation(); openTaskCard(${c.id})">${avatarHtml(c.delegate)}<span>${escapeHtml(c.displayTitle)}</span></div>`).join('') + '</div>'
          : '';
        content = `<div class="today-title">${escapeHtml(item.title)}${item.offSite ? ' <span class="today-offsite-tag">off-site</span>' : ''}</div>` +
          `<div class="today-meeting-meta"><span>${minToLabel(item.meetingStart)} – ${minToLabel(item.meetingEnd)}</span>${leadHtml}</div>` + linkedHtml;
      } else if (item.kind === 'gap') {
        const mins = item.end - item.start;
        const h = Math.floor(mins / 60), m = mins % 60;
        const durLabel = (h ? h + 'h ' : '') + (m ? m + 'm' : (h ? '' : '0m'));
        content = `<div class="today-title">Open — ${durLabel} free</div>`;
      } else {
        content = `<div class="today-title">${escapeHtml(item.title)}</div>`;
      }
      const rowClick = item.kind === 'gap' ? '' : ` onclick="event.stopPropagation(); openScheduleDetail('${dateISO}', ${idx})"`;
      return `
      <div class="today-item type-${item.kind}${item.kind === 'gap' ? '' : ' schedule-clickable'}"${rowClick}>
        <div class="today-time">${timeLabel}</div>
        <div class="today-content">${content}</div>
      </div>`;
    }).join('');
    const isReallyToday = dateISO === todayISO();
    const untimedEvents = CALENDAR_EVENTS.filter(ev => ev && ev.date === dateISO && (!ev.start || !ev.end));
    const untimedHtml = untimedEvents.length ? `<div class="today-untimed"><b>Also on the calendar${isReallyToday ? ' today' : ''} (time not synced — redeploy Code.gs for exact times):</b> ${untimedEvents.map(ev => escapeHtml(ev.title || 'Meeting')).join(', ')}</div>` : '';
    const unplacedCount = agenda.unplaced.reduce((n, b) => n + b.items.length, 0);
    // Each of these three modules (schedule, didn't-fit, due-from-others) drills down into
    // a bigger, fuller view of just its own items when you click the module itself — its
    // header or background, not one specific row (rows keep their own more-targeted click,
    // guarded with stopPropagation above so it never also triggers the module drilldown).
    const scheduleHtml = `<div class="today-schedule-container clickable-panel" onclick="openFullScheduleDetail('${dateISO}')" title="View the full day's schedule"><div class="today-side-head today-schedule-head">Today's Schedule</div><div class="today-wrap">${rows}</div></div>`;
    const overflowHtml = `<div class="today-side today-overflow clickable-panel" onclick="openOverflowDrilldown('${dateISO}')" title="View all of these as full cards"><div class="today-side-head">Didn't fit${isReallyToday ? ' today' : ''}${unplacedCount ? ' (' + unplacedCount + ')' : ''}</div><div class="today-side-list">${renderOverflowTasks(agenda.unplaced)}</div></div>`;
    const sideHtml = `<div class="today-side clickable-panel" onclick="openDueSoonDrilldown('${dateISO}')" title="View all of these as full cards"><div class="today-side-head">Due from others — next 3 days</div><div class="today-side-list">${renderOthersDueSoon(dateISO)}</div></div>`;
    return `<div class="today-layout">${scheduleHtml}<div class="today-sides-row">${overflowHtml}${sideHtml}</div></div>${untimedHtml}`;
  }
  // Clicking a schedule block (2026-08-27) opens a bigger, more detailed popout instead
  // of leaving Durand stuck with the compact one-line-per-block summary — full task
  // cards for a task block, the admin checklist at full size, or a meeting's actual
  // time plus its travel/prep breakdown for a calendar block. Recomputes the agenda for
  // dateISO fresh rather than threading the row's own item through an inline handler, so
  // it can't go stale between render and click.
  // The detail body for ONE schedule block — factored out so a single block's popout
  // (openScheduleDetail) and the whole-day drilldown (openFullScheduleDetail) render each
  // block identically instead of maintaining two copies of the same per-kind logic.
  function scheduleBlockDetailBody(item) {
    const timeLabel = minToLabel(item.start) + ' – ' + minToLabel(item.end);
    if (item.kind === 'task') {
      return '<div class="card-grid">' + item.items.map(c => taskCardHtml(c.task)).join('') + '</div>';
    } else if (item.kind === 'admin') {
      return (item.items && item.items.length)
        ? '<div class="sched-detail-admin">' + item.items.map(a => adminLineHtml(a)).join('') + '</div>'
        : '<div class="today-side-empty">Nothing on this list right now.</div>';
    } else if (item.kind === 'calendar') {
      const rows = [
        ['When', minToLabel(item.meetingStart) + ' – ' + minToLabel(item.meetingEnd)],
      ];
      if (item.offSite) rows.push(['Where', escapeHtml(item.location || 'Off-site')]);
      if (item.travelMin) {
        rows.push(['Travel there', item.travelMin + ' min — leave by ' + minToLabel(item.meetingStart - item.travelMin)]);
        rows.push(['Travel back', item.travelMin + ' min']);
      }
      if (item.prepMin) rows.push(['Prep', item.prepMin + ' min — blocked from ' + minToLabel(item.start)]);
      rows.push(['Blocked on schedule', timeLabel]);
      const linkedCardsHtml = (item.linkedItems && item.linkedItems.length)
        ? '<div class="sched-detail-note">Linked task' + (item.linkedItems.length > 1 ? 's' : '') + ':</div><div class="card-grid">'
          + item.linkedItems.map(c => taskCardHtml(findTask(c.id))).filter(Boolean).join('') + '</div>'
        : '';
      return '<div class="sched-detail-meeting">' +
        rows.map(r => `<div class="sched-detail-row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('') +
        '</div><div class="sched-detail-note">Synced from your calendar — edit the event there to change it.</div>' + linkedCardsHtml;
    } else if (item.kind === 'gap') {
      return `<div class="sched-detail-note">Open — ${timeLabel} free.</div>`;
    }
    return `<div class="sched-detail-note">${escapeHtml(item.title)}, ${timeLabel}.</div>`;
  }
  function openScheduleDetail(dateISO, idx) {
    const agenda = buildTodayAgenda(dateISO);
    const item = agenda.schedule[idx];
    if (!item) return;
    const timeLabel = minToLabel(item.start) + ' – ' + minToLabel(item.end);
    if (item.kind === 'task') { currentFilteredOrder = item.items.map(c => c.task.id); navOrderScoped = true; }
    document.getElementById('dayViewTitle').textContent = item.kind === 'calendar' ? item.title : item.title + ' · ' + timeLabel;
    document.getElementById('dayViewBody').innerHTML = scheduleBlockDetailBody(item);
    document.getElementById('dayViewModal').classList.add('open');
  }
  // Clicking the schedule module itself (its header, or anywhere between blocks) rather
  // than one specific block drills into the WHOLE day — every block's full detail, one
  // after another, instead of the compact one-line-per-block timeline. Block-level clicks
  // (openScheduleDetail) stop propagation, so this only fires when the click actually
  // landed on the module's own chrome.
  function openFullScheduleDetail(dateISO) {
    const agenda = buildTodayAgenda(dateISO);
    document.getElementById('dayViewTitle').textContent = relativeDayLabel(dateISO) + ' — Full Schedule';
    const blocks = agenda.schedule.filter(item => item.kind !== 'gap');
    const sections = blocks.map(item => {
      const timeLabel = minToLabel(item.start) + ' – ' + minToLabel(item.end);
      return `<div class="sched-full-block"><div class="sched-full-block-head"><span>${escapeHtml(item.title)}</span><span class="sched-full-block-time">${timeLabel}</span></div>${scheduleBlockDetailBody(item)}</div>`;
    }).join('');
    document.getElementById('dayViewBody').innerHTML = sections || '<div class="today-side-empty">Nothing scheduled.</div>';
    document.getElementById('dayViewModal').classList.add('open');
  }
  // Same drilldown pattern for the two side panels — clicking the panel itself (its
  // header, or the panel background) opens every item it holds as full task cards,
  // instead of the compact one-line-per-item list. Recomputes from dateISO live so it
  // can't go stale between render and click, same as the schedule drilldowns above.
  function openOverflowDrilldown(dateISO) {
    const agenda = buildTodayAgenda(dateISO);
    const ids = [];
    agenda.unplaced.forEach(b => b.items.forEach(c => { if (ids.indexOf(c.task.id) === -1) ids.push(c.task.id); }));
    if (!ids.length) return;
    openMultiTaskModal("Didn't fit" + (dateISO === todayISO() ? ' today' : ''), ids);
  }
  function openDueSoonDrilldown(dateISO) {
    const list = getOthersDueSoon(dateISO);
    const ids = [];
    list.forEach(t => { if (ids.indexOf(t.id) === -1) ids.push(t.id); });
    if (!ids.length) return;
    openMultiTaskModal('Due from others — next 3 days', ids);
  }
  function renderTodayWeek() {
    const monday = mondayOf(todayViewDate);
    const cols = [0, 1, 2, 3, 4].map(i => renderTodayWeekColumn(addDays(monday, i))).join('');
    return `<div class="week-grid">${cols}</div>`;
  }
  function renderTodayWeekColumn(dateISO) {
    const agenda = buildTodayAgenda(dateISO);
    const isToday = dateISO === todayISO();
    const d = new Date(dateISO + 'T00:00:00');
    const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
    const dayNum = d.getDate();
    const items = agenda.schedule.filter(it => it.kind === 'task' || it.kind === 'calendar');
    const rows = items.length ? items.map(item => {
      const timeLabel = minToLabel(item.start);
      if (item.kind === 'task') {
        return `<div class="wk-item wk-task"><div class="wk-item-time">${timeLabel}</div><div class="wk-item-body">${escapeHtml(item.title)}<span class="wk-item-count">${item.items.length}</span></div></div>`;
      }
      return `<div class="wk-item wk-cal"><div class="wk-item-time">${timeLabel}</div><div class="wk-item-body">${escapeHtml(item.title)}</div></div>`;
    }).join('') : `<div class="wk-empty">Nothing scheduled</div>`;
    const unplacedCount = agenda.unplaced.reduce((n, b) => n + b.items.length, 0);
    const overflowLine = unplacedCount ? `<div class="wk-overflow">+${unplacedCount} didn't fit</div>` : '';
    return `<div class="wk-col ${isToday ? 'is-today' : ''}" onclick="jumpToDay('${dateISO}')">
      <div class="wk-col-head"><span class="wk-dayname">${dayName}</span><span class="wk-daynum">${dayNum}</span></div>
      <div class="wk-col-body">${rows}${overflowLine}</div>
    </div>`;
  }
  function renderTodayMonth() {
    const d = new Date(todayViewDate + 'T00:00:00');
    const year = d.getFullYear(), month = d.getMonth();
    const firstOfMonth = new Date(year, month, 1).toISOString().slice(0, 10);
    const gridStart = mondayOf(firstOfMonth);
    const totalDays = daysInMonth(year, month);
    const lastOfMonth = new Date(year, month, totalDays).toISOString().slice(0, 10);
    const lastDow = new Date(lastOfMonth + 'T00:00:00').getDay();
    const daysAfter = lastDow === 0 ? 0 : 7 - lastDow;
    const gridEnd = addDays(lastOfMonth, daysAfter);
    const cells = [];
    let cursor = gridStart;
    while (cursor <= gridEnd) { cells.push(cursor); cursor = addDays(cursor, 1); }
    const todayStr = todayISO();
    const rank = { Critical: 0, High: 1, Medium: 2, Low: 3 };
    const weekdayHeader = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => `<div class="mcal-weekday">${w}</div>`).join('');
    const cellsHtml = cells.map(iso => {
      const inMonth = new Date(iso + 'T00:00:00').getMonth() === month;
      const dayNum = new Date(iso + 'T00:00:00').getDate();
      const dueTasks = getWorkItems(TASKS).filter(t => t.status !== 'Done' && t.timelineEnd === iso && (t.delegate || 'Unassigned') === CALENDAR_OWNER);
      dueTasks.sort((a, b) => (rank[a.priority] != null ? rank[a.priority] : 4) - (rank[b.priority] != null ? rank[b.priority] : 4));
      const dotsHtml = dueTasks.slice(0, 4).map(t => `<span class="mcal-dot ${priorityClass(t.priority)}" title="${escapeHtml(t.displayTitle)}"></span>`).join('');
      const moreHtml = dueTasks.length > 4 ? `<span class="mcal-more">+${dueTasks.length - 4}</span>` : '';
      const hasEvents = CALENDAR_EVENTS.some(ev => ev && ev.date === iso);
      return `<div class="mcal-cell ${inMonth ? '' : 'mcal-outside'} ${iso === todayStr ? 'mcal-today' : ''}" onclick="jumpToDay('${iso}')">
        <div class="mcal-daynum">${dayNum}${hasEvents ? '<span class="mcal-evt-dot"></span>' : ''}</div>
        <div class="mcal-dots">${dotsHtml}${moreHtml}</div>
      </div>`;
    }).join('');
    return `<div class="mcal"><div class="mcal-weekdays">${weekdayHeader}</div><div class="mcal-grid">${cellsHtml}</div></div>`;
  }

  function cssId(g) { return g.replace(/[^a-z0-9]/gi, '_'); }

  // Subtasks are the delegation unit: each one gets its own delegate, status, priority,
  // due date and estimate — everything a top-level task has except an owner, since
  // accountability for the work stays with the parent task, not the delegated piece.
  // Tasks themselves carry no assignee/delegate field at all — wanting to note who's
  // actually doing a task is the signal that it needs to be broken into subtasks.
  // Shared by the board's expandable sub-row and the task detail modal so both stay in sync.
  function subitemRowHtml(t, s, i) {
    const due = s.timelineEnd || '';
    const overdueSub = due && due < todayISO() && !s.done;
    const blockedIdx = subitemBlockedBy(t, i);
    const blockedNote = blockedIdx != null
      ? `<div class="sub-blocked-note" title="Subitems chain sequentially by default — this one waits on the subitem it depends on.">&#128274; Blocked by: ${escapeHtml(t.subitems[blockedIdx].title)}</div>`
      : '';
    // "Previous subtask" (the default chain) is left unselected — s.depends only holds a
    // value when it's an explicit OVERRIDE of the default sequential chain. subitemBlockedBy()
    // never default-blocks i === 0 (there is no previous subitem), so that index's empty
    // option reads "No dependency (default)" instead of "Previous subtask (default)" — but
    // the selector itself stays visible at every index (fixed 2026-09-01) so an explicit
    // override that lands at index 0 via drag-and-drop reorder remains visible/editable
    // instead of being silently hidden.
    const dependsOptions = t.subitems.map(function(other, oi) {
      if (oi === i) return '';
      return `<option value="${oi}" ${String(s.depends) === String(oi) ? 'selected' : ''}>${escapeHtml(other.title.slice(0, 40))}</option>`;
    }).join('');
    const tagsHtml = (s.tags || []).map(function(tag, ti) {
      return `<span class="tag-chip ${tagClass(tag)}" onclick="removeSubTag(${t.id}, ${i}, ${ti})" title="Click to remove">${escapeHtml(tag)}</span>`;
    }).join('');
    return `
      <div class="sub-item ${s.done ? 'done' : ''}" data-sub-idx="${i}" ondragover="onSubDragOver(event, ${t.id}, ${i})" ondragleave="onSubDragLeave(event)" ondrop="onSubDrop(event, ${t.id}, ${i})">
        <span class="sub-drag-handle" draggable="true" title="Drag to reorder" ondragstart="onSubDragStart(event, ${t.id}, ${i})" ondragend="onSubDragEnd(event)">&#8942;&#8942;</span>
        <input type="checkbox" ${s.done ? 'checked' : ''} ${blockedIdx != null ? 'title="Blocked by an earlier subitem — you can still check it off, but consider finishing that one first."' : ''} onchange="toggleSubitem(${t.id}, ${i}, this)">
        <div class="sub-item-body">
          <div class="sub-item-title-row">
            <span class="sub-title-edit" contenteditable="true" onblur="onSubFieldEdit(${t.id}, ${i}, 'title', this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${escapeHtml(s.title)}</span>
            <button class="icon-btn danger" title="Delete subitem" onclick="deleteSubitem(${t.id}, ${i})">${TRASH_ICON_SVG}</button>
          </div>
          ${blockedNote}
          <div class="sub-meta">
            <span class="sub-delegate" title="Delegate — who this subtask is delegated to">${avatarHtml(s.delegate)}${delegateSelect(t.id, i, s.delegate)}</span>
            ${subPillSelect('status', s.status, t.id, i)}
            ${subPillSelect('priority', s.priority, t.id, i)}
            <span class="sub-due ${overdueSub ? 'overdue' : ''}"><input type="date" class="due-input" value="${due}" onchange="onSubFieldChange(${t.id}, ${i}, 'timelineEnd', this.value)"></span>
            <span class="sub-hours"><input type="number" min="0.25" step="0.25" class="due-input sub-hours-input" value="${s.estHours != null ? s.estHours : ''}" placeholder="hrs" onchange="onSubFieldChange(${t.id}, ${i}, 'estHours', this.value ? Number(this.value) : null)"></span>
            ${t.subitems.length > 1 ? `<select class="due-input sub-depends-select" title="Depends on — defaults to the subitem right before it" onchange="onSubFieldChange(${t.id}, ${i}, 'depends', this.value)"><option value="">${i > 0 ? 'Previous subtask (default)' : 'No dependency (default)'}</option>${dependsOptions}</select>` : ''}
          </div>
          <div class="sub-meta">${tagsHtml}<span class="icon-btn" onclick="addSubTag(${t.id}, ${i})" title="Add tag">+ tag</span></div>
          <div class="sub-meta">
            <select class="due-input sub-type-select" title="Type" onchange="onSubFieldChange(${t.id}, ${i}, 'taskType', this.value)">${TASK_TYPES.map(function(o) { return '<option value="' + o + '"' + (o === (s.taskType || 'Actionable Task') ? ' selected' : '') + '>' + o + '</option>'; }).join('')}</select>
            ${s.taskType === 'Meeting' ? `<span class="icon-btn" onclick="openMeetingPicker(${t.id}, ${i})" title="Link a calendar meeting">${(s.docs || []).some(d => d.type === 'meeting') ? '&#128197; meeting' : '+ meeting'}</span>` : ''}
          </div>
          <div class="sub-meta sub-docs-row">${docsListHtml(s.docs, t.id, i)}<span class="icon-btn" onclick="addManualDoc(${t.id}, ${i})" title="Add a link or file">+ link</span></div>
          ${s.notes ? `<div class="sub-item-notes" contenteditable="true" onblur="onSubFieldEdit(${t.id}, ${i}, 'notes', this)">${escapeHtml(s.notes)}</div>` : `<div class="sub-item-notes sub-item-notes-empty" contenteditable="true" onblur="onSubFieldEdit(${t.id}, ${i}, 'notes', this)" data-placeholder="Add notes…"></div>`}
        </div>
      </div>`;
  }
  function addSubTag(id, idx) {
    const tag = prompt('New tag:');
    if (!tag || !tag.trim()) return;
    const t = findTask(id);
    const s = t.subitems[idx];
    s.tags = [...(s.tags || []), tag.trim()];
    logHistory(t, 'subitem-tag', s.title, tag.trim());
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }
  function removeSubTag(id, idx, tagIdx) {
    const t = findTask(id);
    const s = t.subitems[idx];
    const removed = (s.tags || [])[tagIdx];
    s.tags.splice(tagIdx, 1);
    logHistory(t, 'subitem-tag', s.title, 'removed: ' + removed);
    renderAll(); if (currentModalTaskId === id) openTaskCard(id); scheduleSave();
  }

  function taskRowHtml(t) {
    const pct = taskProgress(t);
    const hasSubs = t.subitems && t.subitems.length > 0;
    const subOpen = hasSubs && expandedSubtasks.has(t.id);
    const tagsHtml = (t.tags || []).map(tag => tagChipHtml(tag)).join('');
    let html = `
      <tr class="task-row" data-id="${t.id}" onclick="onRowClick(event, ${t.id})">
        <td>${hasSubs ? `<button class="icon-btn" onclick="toggleSub(${t.id})">${subOpen ? '▾' : '▸'}</button>` : ''}</td>
        <td class="title-cell"><span class="ttl-edit" contenteditable="true" onblur="onTitleEdit(${t.id}, this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${escapeHtml(t.title)}</span>${hasSubs ? `<span class="sub-count-badge" title="${t.subitems.filter(s=>s.done).length} of ${t.subitems.length} subtasks done">${t.subitems.filter(s=>s.done).length}/${t.subitems.length}</span>` : ''}${docLinkHtml(t)}</td>
        <td class="cell-group">
          <div class="cell-group-stack">
            <div class="cell-group-row owner-cell" title="Owner — accountable for this task">${avatarHtml(t.owner)}${ownerSelect(t.id, t.owner)}</div>
            <div class="cell-group-row">${hasSubs
              ? `<span class="pill ${statusClass(rollupStatus(t))}" style="pointer-events:none;" title="Rolled up from subtasks — edit status on the subtasks below.">${escapeHtml(rollupStatus(t))}</span><span class="pill ${priorityClass(rollupPriority(t))}" style="pointer-events:none;" title="Rolled up from subtasks — edit priority on the subtasks below.">${escapeHtml(rollupPriority(t))}</span>`
              : `${pillSelect('status', t.status, t.id)}${pillSelect('priority', t.priority, t.id)}`
            }</div>
          </div>
        </td>
        <td class="cell-group">
          <div class="cell-group-stack">
            <div class="cell-group-row tags-cell">${typeBadgeHtml(t)}${tagsHtml}<span class="icon-btn" onclick="addTag(${t.id})" title="Add tag">+</span></div>
            <div class="cell-group-row">
              <span class="due-cell ${isOverdue(t) ? 'overdue' : ''}"><input type="date" class="due-input" value="${t.timelineEnd || ''}" onchange="onDueChange(${t.id}, this)"></span>
              <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>
            </div>
            <div class="cell-group-row">${bonusCountdownHtml_(t)}</div>
          </div>
        </td>
        <td class="notes-cell"><span contenteditable="true" onblur="onFieldEdit(${t.id}, 'notes', this)">${escapeHtml(t.notes || '')}</span></td>
        <td class="row-actions">
          <button class="icon-btn danger" title="Delete task" onclick="deleteTask(${t.id})">${TRASH_ICON_SVG}</button>

    const lines = input.value.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);

  // Enter submits and closes the form (one task, done). Shift+Enter submits and keeps the
  // form open with focus back on the title field, so a run of tasks can be typed in one

  function handleAddFormKeydown(e, g) {

  // Every new task goes through the server's add_task path — the same one every
  // terminal-authored _Inbox patch uses, dedup classifier included — instead of being
  // pushed straight into the local array and folded into the next full-document save.
  // That second path used to let a task onto the board with no dedup check at all and a
  // client-guessed id; now there's exactly one way a task gets added, from any source.
  async function createTask(fields) {
    setSyncStatus('saving');
    try {
      const res = await apiFetch('', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ op: 'add_task', task: fields })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const resp = await res.json();
      if (resp && resp.ok === false) {
        if (resp.error === 'conflict') {
          setSyncStatus('conflict', 'The tracker changed elsewhere since this loaded — reloading the latest version. Please retry adding the task.');
          // keepStatus — same reason as the conflict branch in doSaveNow_: the reload's own
          // status updates would otherwise wipe this warning before it could be read.
          await loadData(false, true);
          return { ok: false, error: 'conflict' };
        }
        throw new Error(resp.error || 'Add failed');
      }
      if (typeof resp.docVersion === 'number') RAW_META.docVersion = resp.docVersion;
      const result = resp && resp.addResult;
      if (result && result.verdict === 'added' && typeof result.taskId === 'number') {
        TASKS.push(Object.assign({}, fields, { id: result.taskId, subitems: fields.subitems || [], history: fields.history || [] }));
        setSyncStatus('saved');
        renderAll();
        return { ok: true, added: true };
      }
      // The classifier caught something — an exact duplicate, a near-duplicate folded in
      // as an update, or a related task merged in as a subitem. No new task was added
      // locally; reload so this tab reflects whatever actually happened server-side.
      await loadData(false);
      setSyncStatus('saved');
      const note = result && result.matchedTaskId != null
        ? (result.verdict === 'duplicate'
            ? 'That looked like a duplicate of task #' + result.matchedTaskId + ' — nothing new was added.'
            : 'Merged into task #' + result.matchedTaskId + ' instead of creating a new one.')
        : 'Handled without creating a new task.';
      return { ok: true, added: false, note: note };
    } catch (err) {
      setSyncStatus('error', err.message || err);
      return { ok: false, error: err.message || String(err) };
    }
  }

  // ---- Live sync with Drive (via Apps Script Web App) ----
  function buildDoc() {

      // manage directly (scan watermarks, dismissedGoogleTaskIds, errands, etc.) survive
      // every save — only the fields below are ever overwritten by the dashboard itself.

        version: 2,
        created: META.created || META.lastUpdated,
        last_updated: todayISO(),
        owner: 'Durand',

  // ---- Sync pill + connection-lost overlay (2026-09-03, per Durand) ----
  // Three colors, three meanings:
  //  - RED: no confirmed connection. Covers both "never loaded successfully yet" (the
  //    empty preload screen, before we know the API even works) and "was working, just
  //    lost it." Either way, the full-screen overlay below takes over: everything behind
  //    it is disabled and greyed out until the connection is confirmed good again.
  //  - AMBER/yellow: actively loading or saving, but on top of an already-proven-good
  //    connection — non-blocking, the app stays fully usable while this shows.
  //  - GREEN: synced/idle. Last operation succeeded.
  const DEFAULT_ERROR_MSG = "Couldn't reach the Task Tracker API. Edits still work in this tab but won't save to Drive until reconnected.";
  let syncFailCount = 0;
  let lastFailedOp = null; // 'load' | 'save' | null — which retry attemptReconnect() should run
  let reconnectTimer = null;
  const RECONNECT_DELAY_MS = 5000;
  const RECONNECT_ESCALATE_AFTER = 3; // auto-retries before switching to the "needs a person" view

  function setSyncStatus(state, detail) {
    const el = document.getElementById('syncStatus');
    let cls, label;
    if (state === 'error') {
      cls = 'bad';
      label = detail ? String(detail) : DEFAULT_ERROR_MSG;
      syncFailCount++;
      scheduleReconnect_();
      showConnOverlay_(syncFailCount > RECONNECT_ESCALATE_AFTER ? 'escalated' : 'reconnecting', label);
    } else if (state === 'loading' || state === 'saving') {
      if (!dataLoaded) {
        // Nothing has ever loaded in this tab yet — treat exactly like a lost connection:
        // red pill, blocking overlay, until the very first load actually succeeds.
        cls = 'bad';
        label = 'Connecting to your Task Tracker…';
        showConnOverlay_('reconnecting', label);
      } else {
        cls = 'warn';
        label = state === 'saving' ? 'Saving…' : 'Loading…';
        hideConnOverlay_();
      }
    } else if (state === 'conflict') {
      // Self-resolving — the caller already reloads the latest version immediately after
      // this. Worth flagging (amber, not green) but not worth blocking the whole app over.
      cls = 'warn';
      label = detail ? String(detail) : 'Resolving a change made elsewhere…';
      hideConnOverlay_();
    } else {
      // 'saved' / 'loaded' / any other success path.
      cls = 'ok';
      label = 'Synced';
      syncFailCount = 0;
      lastFailedOp = null;
      clearTimeout(reconnectTimer);
      hideConnOverlay_();
    }
    el.className = 'sync-pill ' + cls;
    el.title = label;
  }

  function scheduleReconnect_() {
    clearTimeout(reconnectTimer);
    // Past the escalation threshold, stop auto-retrying silently in the background —
    // the overlay has switched to asking a person to act, and "Retry now" covers it.
    if (syncFailCount > RECONNECT_ESCALATE_AFTER) return;
    reconnectTimer = setTimeout(attemptReconnect, RECONNECT_DELAY_MS);
  }
  function attemptReconnect() {
    clearTimeout(reconnectTimer);
    if (lastFailedOp === 'save') doSave();
    else loadData();
  }
  function showConnOverlay_(kind, message) {
    document.body.classList.add('conn-blocking');
    document.getElementById('connOverlay').hidden = false;
    const icon = document.getElementById('connIcon');
    const title = document.getElementById('connTitle');
    const exportBtn = document.getElementById('connExportBtn');
    if (kind === 'escalated') {
      icon.innerHTML = '&#9888;&#65039;';
      title.textContent = 'Connection problem';
      exportBtn.hidden = false;
    } else {
      icon.innerHTML = '<div class="conn-spinner"></div>';
      title.textContent = dataLoaded ? 'Reconnecting…' : 'Connecting…';
      exportBtn.hidden = true;

  }
  function hideConnOverlay_() {
    document.body.classList.remove('conn-blocking');
    document.getElementById('connOverlay').hidden = true;
  }

  let saveTimer = null;
  // Per-card "Saved" pill: best-effort, tracks whichever task's modal is open at the moment
  // a save is scheduled (the vast majority of edits go through the task modal). Inline edits
  // made with no modal open won't get a pill — there's no reliable per-field edit hook to
  // attach to without touching every one of the ~24 call sites that call scheduleSave().
  const JUST_SAVED_IDS = new Set();
  let justSavedTimer = null;
  let pendingSaveId = null;
  function scheduleSave() {
    setSyncStatus('saving');
    if (currentModalTaskId != null) pendingSaveId = currentModalTaskId;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 600);
  }
  // Reentrancy guard. doSave() sends the WHOLE document plus the docVersion this tab last
  // saw, so two saves in flight at once race: the second was built (and version-stamped)
  // before the first came back, so it either loses the first save's changes or trips a
  // spurious conflict. Serialise them — a save started while one is in flight simply runs
  // after it, against the version the first one just established.
  let saveChain = Promise.resolve();
  function doSave() {
    saveChain = saveChain.then(doSaveNow_, doSaveNow_);
    return saveChain;
  }
  async function doSaveNow_() {
    const savedId = pendingSaveId;
    pendingSaveId = null;
    try {
      const res = await apiFetch('', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(buildDoc())
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // The backend now submits every save as a version-checked patch through the same
      // _Inbox queue everything else writes through, instead of blind-overwriting the
      // file (that overwrite was the root cause of an earlier data-loss incident). A
      // save only fails with "conflict" if something else changed the tracker between
      // this tab's last load and this save — reload instead of silently losing that data.
      let resp = null;
      // Fail CLOSED. This used to swallow the parse error and fall through to "Synced",
      // so a save the backend never accepted — an HTML error page, a truncated body, an
      // auth redirect — looked exactly like a successful one. An unreadable response is
      // not a confirmed write, so say so instead of claiming the data is safe.
      try {
        resp = await res.json();
      } catch (parseErr) {
        throw new Error('Unrecognized response from the Task Tracker API — save not confirmed.');
      }
      if (resp && resp.ok === false) {
        if (resp.error === 'conflict') {
          setSyncStatus('conflict', 'The tracker changed elsewhere since this loaded — reloading the latest version. Please redo your last change.');
          // keepStatus: loadData otherwise ends with setSyncStatus('loaded') ("Synced"),
          // wiping the conflict warning set one line above within a few hundred ms — the
          // save failed and Durand never saw it.
          await loadData(false, true);
          return;
        }
        throw new Error(resp.error || 'Save rejected');
      }
      if (resp && typeof resp.docVersion === 'number') RAW_META.docVersion = resp.docVersion;
      setSyncStatus('saved');
      if (savedId != null) {
        JUST_SAVED_IDS.add(savedId);
        clearTimeout(justSavedTimer);
        renderAll();
        justSavedTimer = setTimeout(function() { JUST_SAVED_IDS.delete(savedId); renderAll(); }, 2500);
      }
    } catch (err) {
      lastFailedOp = 'save';
      setSyncStatus('error', err.message || err);
    }
  }

  // keepStatus (2026-09-02): when true, skip the closing setSyncStatus('loaded'). A reload
  // triggered by a failed/conflicting save has already put a warning in the sync pill that
  // the user still needs to read; the unconditional "Synced" at the end of a normal load
  // would overwrite it almost immediately and make a rejected save look like a clean one.
  async function loadData(isManualReload, keepStatus) {
    // Both the opening 'loading' and the closing 'loaded' are suppressed under keepStatus —
    // either one on its own would still stomp the conflict warning the caller just set.
    if (!keepStatus) setSyncStatus('loading');
    try {
      const res = await apiFetch('api=data');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const doc = await res.json();
      if (!doc || !Array.isArray(doc.tasks)) throw new Error('Unexpected response shape');
      TASKS = doc.tasks;
      tsgNormalizeTaskDates_(TASKS);
      RAW_META = doc.meta || {};
      TEAM_ROSTER = normalizeRoster(RAW_META.teamRoster);
      META.created = doc.meta && doc.meta.created;
      META.lastUpdated = (doc.meta && doc.meta.last_updated) || META.lastUpdated;
      nextId = (doc.meta && doc.meta.next_id) || (TASKS.length ? Math.max(...TASKS.map(t => t.id)) + 1 : 1);
      ERRANDS = (doc.meta && doc.meta.errands) || {};
      STANDING_ITEMS = (doc.meta && doc.meta.standingItems) || [];
      dataLoaded = true;
      document.getElementById('updatedStamp').textContent = 'Last updated ' + formatDate(META.lastUpdated);
      renderAll();
      if (!keepStatus) setSyncStatus('loaded');
      syncFubRoster(true); // best-effort, silent — never blocks the page on FUB being slow/down
    } catch (err) {
      if (!dataLoaded) {
        // keep the built-in fallback seed so the page isn't blank
        renderAll();
      }
      lastFailedOp = 'load';
      setSyncStatus('error', err.message || err);
      if (isManualReload) alert('Reload failed: ' + (err.message || err));
    }
  }

  // ---- FUB team roster sync (2026-09-01) ----
  // Pulls Follow Up Boss's user list into TEAM_ROSTER so the Owner/Delegate dropdowns and the
  // meeting-picker's "invite delegate" default use real emails instead of a guessed
  // firstname@thestawaszgroup.com pattern. Runs silently once after every load — never
  // surfaces an error to the user unless they clicked the manual "Sync from FUB" button
  // (silent=false), since a FUB hiccup shouldn't interrupt normal tracker use.
  //
  // Linking (first time a name/email is seen): by email, then case-insensitive name. Once
  // linked, an entry gets `fubId` and source:'fub' — from then on that id is the sole key used
  // to track that person, since names and emails both change but the id doesn't. A rename in
  // FUB propagates to every task/subitem that has them assigned (reassignNameEverywhere_),
  // not just the roster label.
  //
  // Removal (2026-09-01, per Durand): someone previously linked via a real fubId who no longer
  // appears in FUB is treated as a termination signal — removed from the roster picker AND
  // flagged with a Critical task pointing at the real offboarding SOPs (flagDelegateOffboarded_
  // below). This ONLY applies to entries with a confirmed fubId — a tracker-only delegate
  // (source:'tracker') or a legacy entry never actually matched to FUB was never "in FUB" to
  // begin with, so their absence means nothing and they're never touched by this. It's also
  // guarded against a bad fetch: if FUB returns suspiciously few people relative to how many
  // are currently linked, removal-detection is skipped entirely for that run (updates/adds
  // above still happen — that side is safe even against a partial response) rather than risk
  // flagging half the team as terminated because of an API hiccup.
  async function syncFubRoster(silent) {
    try {
      const res = await apiFetch('api=fubUsers');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || data.ok === false) throw new Error((data && data.error) || 'FUB sync failed');
      const fubUsers = Array.isArray(data.users) ? data.users : [];
      let changed = false;
      const seenFubIds = new Set();

      fubUsers.forEach(function(u) {
        if (!u.name || !u.email) return;

        if (u.id != null) p = TEAM_ROSTER.find(function(r) { return r.fubId != null && String(r.fubId) === String(u.id); });

      alert('Could not save to Drive: ' + (err.message || err));
    }
  }

  (function initTheme() {
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    var btn = document.getElementById('themeToggle');
    if (btn) btn.innerHTML = prefersDark ? '&#9728;&#65039;' : '&#127769;';
  })();
  document.getElementById('themeToggle').addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    this.innerHTML = isDark ? '&#127769;' : '&#9728;&#65039;';
  });

  // Don't paint the fallback seed data as the first thing the user sees (2026-09-03,
  // per Durand) — it used to render immediately with old placeholder numbers, then jump
  // to the real counts a moment later once loadData() finished, which read as the app
  // flickering/misbehaving even when nothing was actually wrong. The seed data is a
  // last-resort fallback for when the live fetch genuinely fails (see loadData()'s catch
  // block below) — it should never be the first paint on a normal, successful load.
  // Everything here (stats/board/alert banner) is empty by default in the raw HTML, so
  // simply not calling renderAll() yet already gives a blank page; the loading message
  // and pill state below just make it clear that's what's happening, not a broken page.
  document.getElementById('board').innerHTML = '<div class="today-side-empty" style="padding:48px 0;text-align:center;">Loading your tasks…</div>';
  setSyncStatus('loading');
  renderVersionStamp();
  loadData();
  loadCalendar();

  // Background sync (2026-09-14). The page used to load once and never look again, so a
  // change made anywhere else (an _Inbox patch from Claude, another person's edit) was
  // invisible until a manual reload and could only surface as a save conflict. Now every
  // POLL_MS, and whenever the tab regains focus, ask ?api=version for the document's
  // docVersion and reload the data when it has moved past what this page loaded. Never
  // while a save is pending (that would race the save), and never while a task card is
  // open (the reload is deferred until closeTaskCard). Foundation for the per-person
  // mini-trackers, which edit the same document concurrently.
  const POLL_MS = 45000;
  let remoteChangePending = false;
  let pollInFlight = false;
  async function pollForRemoteChanges() {
    if (pollInFlight || document.hidden || !dataLoaded) return;
    if (saveTimer || pendingSaveId != null) return; // local edits in flight — they win, then the response carries the new docVersion
    pollInFlight = true;
    try {
      const res = await apiFetch('api=version');
      if (!res.ok) return;
      const v = await res.json();
      const remote = v && typeof v.docVersion === 'number' ? v.docVersion : null;
      const local = RAW_META && typeof RAW_META.docVersion === 'number' ? RAW_META.docVersion : null;
      if (remote == null || local == null || remote <= local) return;
      if (currentModalTaskId != null) { remoteChangePending = true; return; }
      await loadData(false, true);
      setSyncStatus('loaded');
    } catch (err) {
      // Polling is best-effort — a failed probe is not a connection problem worth alarming about.
    } finally {
      pollInFlight = false;
    }
  }
  setInterval(pollForRemoteChanges, POLL_MS);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) pollForRemoteChanges(); });
</script>
</body>
</html>
