<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSG Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --brand:        #15464A;
    --brand-print:  #004225;
    --surface-1:    #fcfcfb;
    --surface-2:    #f4f5f4;
    --page-plane:   #f9f9f7;
    --text-primary: #0b1211;
    --text-secondary: #52514e;
    --text-muted:   #898781;
    --gridline:     #e1e0d9;
    --border:       rgba(11,11,11,0.10);
    --gray-accent:  #d9dbd9;

    --status-good:     #0c7a0c;
    --status-good-bg:  #e6f6e6;
    --status-critical:     #d03b3b;
    --status-critical-bg:  #fbe9e9;
    --status-neutral:      #6b6f72;
    --status-neutral-bg:   #eef0ef;
    --status-active:       var(--brand);
    --status-active-bg:    #e3ecec;
    --status-blocked:      #b5541c;
    --status-blocked-bg:   #fbeee3;
    --status-warn:         #96700a;
    --status-warn-bg:      #fdf1d6;
    --gold-border:         #b8860b;
    --gold-bg:             #fdf6e3;
    --gold-text:           #7a5b00;
    --pill-muted-text:     #6f6d67;
  }
  /* Dark-mode foreground tokens (--brand and the five --status-* text colors) are
     redefined here alongside their -bg companions below. Previously only the -bg half
     of each pair was redefined for dark mode, so dark-mode surfaces silently reused
     light-mode-tuned foreground colors — e.g. the brand-teal "In Progress" pill text
     against its dark-teal background came out at ~1.3:1 contrast, effectively invisible.
     Every value here was checked against every background it actually renders on and
     targets WCAG AA (>=4.5:1) for small badge/pill text. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --brand:        #4fb8ac;
      --surface-1:    #16201f;
      --surface-2:    #1c2726;
      --page-plane:   #0d1211;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:   #898781;
      --gridline:     #2c3231;
      --border:       rgba(255,255,255,0.12);
      --gray-accent:  #33403e;
      --status-good:     #3ddc84;
      --status-good-bg:  #10321a;
      --status-critical:     #ff7a7a;
      --status-critical-bg:  #3a1e1e;
      --status-neutral:      #b7bcbe;
      --status-neutral-bg:   #232928;
      --status-active-bg:    #1c3436;
      --status-blocked:      #f0a35f;
      --status-blocked-bg:   #3a2510;
      --status-warn:         #ffd23f;
      --status-warn-bg:      #3a2f0d;
      --gold-border:         #d4af37;
      --gold-bg:             #3a300f;
      --gold-text:           #f0cf6a;
      --pill-muted-text:     #a8a6a0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand:        #4fb8ac;
    --surface-1:    #16201f;
    --surface-2:    #1c2726;
    --page-plane:   #0d1211;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:   #898781;
    --gridline:     #2c3231;
    --border:       rgba(255,255,255,0.12);
    --gray-accent:  #33403e;
    --status-good:     #3ddc84;
    --status-good-bg:  #10321a;
    --status-critical:     #ff7a7a;
    --status-critical-bg:  #3a1e1e;
    --status-neutral:      #b7bcbe;
    --status-neutral-bg:   #232928;
    --status-active-bg:    #1c3436;
    --status-blocked:      #f0a35f;
    --status-blocked-bg:   #3a2510;
    --status-warn:         #ffd23f;
    --status-warn-bg:      #3a2f0d;
    --gold-border:         #d4af37;
    --gold-bg:             #3a300f;
    --gold-text:           #f0cf6a;
    --pill-muted-text:     #a8a6a0;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: 'Lato', system-ui, -apple-system, sans-serif;
    /* 2026-09-14, per Durand: the page-wide `zoom: 0.71` added 2026-09-09 is gone — the
       page renders at the browser's native 100% again. Do not reintroduce a body-level
       zoom/scale here; if a denser layout is wanted, do it in the layout itself. */
  }
  .wrap { width: 90%; max-width: 1800px; margin: 0 auto; padding: 32px 0 64px; }

  header.masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--brand);
    padding-bottom: 14px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }
  header.masthead .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo { height: 30px; width: auto; display: block; }
  .brand-logo.logo-dark { display: none; }
  :root[data-theme="dark"] .brand-logo.logo-light { display: none; }
  :root[data-theme="dark"] .brand-logo.logo-dark { display: block; }
  header.masthead .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--brand);
  }
  header.masthead .masthead-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header.masthead .sub {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    border-radius: 999px;
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .theme-toggle:hover { background: var(--surface-2); }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 20px;
  }

  .editnotice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--status-blocked-bg);
    border: 1px solid rgba(181,84,28,0.35);
    color: var(--text-primary);
    border-radius: 9px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .editnotice b { color: var(--status-blocked); }
  .editnotice.ok { background: var(--status-good-bg); border-color: rgba(12,163,12,0.3); }
  .editnotice.ok b { color: var(--status-good); }
  .editnotice.error { background: var(--status-critical-bg); border-color: rgba(208,59,59,0.3); }
  .editnotice.error b { color: var(--status-critical); }

  .sync-pill { display: inline-flex; align-items: center; cursor: default; flex: none; }
  .sync-pill .cap-body {
    fill: var(--status-good);
    stroke: rgba(0,0,0,0.18);
    stroke-width: 1;
    transition: fill 0.2s ease;
  }
  .sync-pill.bad .cap-body { fill: var(--status-critical); }
  .sync-pill.warn .cap-body { fill: var(--status-warn); }
  .sync-pill .cap-seam { stroke: rgba(255,255,255,0.6); stroke-width: 1.5; }
  .sync-pill .cap-shine { fill: rgba(255,255,255,0.38); }
  /* 2026-09-03: color alone now carries loading/saving vs. error vs. synced (red/amber/
     green) — an opacity dim on top of the still-green fill used to make "saving" and
     "actively loading" look like a washed-out version of "synced", which read as broken
     rather than in-progress. */

  /* ---- Connection-lost overlay (2026-09-03, per Durand) ----
     Red pill (no confirmed connection — including the very first "haven't loaded yet"
     moment, which reads as untrusted until proven otherwise) now means something happened
     beyond the little header pill: everything behind it is disabled and greyed out, and a
     modal explains what's going on, until the connection is confirmed good again. Two
     variants share the same markup: a spinner while auto-retrying ("Connecting…" the very
     first time, "Reconnecting…" after a previously-good connection drops), and an error
     icon with instructions once retries have been exhausted and this needs a person to
     act (reload, export a backup, check the network). */
  .conn-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(10,14,13,0.6); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .conn-overlay[hidden] { display: none; }
  .conn-card { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 16px; padding: 32px 30px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .conn-icon { width: 44px; height: 44px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; }
  .conn-spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--status-warn-bg); border-top-color: var(--status-warn); animation: conn-spin 0.85s linear infinite; }
  @keyframes conn-spin { to { transform: rotate(360deg); } }
  .conn-card h2 { margin: 0 0 8px; font-size: 1.2rem; font-weight: 700; }
  .conn-card p { margin: 0 0 20px; color: var(--text-secondary); font-size: 0.93rem; line-height: 1.5; }
  .conn-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  body.conn-blocking > *:not(.conn-overlay) { filter: grayscale(0.65) brightness(0.9); pointer-events: none; user-select: none; }

  /* Stat tiles */
  .stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 16px 14px;
  }
  .stat-tile .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .stat-tile .value {
    font-family: 'Lato', sans-serif;
    font-weight: 900;
    font-size: 30px;
    font-variant-numeric: proportional-nums;
    line-height: 1;
  }
  .stat-tile.overdue .value { color: var(--status-critical); }
  .stat-tile.done .value { color: var(--status-good); }
  .stat-tile.clickable { cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .stat-tile.clickable:hover { border-color: var(--accent, var(--text-secondary)); background: var(--surface-2); }

  #alertBanner { display: flex; flex-direction: column; gap: 6px; margin: -8px 0 20px; }
  .alert-row {
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;
    padding: 9px 14px; border-radius: 8px; cursor: pointer;
  }
  .alert-row.critical { background: var(--status-critical-bg); color: var(--status-critical); }
  .alert-row.warn { background: var(--status-blocked-bg); color: var(--status-blocked); }
  .alert-row:hover { opacity: 0.85; }
  .alert-icon { font-size: 13px; }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 2px; }
  .toolbar select, .toolbar input[type="text"] {
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
  }
  .toolbar .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
  }
  .btn {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn.primary:hover { opacity: 0.92; }
  .btn.small { padding: 3px 9px; font-size: 11px; }
  .btn.danger { color: var(--status-critical); }

  /* Groups / board */
  .group-section {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    background: var(--surface-2);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--gridline);
  }
  .group-head .caret { font-size: 11px; color: var(--text-muted); width: 12px; }
  .group-head .gname { font-weight: 900; font-size: 13.5px; }
  .group-head .gcount { font-size: 11.5px; color: var(--text-muted); margin-left: 2px; }
  .group-head .gadd { margin-left: auto; }
  .group-section.collapsed .group-body { display: none; }
  /* 10-column task table needs its own horizontal scroll on narrow screens,
     otherwise the columns crush and the whole page scrolls sideways. */
  .group-body { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 700;
    padding: 8px 10px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }
  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--gridline);
    vertical-align: top;
    color: var(--text-primary);
  }
  tbody tr.task-row:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  td.title-cell { font-weight: 700; min-width: 190px; }
  td.title-cell .ttl-edit { cursor: text; }
  td.title-cell .ttl-edit:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
  td.notes-cell { color: var(--text-secondary); min-width: 260px; cursor: text; }
  td.notes-cell:hover { background: var(--surface-2); }
  td.due-cell.overdue { color: var(--status-critical); font-weight: 700; }
  td.tags-cell { max-width: 140px; }
  td.owner-cell { white-space: nowrap; }
  td.cell-group { max-width: 190px; }
  .cell-group-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .cell-group-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cell-group-row .due-input { width: 122px; }
  .cell-group-row .progress-wrap { min-width: 90px; }
  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    color: #fff;
    font-size: 9.5px;
    font-weight: 800;
    flex: none;
    margin-right: 6px;
    vertical-align: middle;
    letter-spacing: 0;
  }
  .avatar.lg { width: 36px; height: 36px; font-size: 13px; margin-right: 8px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    border: none;
    font-family: 'Lato', sans-serif;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  .pill.status-not-started { background: var(--status-neutral-bg); color: var(--status-neutral); }
  .pill.status-not-started .dot { background: var(--status-neutral); }
  .pill.status-in-progress { background: var(--status-active-bg); color: var(--brand); }
  .pill.status-in-progress .dot { background: var(--brand); }
  .pill.status-blocked { background: var(--status-blocked-bg); color: var(--status-blocked); }
  .pill.status-blocked .dot { background: var(--status-blocked); }
  .pill.status-waiting { background: var(--status-critical-bg); color: var(--status-critical); }
  .pill.status-waiting .dot { background: var(--status-critical); }
  .pill.status-done { background: var(--status-good-bg); color: var(--status-good); }
  .pill.status-done .dot { background: var(--status-good); }
  /* Same five status colors as the pills above, as solid fills for the segmented
     "status battery" bar (renderStats' progressBattery, and group-header mini bars). */
  .battery-seg.status-not-started, .battery-legend .dot.status-not-started { background: var(--status-neutral); }
  .battery-seg.status-in-progress, .battery-legend .dot.status-in-progress { background: var(--brand); }
  .battery-seg.status-blocked, .battery-legend .dot.status-blocked { background: var(--status-blocked); }
  .battery-seg.status-waiting, .battery-legend .dot.status-waiting { background: var(--status-critical); }
  .battery-seg.status-done, .battery-legend .dot.status-done { background: var(--status-good); }
  .progress-battery-wrap { margin: -6px 0 16px; }
  .status-battery {
    display: flex; height: 10px; border-radius: 6px; overflow: hidden;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .battery-seg { height: 100%; transition: width 0.3s ease; }
  .battery-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; color: var(--text-secondary); align-items: center; }
  .battery-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .battery-legend .battery-pct { margin-left: auto; font-weight: 700; color: var(--text-primary); }
  .group-battery-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 60px; max-width: 140px; }
  .group-battery-wrap .status-battery { flex: 1; height: 6px; }
  .group-battery-pct { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .pill.priority-critical { background: var(--status-critical-bg); color: var(--status-critical); }
  .pill.priority-critical .dot { background: var(--status-critical); }
  .pill.priority-high { background: rgba(208,59,59,0.14); color: var(--status-critical); }
  .pill.priority-high .dot { background: rgba(208,59,59,0.65); }
  .pill.priority-medium { background: var(--status-neutral-bg); color: var(--text-secondary); }
  .pill.priority-medium .dot { background: var(--text-muted); }
  .pill.priority-low { background: var(--status-neutral-bg); color: var(--pill-muted-text); }
  .pill.priority-low .dot { background: var(--gray-accent); }

  .tag-chip {
    display: inline-block;
    background: var(--gray-accent);
    color: var(--text-secondary);
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 10.5px;
    font-weight: 700;
    margin: 0 3px 3px 0;
  }
  .tag-chip.tag-warn { background: var(--status-blocked-bg); color: var(--status-blocked); }
  .tag-chip.tag-active { background: var(--status-active-bg); color: var(--brand); }
  .tag-chip.tag-good { background: var(--status-good-bg); color: var(--status-good); }
  .btn.toggle-active { background: var(--status-blocked-bg); color: var(--status-blocked); border-color: rgba(181,84,28,0.35); }

  /* ---- Due-date / 6-month bonus-deadline countdowns (2026-09-03, per Durand) ---- */
  .bonus-countdown-wrap { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
  .bonus-chip { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
  .bonus-chip-due { background: var(--status-active-bg); color: var(--brand); }
  .bonus-chip-neutral { background: var(--status-neutral-bg); color: var(--status-neutral); }
  /* The "final week" alert — always-on red highlight (not hover-triggered) with the exact
     deadline date set off in its own gold-bordered box so the date itself is unmissable. */
  .bonus-alert {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--status-critical-bg); color: var(--status-critical);
    font-size: 10.5px; font-weight: 800; padding: 2px 8px 2px 7px; border-radius: 999px;
    white-space: nowrap;
  }
  .bonus-alert-compact { font-size: 10px; padding: 1px 6px; }
  .bonus-date-box {
    background: var(--gold-bg); color: var(--gold-text);
    border: 2px solid var(--gold-border); border-radius: 6px;
    padding: 0 6px; font-weight: 800; letter-spacing: 0.2px;
  }
  /* The "final month" highlight — one tier down from the final-week alert, same always-on
     treatment (not hover-triggered) in orange instead of red/gold (2026-09-03, per
     Durand: "the month before it should get an orange highlight"). Reuses the existing
     Blocked-status orange tokens rather than inventing a new hue. */
  .bonus-warn {
    display: inline-flex; align-items: center;
    background: var(--status-blocked-bg); color: var(--status-blocked);
    font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  .bonus-warn-compact { font-size: 10px; padding: 1px 6px; }
  /* Timeline / Workload mini-gantt bars are too narrow for chip text — same red+gold
     (final week) or orange (final month) treatment applied to the bar itself instead, via
     a class rather than inline content. */
  .timeline-bar.bonus-alert-bar, .wg-mini-bar.bonus-alert-bar {
    border: 2px solid var(--gold-border) !important;
    box-shadow: 0 0 0 2px var(--status-critical) inset, 0 0 6px rgba(208,59,59,0.6);
  }
  .timeline-bar.bonus-warn-bar, .wg-mini-bar.bonus-warn-bar {
    border: 2px solid var(--status-blocked) !important;
    box-shadow: 0 0 0 2px var(--status-blocked) inset;
  }

  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--surface-2);
    margin: 0 3px 3px 0;
  }
  .type-badge.type-email { color: var(--brand); border-color: rgba(21,70,74,0.3); }
  .type-badge.type-chat  { color: var(--brand); border-color: rgba(21,70,74,0.3); }
  .type-badge.type-call  { color: var(--brand); border-color: rgba(21,70,74,0.3); }
  .type-badge.type-text  { color: var(--brand); border-color: rgba(21,70,74,0.3); }
  .type-badge.type-schedule-task { color: var(--brand); border-color: rgba(21,70,74,0.3); }
  .type-badge.type-actionable-task { color: var(--text-muted); }
  .type-badge.type-meeting { color: var(--brand); border-color: rgba(21,70,74,0.3); }

  .progress-track {
    width: 70px;
    height: 6px;
    border-radius: 4px;
    background: var(--gray-accent);
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--brand); }
  .progress-wrap { display: flex; align-items: center; gap: 6px; }
  .progress-wrap .pct { font-size: 10.5px; color: var(--text-muted); font-weight: 700; min-width: 26px; }

  .due-input, .text-input {
    font-family: 'Lato', sans-serif;
    font-size: 12.5px;
    padding: 3px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    width: 100%;
  }

  .row-actions { display: flex; gap: 4px; white-space: nowrap; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 5px;
  }
  .icon-btn svg { display: block; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .icon-btn.danger:hover { color: var(--status-critical); }

  .sub-row td { padding: 0 10px 10px 34px; border-bottom: 1px solid var(--gridline); background: var(--surface-2); }
  .sub-list { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 2px; }
  /* Subtasks are the delegation unit, so each one gets card-level weight: a checkbox,
     an editable title with its own delete action, then a meta row (delegate, status,
     priority, due, estimate) and an optional notes line — the same information a
     top-level task row shows, just without an owner (accountability stays on the parent). */
  .sub-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--surface-1);
    border: 1px solid var(--border);
  }
  .sub-item input[type="checkbox"] { accent-color: var(--brand); margin-top: 3px; flex: none; }
  .sub-drag-handle {
    flex: none; cursor: grab; color: var(--text-muted); font-size: 13px; line-height: 1;
    padding: 2px 2px; margin-top: 2px; user-select: none; letter-spacing: -2px;
    opacity: 0; transition: opacity .1s;
  }
  .sub-item:hover .sub-drag-handle, .sub-drag-handle:focus { opacity: 1; }
  .sub-drag-handle:active { cursor: grabbing; }
  .sub-item.dragging { opacity: 0.4; }
  .sub-item.drag-over { border-color: var(--brand); box-shadow: inset 0 2px 0 var(--brand); }
  .sub-item.done { opacity: 0.68; }
  .sub-item.done .sub-title-edit { text-decoration: line-through; color: var(--text-muted); }
  .sub-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .sub-item-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .sub-title-edit { font-weight: 700; font-size: 12.5px; flex: 1; outline: none; }
  .sub-item-title-row .icon-btn { opacity: 0; transition: opacity .1s; }
  .sub-item:hover .icon-btn, .sub-item .icon-btn:focus { opacity: 1; }
  .sub-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--text-secondary); }
  .sub-meta b { color: var(--text-primary); }
  .sub-meta .avatar { width: 18px; height: 18px; font-size: 8px; margin-right: 4px; }
  .sub-meta .pill { font-size: 10px; padding: 2px 7px; }
  .sub-meta .due-input { width: 118px; font-size: 11px; padding: 2px 5px; }
  .sub-hours-input { width: 52px !important; text-align: right; }
  .sub-delegate { display: inline-flex; align-items: center; }
  /* Owner/Delegate dropdowns — look like plain text until hovered/focused, so they read
     the same as the contenteditable fields around them rather than as a form control. */
  .person-select {
    font: inherit; color: inherit; background: transparent; border: none;
    border-bottom: 1px dashed transparent; outline: none; cursor: pointer;
    padding: 0 2px 1px 0; appearance: none; -webkit-appearance: none;
  }
  .person-select:hover, .person-select:focus { border-bottom-color: var(--border); }
  /* The closed <select> inherits the page's dark/light styling fine (background:
     transparent, color: inherit above), but the OPEN dropdown list is a browser-native
     popup that does NOT inherit those — without this, it renders with the OS default
     (white background, dark text) regardless of theme, which in dark mode meant white
     text-on-white, unreadable (2026-09-03, per Durand: "can't read the names here").
     Applies to every <select> on the page, not just person-select, since none of them
     were covering this. */
  select option { background: var(--surface-1); color: var(--text-primary); }
  .sub-person-select { font-size: inherit; }
  .sub-due.overdue input { color: var(--status-critical); border-color: rgba(208,59,59,0.4); }
  .sub-item-notes { font-size: 11px; color: var(--text-muted); font-style: italic; outline: none; min-height: 14px; }
  .sub-item-notes:empty:before, .sub-item-notes-empty:before { content: attr(data-placeholder); color: var(--text-muted); opacity: 0.55; }
  .sub-item-notes:focus { font-style: normal; color: var(--text-secondary); }
  .sub-count-badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--gray-accent);
    border-radius: 999px;
    padding: 1px 7px;
    vertical-align: middle;
  }
  .add-sub-row { display: flex; gap: 6px; margin-top: 6px; }
  .add-sub-row input { flex: 1; }

  /* Add task form */
  .add-form {
    display: none;
    background: var(--surface-2);
    border-top: 1px solid var(--gridline);
    padding: 12px 14px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-form.open { display: flex; }
  .add-form input, .add-form select {
    font-family: 'Lato', sans-serif;
    font-size: 12.5px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
  }
  .add-form input[name="title"] { flex: 2; min-width: 180px; }
  .add-form input[name="notes"] { flex: 2; min-width: 180px; }

  .empty-state {
    padding: 48px 24px;
    text-align: center;
  }
  .empty-state p { color: var(--text-secondary); font-size: 13.5px; }

  /* Task detail modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal-nav-btn {
    flex: none;
    align-self: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin: 0 14px;
    transition: background 0.12s, opacity 0.12s, transform 0.12s;
  }
  .modal-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.22); transform: scale(1.06); }
  .modal-nav-btn:active:not(:disabled) { transform: scale(0.96); }
  .modal-nav-btn:disabled { opacity: 0; pointer-events: none; }
  .modal-nav-pos {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-right: 2px;
  }
  @media (max-width: 900px) {
    .modal-nav-btn { display: none; }
  }
  .modal-card {
    background: var(--surface-1);
    border-radius: 12px;
    border: 1px solid var(--border);
    width: 80%;
    max-width: 1440px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px 22px 24px;
  }
  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .modal-header h2 { flex: 1; min-width: 0; }
  .modal-header-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .modal-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    margin: 0;
    color: var(--text-primary);
  }
  .modal-meta { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .modal-row { display: flex; gap: 10px; font-size: 13px; }
  .modal-row b { color: var(--text-muted); font-weight: 700; min-width: 90px; flex: none; }
  .modal-row span { color: var(--text-primary); }
  .modal-section { margin-top: 18px; }
  .modal-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 8px;
  }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
  .history-entry {
    display: flex;
    gap: 10px;
    font-size: 12.5px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gridline);
  }
  .history-entry:last-child { border-bottom: none; padding-bottom: 0; }
  .hist-time { color: var(--text-muted); white-space: nowrap; flex: none; min-width: 108px; }
  .hist-desc { color: var(--text-primary); }
  .history-empty { color: var(--text-muted); font-size: 12.5px; }

  /* Settings modal (Rulesets + Threads) */

  .settings-tabs {
    display: flex; gap: 4px; border-bottom: 1px solid var(--gridline); margin-bottom: 16px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .settings-tabs::-webkit-scrollbar { display: none; }
  .settings-tab {
    font-family: 'Lato', sans-serif; font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 8px 4px; margin-right: 14px; border: none; background: none; color: var(--text-muted); cursor: pointer;
    border-bottom: 2px solid transparent;
    flex: 0 0 auto; white-space: nowrap; touch-action: manipulation;
  }
  .settings-tab:hover { color: var(--text-primary); }
  .settings-tab.active { color: var(--brand); border-bottom-color: var(--brand); }
  .settings-body { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
  .ruleset-block, .thread-block {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .ruleset-block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .ruleset-block-head h3 { font-family: 'Playfair Display', serif; font-size: 16px; margin: 0; color: var(--text-primary); }
  .ruleset-pushed { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .ruleset-content {
    white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px;
    margin-bottom: 8px; cursor: text; min-height: 20px;
  }
  .ruleset-content:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .thread-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 10px 0 6px; }
  .memory-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .memory-chip {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 12.5px;
  }
  .memory-chip .modal-edit { flex: 1; }
  .ruleset-changelog-toggle {
    font-size: 11.5px; font-weight: 700; color: var(--text-muted); cursor: pointer; margin-top: 10px; user-select: none;
  }
  .ruleset-changelog-toggle:hover { color: var(--text-primary); }
  .ruleset-changelog { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--gridline); }
  .ruleset-changelog.open { display: flex; }

  .modal-row { align-items: center; }
  .modal-row-notes { align-items: flex-start; }
  .modal-row-reestimate { margin-top: -4px; }
  .modal-row-reestimate button { font-size: 11.5px; }
  .modal-edit { cursor: text; border-radius: 5px; padding: 2px 5px; margin: -2px -5px; }
  .modal-edit:hover { background: var(--surface-2); }
  .modal-edit:empty:before { content: attr(data-placeholder); color: var(--text-muted); opacity: 0.6; }
  .modal-notes { display: block; min-height: 40px; white-space: pre-wrap; flex: 1; }
  .modal-owner-wrap { display: flex; align-items: center; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .modal-source { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
  .doc-link-text { color: var(--brand); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
  .doc-link-text:hover { text-decoration: underline; }
  .modal-empty { color: var(--text-muted); font-style: italic; font-size: 12.5px; }
  /* Source-link icon on rows/cards — small, quiet, doesn't compete with the title. */
  .doc-link { text-decoration: none; opacity: 0.65; font-size: 12px; margin-left: 2px; }
  .doc-link:hover { opacity: 1; }
  .modal-tag-chip { display: inline-flex; align-items: center; gap: 5px; }
  .modal-tag-chip .rm { cursor: pointer; opacity: 0.65; font-size: 9px; }
  .modal-tag-chip .rm:hover { opacity: 1; }
  .doc-chip {
    display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2);
    border-radius: 6px; padding: 3px 7px; font-size: 12px; max-width: 260px;
  }
  .doc-chip a { color: var(--text-primary); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-chip a:hover { text-decoration: underline; }
  .doc-chip .rm { cursor: pointer; opacity: 0.55; font-size: 9px; flex: none; }
  .doc-chip .rm:hover { opacity: 1; }
  .sub-docs-row { flex-wrap: wrap; gap: 5px; }
  .sub-type-select { font-size: 11px; }
  .modal-card.meeting-card { width: 420px; max-width: 92vw; max-height: 80vh; }
  .meeting-window-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .meeting-window-row span { color: var(--text-muted); font-size: 12px; }
  .meeting-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .meeting-row {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
  }
  .meeting-row:hover { background: var(--surface-2); }
  .meeting-row-guess { border-color: var(--brand); }
  .meeting-row-main { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .meeting-row-sub { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }
  .meeting-guess-badge, .meeting-agenda-badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 1px 6px; border-radius: 10px; background: var(--brand); color: #fff;
  }
  .meeting-agenda-badge { background: var(--surface-3, var(--surface-2)); color: var(--text-muted); }
  .meeting-modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .meeting-form { display: flex; flex-direction: column; gap: 10px; }
  .meeting-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
  .meeting-form input, .meeting-form textarea { font-size: 13px; color: var(--text-primary); }
  .meeting-form-row { display: flex; gap: 10px; }
  .meeting-form-row label { flex: 1; }
  .meeting-form-guest { flex-direction: row !important; align-items: center; gap: 7px !important; flex-wrap: wrap; }
  .meeting-form-guest input[type="email"] { flex: 1; min-width: 160px; }
  .meeting-form-hint { font-size: 11px; color: var(--text-muted); font-style: italic; margin-top: -4px; }
  #modalTitle { display: flex; }
  #modalTitle .modal-edit:hover { text-decoration: underline dotted; text-underline-offset: 3px; background: none; }
  .modal-row select.pill { font-size: 11.5px; }
  .modal-due { width: auto; }

  footer.tsg-footer {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid var(--gridline);
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    /* bigger tap targets on touch screens */
    .view-tab { padding: 12px 15px; font-size: 13.5px; }
    .settings-tab { padding: 12px 4px; font-size: 13px; }
    /* let the task table keep real column widths and scroll inside its group */
    .group-body table { min-width: 760px; }
    /* the add-task form stacks instead of overflowing */
    .add-form input[name="title"],
    .add-form input[name="notes"] { flex: 1 1 100%; min-width: 0; }
    /* 80% of a phone screen is a 290px card — use the width that's there */
    .modal-card { width: 94%; max-height: 92vh; padding: 16px 14px 20px; }
  }

  /* View tabs */
  .view-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--gridline);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .view-tabs::-webkit-scrollbar { display: none; }
  .view-tab {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    padding: 8px 14px;
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    flex: 0 0 auto;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .view-tab:hover { color: var(--text-primary); }
  .view-tab.active { color: var(--brand); border-bottom-color: var(--brand); }

  /* Kanban view */
  .kanban-wrap { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
  .kanban-col {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-width: 240px;
    flex: 1;
    max-width: 280px;
  }
  .kanban-col.drag-over { background: var(--surface-2); border-color: var(--brand); }
  .kanban-col-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--gridline);
    font-weight: 900;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kanban-col-head .cnt { color: var(--text-muted); font-weight: 700; }
  .kanban-col-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .kanban-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    cursor: grab;
    font-size: 12.5px;
  }
  .kanban-card:active { cursor: grabbing; }
  .kanban-card.dragging { opacity: 0.4; }
  .kanban-card .kc-title { font-weight: 700; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 6px; }
  .kanban-card .kc-title > span:first-child { flex: 1; min-width: 0; }
  .kc-delete, .tc-delete { flex: none; }
  .kanban-card .kc-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .kanban-card .kc-due { font-size: 11px; color: var(--text-muted); }
  .kanban-card .kc-due.overdue { color: var(--status-critical); font-weight: 700; }
  .saved-pill {
    flex: none; display: inline-flex; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 700; color: var(--status-good);
    background: var(--status-good-bg); border-radius: 999px; padding: 2px 7px;
    animation: savedFadeIn 0.2s ease-out;
  }
  @keyframes savedFadeIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  .tc-empty-field, .kc-empty-field {
    display: inline-block; padding: 2px 8px; border: 1px dashed var(--border);
    border-radius: 999px; font-size: 11px; color: var(--text-muted);
  }
  .tc-est { font-size: 11px; color: var(--text-muted); }
  .kc-delegates { font-size: 11px; color: var(--text-secondary); justify-content: flex-start !important; }

  /* Card view */
  .card-group { margin-bottom: 22px; }
  .card-group-title { font-weight: 900; font-size: 13.5px; margin-bottom: 10px; }
  .card-group-title.clickable { cursor: pointer; user-select: none; }
  .card-group-title.clickable .caret { font-size: 11px; color: var(--text-muted); display: inline-block; width: 12px; }
  .card-group.collapsed .card-grid { display: none; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .task-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 13px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task-card:hover { background: var(--surface-2); }
  .task-card .tc-title { font-weight: 700; font-size: 13px; display: flex; align-items: flex-start; gap: 6px; }
  .task-card .tc-title > span:first-child { flex: 1; min-width: 0; }
  .task-card .tc-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .task-card .tc-due { font-size: 11px; color: var(--text-muted); margin-left: auto; }
  .task-card .tc-due.overdue { color: var(--status-critical); font-weight: 700; }
  .tc-delegates { font-size: 11px; color: var(--text-secondary); }

  /* Zoom bar (Timeline + Workload) */
  .zoom-bar { display: flex; gap: 4px; margin-bottom: 12px; }
  .workload-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .workload-toolbar .zoom-bar { margin-bottom: 0; }
  #applySchedRuleBtn { margin-bottom: 12px; }
  .zoom-btn {
    font-family: 'Lato', sans-serif; font-weight: 700; font-size: 11px; padding: 5px 11px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 6px; cursor: pointer;
  }
  .zoom-btn:hover { background: var(--surface-2); }
  .zoom-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }

  /* Timeline view */
  .timeline-wrap { overflow-x: auto; }
  .timeline-header { display: flex; border-bottom: 1px solid var(--gridline); margin-left: 200px; }
  .timeline-header .tl-col { flex: none; font-size: 10.5px; color: var(--text-muted); text-align: center; padding: 4px 0; border-left: 1px solid var(--gridline); }
  .timeline-rows { position: relative; }
  .timeline-row { display: flex; align-items: center; border-bottom: 1px solid var(--gridline); min-height: 34px; }
  .timeline-row .tl-label { width: 200px; flex: none; font-size: 12px; padding: 6px 10px 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .timeline-row .tl-label:hover { text-decoration: underline; }
  .timeline-track { position: relative; flex: 1; height: 24px; }
  .timeline-bar {
    position: absolute;
    top: 3px;
    height: 18px;
    border-radius: 5px;
    cursor: grab;
    display: flex;
    align-items: center;
    padding: 0 6px;
    font-size: 10px;
    color: #fff;
    white-space: nowrap;
    user-select: none;
  }
  .timeline-bar:active { cursor: grabbing; }
  .timeline-bar .bar-label { pointer-events: none; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .timeline-bar.overdue { outline: 2px solid var(--status-critical); outline-offset: 1px; }
  .timeline-bar.done, .wg-mini-bar.done { opacity: 0.55; }
  .timeline-bar.done .bar-label { text-decoration: line-through; }
  .bar-handle-r { position: absolute; right: 0; top: 0; width: 6px; height: 100%; cursor: ew-resize; }
  .link-handle {
    position: absolute; right: -8px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
    border-radius: 50%; background: #fff; border: 2px solid var(--brand); cursor: crosshair;
    opacity: 0; transition: opacity 0.15s;
  }
  .timeline-bar:hover .link-handle { opacity: 1; }
  .timeline-link-svg { position: absolute; top: 0; left: 200px; pointer-events: none; overflow: visible; }
  .link-line { fill: none; stroke: var(--text-muted); stroke-width: 1.5; }
  .link-line.temp { stroke: var(--brand); stroke-dasharray: 4 3; }
  .link-arrowhead { fill: var(--text-muted); }
  body.dragging-bar, body.dragging-bar * { cursor: grabbing !important; }
  body.linking, body.linking * { cursor: crosshair !important; }
  .timeline-section-title { font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 14px 0 6px; }
  .timeline-section + .timeline-section { margin-top: 4px; }
  .timeline-section-head {
    display: flex; align-items: center; gap: 8px;
    min-height: 34px; padding: 0 10px;
    font-weight: 800; font-size: 12.5px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--gridline);
  }
  .timeline-bar-sub { cursor: pointer; opacity: 0.82; }
  .timeline-bar-sub:hover { opacity: 1; }
  .timeline-unscheduled-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; cursor: pointer; }
  .timeline-unscheduled-row:hover { text-decoration: underline; }

  /* Workload view */
  .workload-grid { overflow-x: auto; }
  .workload-grid table { border-collapse: collapse; width: 100%; }
  .workload-grid th, .workload-grid td { border: 1px solid var(--gridline); padding: 6px 9px; text-align: center; font-size: 11.5px; white-space: nowrap; }
  .workload-grid thead th { color: var(--text-muted); font-weight: 700; background: var(--surface-1); }
  .workload-grid .wg-daynum { font-weight: 900; font-size: 12.5px; color: var(--text-primary); }
  .workload-grid .wg-dow { color: var(--text-muted); font-weight: 400; font-size: 10px; text-transform: uppercase; }
  .workload-grid .wg-bucket-label { font-size: 10.5px; font-weight: 700; white-space: normal; }
  .workload-grid .wg-date-th { cursor: pointer; }
  .workload-grid .wg-date-th:hover { outline: 1px solid var(--brand); outline-offset: -1px; }
  .workload-grid th.wg-name-col, .workload-grid td.wg-name-cell {
    text-align: left; position: sticky; left: 0; background: var(--surface-1); z-index: 1;
    display: flex; align-items: center; gap: 8px; min-width: 150px; border-right: 1px solid var(--gridline);
    cursor: pointer;
  }
  .wg-caret { display: inline-block; width: 10px; font-size: 9px; color: var(--text-muted); flex: none; }
  .workload-cell { font-weight: 700; cursor: pointer; }
  .workload-cell:hover { outline: 1px solid var(--brand); outline-offset: -1px; }
  .workload-cell.wg-empty { color: var(--text-muted); font-weight: 400; }
  .workload-cell.wg-partial { background: var(--status-active-bg); color: var(--brand); }
  .workload-cell.wg-full { background: var(--status-good-bg); color: var(--status-good); }
  .workload-cell.wg-over { background: var(--status-critical-bg); color: var(--status-critical); }
  .workload-unscheduled-col { font-style: italic; color: var(--text-muted); font-weight: 400; }
  .wg-expand-row td { background: var(--surface-2); padding: 10px 14px; cursor: default; }
  .wg-mini-gantt { display: flex; flex-direction: column; gap: 6px; }
  .wg-mini-empty { font-size: 12px; color: var(--text-muted); }
  .wg-mini-row { display: flex; align-items: center; gap: 8px; }
  .wg-mini-label { width: 180px; flex: none; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .wg-mini-label:hover { text-decoration: underline; }
  .wg-mini-track { position: relative; height: 16px; flex: 1; }
  .wg-mini-bar { position: absolute; top: 0; height: 16px; border-radius: 4px; cursor: pointer; }
  .wg-mini-bar.overdue { outline: 2px solid var(--status-critical); outline-offset: 1px; }

  /* Day view modal */
  .dv-assignee { margin-bottom: 14px; }
  .dv-assignee-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .dv-total { margin-left: auto; font-size: 12px; color: var(--text-secondary); }
  .dv-total.over { color: var(--status-critical); font-weight: 900; }
  .dv-lines { display: flex; flex-direction: column; gap: 4px; padding-left: 30px; }
  .dv-line { font-size: 12px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; padding: 3px 6px; border-radius: 5px; }
  .dv-line:hover { background: var(--surface-2); }
  .dv-line-hours { color: var(--text-muted); flex: none; }
  .dv-admin, .dv-meeting { cursor: default; }
  .dv-admin:hover, .dv-meeting:hover { background: none; }

  /* Today view */
  .today-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .today-item { display: flex; gap: 14px; align-items: stretch; }
  .today-time { width: 130px; flex: none; font-size: 11.5px; color: var(--text-muted); font-weight: 700; padding-top: 10px; }
  .today-content { flex: 1; border-radius: 9px; padding: 10px 14px; border: 1px solid var(--border); background: var(--surface-1); }
  .today-title { font-weight: 700; font-size: 13px; }
  .today-item.type-admin .today-content { background: var(--gray-accent); border-color: transparent; }
  .today-item.type-lunch .today-content { background: var(--status-neutral-bg); border-color: transparent; }
  .today-item.type-calendar .today-content { border-left: 3px solid var(--brand); }
  .today-item.type-task .today-content { border-left: 3px solid var(--status-active); }
  .today-item.type-relief .today-content { background: var(--status-good-bg); border-color: transparent; }
  .today-item.type-errand .today-content { background: var(--status-blocked-bg); border-color: transparent; }
  .today-item.type-break .today-time { padding-top: 2px; }
  .today-item.type-break .today-content { padding: 4px 14px; background: none; border: none; color: var(--text-muted); font-size: 11px; font-style: italic; }
  /* Genuinely open time left after fixed items and the task queue have both had a shot at
     the day — distinct from a scheduled block, so it reads as available rather than booked. */
  .today-item.type-gap .today-content {
    background: none; border: 1px dashed var(--border); color: var(--text-muted); font-style: italic;
  }
  .today-item.type-gap .today-title { color: var(--text-muted); font-weight: 600; }
  .today-tasklist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .today-task-line { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; padding: 3px 5px; border-radius: 5px; }
  .today-task-line:hover { background: var(--surface-2); }
  .today-task-mins { margin-left: auto; color: var(--text-muted); flex: none; }
  /* Any block (except a bare "Open" gap) opens a bigger, more detailed popout on click —
     see openScheduleDetail. Inner affordances (task lines, admin lines) stop propagation
     so their own single-item click keeps working undisturbed. */
  .today-item.schedule-clickable { cursor: pointer; }
  .today-item.schedule-clickable .today-content:hover { border-color: var(--text-secondary); }
  .today-meeting-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .today-meeting-lead { padding: 1px 6px; border-radius: 999px; background: var(--surface-2); }
  .today-offsite-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .sched-detail-admin { display: flex; flex-direction: column; gap: 4px; }
  .sched-detail-meeting { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .sched-detail-row { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .sched-detail-row b { color: var(--text-muted); font-weight: 700; }
  .sched-detail-note { font-size: 12px; color: var(--text-muted); font-style: italic; }
  .today-admin-line { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 5px; border-radius: 5px; }
  .today-admin-line.clickable { cursor: pointer; }
  .today-admin-line.clickable:hover { background: var(--surface-2); }
  /* The marker tells you what clicking (or not clicking) actually does — a checkbox only
     appears where there's a single task to check off. A recurring Ops Manual duty isn't
     a trackable item at all (no click), and a rolled-up count opens a list, not one task —
     each gets its own glyph so the line doesn't promise an interaction it can't deliver. */
  .today-admin-line:before { content: '\2022'; color: var(--text-muted); flex: none; }
  .today-admin-line.kind-action:before { content: '\2610'; }
  .today-admin-line.kind-group:before { content: '\25B8'; }
  .today-admin-line.kind-info:before { content: '\21BB'; }
  .today-admin-line.kind-nav:before { content: '\2192'; }
  .today-admin-sub { margin-left: auto; color: var(--text-muted); flex: none; font-size: 11px; }
  .today-untimed, .today-unplaced { margin-top: 14px; font-size: 12px; color: var(--text-secondary); background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
  .today-layout { display: flex; flex-direction: column; gap: 24px; align-items: stretch; }
  .today-sides-row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .today-side { width: auto; flex: 1; min-width: 280px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); padding: 14px; }
  .today-side-head { font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 10px; }
  .today-side-list { display: flex; flex-direction: column; gap: 8px; }
  .today-side-row { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px; border-radius: 7px; }
  .today-side-row:hover { background: var(--surface-2); }
  .today-side-body { flex: 1; min-width: 0; }
  .today-side-title { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .today-side-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .today-side-meta .pill { font-size: 10px; }
  .today-side-due { font-size: 11px; font-weight: 700; color: var(--text-muted); flex: none; }
  /* The schedule, "didn't fit", and "due from others" modules each drill down into a
     bigger view of just their own items when the module itself (its header/background)
     is clicked — rows inside keep their own more specific click. */
  .today-schedule-container { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); padding: 14px; }
  .clickable-panel { cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .clickable-panel:hover { border-color: var(--text-secondary); }
  .clickable-panel:hover .today-side-head { color: var(--text-secondary); }
  .sched-full-block { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .sched-full-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .sched-full-block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 900; font-size: 13.5px; margin-bottom: 10px; }
  .sched-full-block-time { font-size: 11.5px; font-weight: 700; color: var(--text-muted); flex: none; }
  .today-side-due.overdue { color: var(--status-critical); }
  .today-side-empty { font-size: 12px; color: var(--text-muted); }
  .today-overflow .today-side-due { color: var(--text-muted); }

  .today-navbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .today-nav-controls { display: flex; align-items: center; gap: 8px; }
  .today-nav-label { font-weight: 800; font-size: 15px; margin-left: 4px; min-width: 140px; }
  .today-gran-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .today-gran-btn { padding: 6px 14px; font-size: 12px; font-weight: 700; background: var(--surface-1); color: var(--text-secondary); border: none; border-right: 1px solid var(--border); cursor: pointer; }
  .today-gran-btn:last-child { border-right: none; }
  .today-gran-btn:hover { background: var(--surface-2); }
  .today-gran-btn.active { background: var(--brand); color: #fff; }

  .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: start; }
  .wk-col { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); padding: 10px; cursor: pointer; min-height: 160px; }
  .wk-col:hover { background: var(--surface-2); }
  .wk-col.is-today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .wk-col-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--gridline); }
  .wk-dayname { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .wk-daynum { font-size: 15px; font-weight: 800; }
  .wk-col.is-today .wk-daynum { color: var(--brand); }
  .wk-col-body { display: flex; flex-direction: column; gap: 5px; }
  .wk-item { display: flex; gap: 6px; font-size: 11px; align-items: baseline; }
  .wk-item-time { color: var(--text-muted); font-weight: 700; flex: none; width: 46px; }
  .wk-item-body { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wk-item.wk-cal .wk-item-body { color: var(--brand); }
  .wk-item-count { color: var(--text-muted); font-weight: 700; margin-left: 4px; }
  .wk-empty { font-size: 11px; color: var(--text-muted); font-style: italic; }
  .wk-overflow { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }

  .mcal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 6px; }
  .mcal-weekday { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); text-align: center; }
  .mcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .mcal-cell { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); padding: 8px; min-height: 78px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .mcal-cell:hover { background: var(--surface-2); }
  .mcal-cell.mcal-outside { opacity: 0.4; }
  .mcal-cell.mcal-today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .mcal-daynum { font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 5px; }
  .mcal-evt-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); display: inline-block; }
  .mcal-dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .mcal-dot { width: 7px; height: 7px; border-radius: 50%; }
  .mcal-dot.priority-critical { background: var(--status-critical); }
  .mcal-dot.priority-high { background: rgba(208,59,59,0.65); }
  .mcal-dot.priority-medium { background: var(--text-muted); }
  .mcal-dot.priority-low { background: var(--gray-accent); }
  .mcal-more { font-size: 10px; color: var(--text-muted); font-weight: 700; }
  @media (max-width: 900px) {
    .week-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
