<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --ink:#1d2b2c; --teal:#15464A; --muted:#55696a; --line:#dfe6e6; --bg:#f4f6f6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.55;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  .test { background:#b3271e; color:#fff; font-weight:700; padding:10px 12px;
          border-radius:6px; margin-bottom:14px; text-align:center; letter-spacing:.5px; }
  .brand { background:var(--teal); color:#fff; border-radius:10px 10px 0 0; padding:22px 22px 20px; }
  .brand .eyebrow { font-size:11px; letter-spacing:2.5px; opacity:.8; }
  .brand .name { font-size:19px; font-weight:700; margin-top:5px; letter-spacing:.5px; }
  .card { background:#fff; border-radius:0 0 10px 10px; padding:22px; }
  h2 { font-size:21px; line-height:1.3; }
  label { display:block; margin:0 0 14px; font-weight:600; font-size:15px; }
  /* Match ANY text-ish input, not a list of types. The name field shipped
     without a type attribute and so matched none of them: it rendered inline and
     unstyled next to its label while email and phone were full-width boxes.
     Caught 2026-09-17 by rendering the real page rather than reading the CSS. */
  input:not([type=checkbox]):not([type=radio]), select {
    display:block; width:100%; margin-top:6px; padding:12px 12px; font-size:16px;
    font-family:inherit; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:8px; font-weight:400; }
  input:focus, select:focus { outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }
  .roles { display:flex; gap:10px; margin:-6px 0 16px; }
  .radio { flex:1; margin:0; display:flex; align-items:center; gap:8px; font-weight:600;
           border:1px solid var(--line); border-radius:8px; padding:12px; background:#fff;
           cursor:pointer; }
  .radio input { margin:0; width:18px; height:18px; accent-color:var(--teal); }
  .check { display:flex; gap:10px; align-items:flex-start; font-weight:400; font-size:13px;
           color:var(--muted); background:var(--bg); border-radius:8px; padding:14px;
           margin:4px 0 16px; cursor:pointer; }
  .check input { margin:2px 0 0; width:18px; height:18px; flex:0 0 auto; accent-color:var(--teal); }
  button { display:block; width:100%; font-family:inherit; font-size:16px; font-weight:700;
           padding:15px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .primary { background:var(--teal); color:#fff; }
  .primary:disabled { opacity:.55; cursor:default; }
  .ghost { background:#fff; color:var(--muted); border-color:var(--line); font-weight:600;
           font-size:14px; margin-top:10px; }
  .err { color:#b3271e; font-size:14px; font-weight:600; margin:0 0 10px; min-height:1px; }
  .failbox { background:#fbf1f0; border:1px solid #e3b9b5; border-left:4px solid #b3271e;
             border-radius:8px; padding:12px 14px; margin:0 0 14px; font-size:14px; line-height:1.45;
             font-weight:400; color:var(--ink); }
  .failbox .t { color:#b3271e; font-weight:700; }
  .failbox .d { margin-top:4px; color:var(--muted); font-size:13px; word-break:break-word; }
  .failbox .alt { margin-top:8px; font-size:12.5px; color:var(--muted); }
  .failbox button { margin-top:10px; }
  #failBanner { display:none; position:fixed; top:0; left:0; right:0; z-index:9998; background:#b3271e;
                color:#fff; font-weight:700; font-size:14px; padding:12px 16px; text-align:center;
                box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer; }
  #failBanner.on { display:block; }
  #busyOverlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:9997;
                 background:rgba(21,70,74,.975); color:#fff; text-align:center; padding:40px 24px; }
  #busyOverlay.on { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #busyOverlay .spin { width:46px; height:46px; border:4px solid rgba(255,255,255,.3); border-top-color:#fff;
                       border-radius:50%; animation:spin .9s linear infinite; margin-bottom:20px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #busyOverlay .what { font-size:22px; font-weight:700; }
  #busyOverlay .secs { margin-top:10px; font-size:16px; font-weight:700; }
  #busyOverlay .slow { margin-top:16px; font-size:13.5px; opacity:.9; max-width:320px; min-height:20px; }
  .locknote { margin:-8px 0 14px; font-size:13px; color:var(--muted); font-weight:400; line-height:1.45; }
  input[readonly] { cursor:not-allowed; }
  .done { text-align:center; padding:8px 0 4px; }
  .done .tick { font-size:42px; line-height:1; }
  .foot { text-align:center; padding:18px 6px 0; font-size:12px; color:#7d8f90; }
</style>
</head>
<body>
<div id="failBanner" role="alert"></div>
<div id="busyOverlay" role="status" aria-live="polite">
  <div class="spin"></div>
  <div class="what" id="busyWhat"></div>
  <div class="secs" id="busySecs"></div>
  <div class="slow" id="busySlow"></div>
</div>
<div class="wrap">
  <? if (isTest) { ?><div class="test">QA TEST MODE — not a real referral</div><? } ?>

  <div class="brand">
    <div class="eyebrow">THE STAWASZ GROUP</div>
    <div class="name">Keller Williams Empower</div>
  </div>

  <div class="card" id="card">
    <?!= bodyHtml ?>
  </div>

  <div class="foot">
    728 S Broad St, Philadelphia, PA 19146<br>
    (215) 760-6291 &middot; info@tsg.homes
  </div>
</div>

<script>
// Force-print tags everywhere a value lands in JavaScript: the bang form, not
// the plain one. The plain form HTML-escapes, which turns a quoted string into
// &quot;...&quot; and yields a syntax error or a silently wrong value. That
// mistake shipped once on the entry form (2026-09-16, the countdown that never
// appeared).
//
// AND THE TAGS ARE NOT SPELLED OUT IN THIS COMMENT ON PURPOSE. They used to be,
// as examples, and it broke this entire page: the template compiler does not
// know a scriptlet is inside a JS comment, so it read the example tags as
// force-print expressions that were EMPTY, compiled `output += ;` and threw
// "SyntaxError: Unexpected token ';'" on every render. The consent page -- the
// one page every referred stranger sees -- never rendered once in the real
// runtime until 2026-09-17. test_templates.js now fails on an empty scriptlet
// anywhere in any template, so this cannot come back.
var TOKEN  = "<?!= token ?>";
var FORMTK = "<?!= submitToken ?>";
var IS_TEST = "<?!= isTest ?>" === '1';

var go = document.getElementById('go');
var no = document.getElementById('no');

function el(id) { return document.getElementById(id); }
function setErr(m) { var e = el('err'); if (e) e.textContent = m || ''; }

function role() {
  var picked = document.querySelector('input[name="role"]:checked');
  return picked ? picked.value : '';
}

// Always the plain /macros/s/<id>/exec form (see RaffleConsole.html): a POST to
// the /a/macros/<domain>/ form runs the script and then answers with a Drive 404.
var ENDPOINT = window.location.href.split('?')[0].split('#')[0]
  .replace(/\/a\/macros\/[^\/]+\/s\//, '/macros/s/')
  .replace(/\/a\/[^\/]+\/macros\/s\//, '/macros/s/') + '?form=raffle';

// Same transport rules as the entry form: the reply is read as text and parsed,
// so an Apps Script error page is reported with its own words, and only a
// failed fetch is called a connection problem. onFail(info, retry) renders the
// failed state; `retry` re-sends the identical payload.
// Lockout while a request is in flight, and the loud banner on a failure.
function lock(what) {
  document.getElementById('failBanner').classList.remove('on');
  var overlay = document.getElementById('busyOverlay');
  var t0 = Date.now();
  document.getElementById('busyWhat').textContent = what;
  document.getElementById('busySecs').textContent = '0 s';
  document.getElementById('busySlow').textContent = '';
  overlay.classList.add('on');
  var iv = setInterval(function () {
    var s = Math.round((Date.now() - t0) / 1000);
    document.getElementById('busySecs').textContent = s + ' s';
    if (s >= 8) document.getElementById('busySlow').textContent = 'Still working. Do not reload; our server is slow, not your connection.';
  }, 1000);
  return function () { clearInterval(iv); overlay.classList.remove('on'); };
}
function post(payload, onDone, onFail) {
  var body = Object.assign({
    formType: 'raffle',
    formToken: FORMTK,
    token: TOKEN,
    website: ''            // honeypot, deliberately empty
  }, payload);
  var again = function () { post(payload, onDone, onFail); };
  var unlock = lock(payload.decision === 'decline' ? 'Saving your answer.' : 'Confirming your details.');
  var doneWrapped = onDone, failWrapped = onFail;
  onDone = function (res) { unlock(); doneWrapped(res); };
  onFail = function (info, retry) { unlock(); failWrapped(info, retry); };
  fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
  .then(function (r) {
    return r.text().then(function (text) {
      var data = null;
      try { data = JSON.parse(text); } catch (e) { data = null; }
      if (data && typeof data === 'object') return data;
      var err = new Error('server');
      err.kind = 'server'; err.status = r.status; err.detail = describeResponse_(text, r.status);
      throw err;
    });
  }, function (netErr) {
    var err = new Error('network'); err.kind = 'network';
    err.detail = String((netErr && netErr.message) || netErr || 'fetch failed');
    throw err;
  })
  .then(function (res) {
    if (res && res.serverError) {
      onFail({ title: 'Something went wrong on our side.',
               detail: (res.error || '') + (res.ref ? ' Reference ' + res.ref + '.' : '') }, again);
      return;
    }
    onDone(res);
  })
  .catch(function (err) {
    if (!err || !err.kind) {
      onFail({ title: 'This page hit an error.', detail: String((err && err.message) || err) }, again);
      return;
    }
    report(err);
    onFail(err.kind === 'network'
      ? { title: 'We could not reach our server.',
          detail: 'Your connection dropped when we tried (' + err.detail + '). Check your internet connection and retry. Nothing was recorded.' }
      : { title: 'Our server returned an error.',
          detail: 'It answered with an error page instead of a result: ' + err.detail + '. That is on our side. Retry in a moment.' },
      again);
  });
}
function describeResponse_(text, status) {
  var s = String(text || '');
  var title = ((s.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1] || '').replace(/\s+/g, ' ').trim();
  var body = s.replace(/<head[\s\S]*?<\/head>/gi, ' ').replace(/<title[\s\S]*?<\/title>/gi, ' ')
    .replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\s+/g, ' ').trim();
  var out = 'HTTP ' + status;
  if (title) out += ' · ' + title;
  if (body) out += ' · ' + body.slice(0, 240) + (body.length > 240 ? '…' : '');
  return out.replace(/[.\s]+$/, '');
}
function report(err) {
  try {
    fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      keepalive: true,
      body: JSON.stringify({ formType: 'raffle', formToken: FORMTK, website: '', step: 'report',
        failedStep: 'consent', kind: err.kind || 'page', status: err.status || 0,
        detail: String(err.detail || err.message || '').slice(0, 300), attempt: 1,
        ua: String(navigator.userAgent || '').slice(0, 200) })
    }).catch(function () {});
  } catch (e) { /* never throws */ }
}
// The failed state, in place of the one-line error: what failed, what the
// server said, a Retry that re-sends the same answer, and the fallback.
function showFail(info, retry, retryLabel) {
  var e = el('err');
  if (!e) return;
  e.innerHTML = '';
  var box = document.createElement('div'); box.className = 'failbox';
  var t = document.createElement('div'); t.className = 't'; t.textContent = info.title; box.appendChild(t);
  var d = document.createElement('div'); d.className = 'd'; d.textContent = info.detail || ''; box.appendChild(d);
  var b = document.createElement('button'); b.type = 'button'; b.className = 'primary';
  b.textContent = retryLabel || 'Retry';
  b.addEventListener('click', function () { setErr(''); retry(); });
  box.appendChild(b);
  var alt = document.createElement('div'); alt.className = 'alt';
  alt.textContent = 'If it fails again, reply to the email that brought you here and we will record your answer by hand.';
  box.appendChild(alt);
  e.appendChild(box);
  var banner = document.getElementById('failBanner');
  banner.textContent = info.title + ' Nothing was recorded. Tap for details and Retry.';
  banner.onclick = function () { try { box.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) {} };
  banner.classList.add('on');
  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (x) {}
  try { box.scrollIntoView({ block: 'center' }); } catch (x) {}
}

function finish(title, message) {
  document.getElementById('card').innerHTML =
    '<div class="done"><div class="tick">&#10003;</div>' +
    '<h2 style="margin:10px 0 8px">' + title + '</h2>' +
    '<p style="color:#55696a;margin:0">' + message + '</p></div>';
  window.scrollTo(0, 0);
}

if (go) {
  go.addEventListener('click', function () {
    setErr('');
    if (!el('consent').checked) {
      setErr('Please tick the consent box so we know it is okay to get in touch.');
      return;
    }
    if (!role()) { setErr('Let us know whether you are looking to buy or to sell.'); return; }
    go.disabled = true;
    go.textContent = 'Confirming…';
    var resetGo = function () { go.disabled = false; go.textContent = 'Confirm my details'; };
    post({
      step: 'consent',
      decision: 'confirm',
      consent: 'Yes',
      referralName: el('rName').value,
      // No referralEmail: the field is locked and the server reads the address
      // from the row regardless. Sending it would imply it still counts.
      referralPhone: el('rPhone').value,
      referralRole: role(),
      referralTimeframe: el('rTimeframe').value
    }, function (res) {
      if (res && res.ok) {
        finish('You are confirmed', res.message || 'Thank you.');
      } else {
        setErr((res && res.error) || 'That did not work. Try again.');
        resetGo();
      }
    }, function (info, retry) {
      resetGo();
      go.textContent = 'Confirm failed — retry';
      showFail(info, function () { go.disabled = true; go.textContent = 'Confirming…'; retry(); },
               'Retry confirming');
    });
  });
}

if (no) {
  no.addEventListener('click', function () {
    setErr('');
    no.disabled = true;
    no.textContent = 'Saving…';
    var resetNo = function () { no.disabled = false; no.textContent = 'No thanks — do not contact me'; };
    post({ step: 'consent', decision: 'decline' }, function (res) {
      if (res && res.ok) {
        finish('Understood', res.message || 'We will not contact you.');
      } else {
        setErr((res && res.error) || 'That did not work. Try again.');
        resetNo();
      }
    }, function (info, retry) {
      resetNo();
      showFail(info, function () { no.disabled = true; no.textContent = 'Saving…'; retry(); },
               'Retry');
    });
  });
}
</script>
</body>
</html>
