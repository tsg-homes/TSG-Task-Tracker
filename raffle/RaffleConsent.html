<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --ink:#1d2b2c; --teal:#15464A; --muted:#55696a; --line:#dfe6e6; --bg:#f4f6f6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.55;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  .test { background:#b3271e; color:#fff; font-weight:700; padding:10px 12px;
          border-radius:6px; margin-bottom:14px; text-align:center; letter-spacing:.5px; }
  .brand { background:var(--teal); color:#fff; border-radius:10px 10px 0 0; padding:22px 22px 20px; }
  .brand .eyebrow { font-size:11px; letter-spacing:2.5px; opacity:.8; }
  .brand .name { font-size:19px; font-weight:700; margin-top:5px; letter-spacing:.5px; }
  .card { background:#fff; border-radius:0 0 10px 10px; padding:22px; }
  h2 { font-size:21px; line-height:1.3; }
  label { display:block; margin:0 0 14px; font-weight:600; font-size:15px; }
  /* Match ANY text-ish input, not a list of types. The name field shipped
     without a type attribute and so matched none of them: it rendered inline and
     unstyled next to its label while email and phone were full-width boxes.
     Caught 2026-09-17 by rendering the real page rather than reading the CSS. */
  input:not([type=checkbox]):not([type=radio]), select {
    display:block; width:100%; margin-top:6px; padding:12px 12px; font-size:16px;
    font-family:inherit; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:8px; font-weight:400; }
  input:focus, select:focus { outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }
  .roles { display:flex; gap:10px; margin:-6px 0 16px; }
  .radio { flex:1; margin:0; display:flex; align-items:center; gap:8px; font-weight:600;
           border:1px solid var(--line); border-radius:8px; padding:12px; background:#fff;
           cursor:pointer; }
  .radio input { margin:0; width:18px; height:18px; accent-color:var(--teal); }
  .check { display:flex; gap:10px; align-items:flex-start; font-weight:400; font-size:13px;
           color:var(--muted); background:var(--bg); border-radius:8px; padding:14px;
           margin:4px 0 16px; cursor:pointer; }
  .check input { margin:2px 0 0; width:18px; height:18px; flex:0 0 auto; accent-color:var(--teal); }
  button { display:block; width:100%; font-family:inherit; font-size:16px; font-weight:700;
           padding:15px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .primary { background:var(--teal); color:#fff; }
  .primary:disabled { opacity:.55; cursor:default; }
  .ghost { background:#fff; color:var(--muted); border-color:var(--line); font-weight:600;
           font-size:14px; margin-top:10px; }
  .err { color:#b3271e; font-size:14px; font-weight:600; margin:0 0 10px; min-height:1px; }
  .locknote { margin:-8px 0 14px; font-size:13px; color:var(--muted); font-weight:400; line-height:1.45; }
  input[readonly] { cursor:not-allowed; }
  .done { text-align:center; padding:8px 0 4px; }
  .done .tick { font-size:42px; line-height:1; }
  .foot { text-align:center; padding:18px 6px 0; font-size:12px; color:#7d8f90; }
</style>
</head>
<body>
<div class="wrap">
  <? if (isTest) { ?><div class="test">QA TEST MODE — not a real referral</div><? } ?>

  <div class="brand">
    <div class="eyebrow">THE STAWASZ GROUP</div>
    <div class="name">Keller Williams Empower</div>
  </div>

  <div class="card" id="card">
    <?!= bodyHtml ?>
  </div>

  <div class="foot">
    728 S Broad St, Philadelphia, PA 19146<br>
    (215) 760-6291 &middot; info@tsg.homes
  </div>
</div>

<script>
// Force-print tags (<?!= ?>) everywhere a value lands in JavaScript. A plain
// <?= ?> HTML-escapes, which turns a quoted string into &quot;...&quot; and
// yields a syntax error or a silently wrong value. That exact mistake shipped
// once on the entry form (2026-09-16, the countdown that never appeared), so it
// is called out here rather than left to be rediscovered.
var TOKEN  = "<?!= token ?>";
var FORMTK = "<?!= submitToken ?>";
var IS_TEST = "<?!= isTest ?>" === '1';

var go = document.getElementById('go');
var no = document.getElementById('no');

function el(id) { return document.getElementById(id); }
function setErr(m) { var e = el('err'); if (e) e.textContent = m || ''; }

function role() {
  var picked = document.querySelector('input[name="role"]:checked');
  return picked ? picked.value : '';
}

function post(payload, onDone) {
  var body = Object.assign({
    formType: 'raffle',
    formToken: FORMTK,
    token: TOKEN,
    website: ''            // honeypot, deliberately empty
  }, payload);
  fetch(window.location.href.split('?')[0] + '?form=raffle', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
  .then(function (r) { return r.json(); })
  .then(onDone)
  .catch(function () {
    setErr('Could not reach us — check your signal and try again.');
    if (go) { go.disabled = false; go.textContent = 'Confirm my details'; }
  });
}

function finish(title, message) {
  document.getElementById('card').innerHTML =
    '<div class="done"><div class="tick">&#10003;</div>' +
    '<h2 style="margin:10px 0 8px">' + title + '</h2>' +
    '<p style="color:#55696a;margin:0">' + message + '</p></div>';
  window.scrollTo(0, 0);
}

if (go) {
  go.addEventListener('click', function () {
    setErr('');
    if (!el('consent').checked) {
      setErr('Please tick the consent box so we know it is okay to get in touch.');
      return;
    }
    if (!role()) { setErr('Let us know whether you are looking to buy or to sell.'); return; }
    go.disabled = true;
    go.textContent = 'Confirming…';
    post({
      step: 'consent',
      decision: 'confirm',
      consent: 'Yes',
      referralName: el('rName').value,
      // No referralEmail: the field is locked and the server reads the address
      // from the row regardless. Sending it would imply it still counts.
      referralPhone: el('rPhone').value,
      referralRole: role(),
      referralTimeframe: el('rTimeframe').value
    }, function (res) {
      if (res && res.ok) {
        finish('You are confirmed', res.message || 'Thank you.');
      } else {
        setErr((res && res.error) || 'That did not work. Try again.');
        go.disabled = false;
        go.textContent = 'Confirm my details';
      }
    });
  });
}

if (no) {
  no.addEventListener('click', function () {
    setErr('');
    no.disabled = true;
    no.textContent = 'Saving…';
    post({ step: 'consent', decision: 'decline' }, function (res) {
      if (res && res.ok) {
        finish('Understood', res.message || 'We will not contact you.');
      } else {
        setErr((res && res.error) || 'That did not work. Try again.');
        no.disabled = false;
        no.textContent = 'No thanks — do not contact me';
      }
    });
  });
}
</script>
</body>
</html>
